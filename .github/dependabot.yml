version: 2

# Scheduled version-drift updates for Go modules and GitHub Actions, separate
# from the Dependabot security alerts/updates already active on this repo
# (those fire on a published CVE regardless of this file).
#
# Not Renovate: Renovate cannot be enrolled for a public repository under the
# org's current system, so it stays scoped to the one thing it already covers,
# the pinned Claude Code CLI version (.github/renovate.json). Tracked under
# SOL-152808.
#
# Why Dependabot's pull requests satisfy the required `DCO` check, stated
# precisely because the obvious explanation is wrong: its commits DO carry a
# trailer — `Signed-off-by: dependabot[bot] <support@github.com>` on 20ddc122
# (PR #289) — but that address matches neither the author
# (49699333+dependabot[bot]@users.noreply.github.com) nor the committer
# (noreply@github.com), and dco2 requires a match (`signoffs_match`). The
# trailer is never read: `should_skip_commit` short-circuits on
# `author.is_bot` and returns `FromBot` first. Dependabot cannot be configured
# to emit a matching trailer at all (dependabot-core#3480, closed not-planned).
#
# So the pass is an exemption, not a sign-off, and it is BROADER than the one it
# replaced. The retired .github/workflows/dco.yaml exempted a single bot by
# login, unforgeable and auditable in-repo. dco2 skips every bot-authored commit
# unconditionally; its config surface (allowOverrideAction,
# allowRemediationCommits, require.members) has no key to narrow or disable
# that. Accepted deliberately — a pull request cannot edit an App that evaluates
# commits server-side, which the workflow it replaced could not claim — but the
# widening is real and should be weighed as this repo goes public, not treated
# as equivalent.
#
# `cooldown` holds every update back until the release is at least 14 days old,
# so a freshly-published (and possibly yanked or compromised) version is not
# proposed the moment it lands. Renovate applies the same 14-day window via
# `minimumReleaseAge` in .github/renovate.json.
updates:
  # Four go.mod files exist in this repo; each needs its own entry because
  # Dependabot's `directory` matches exactly one path per ecosystem entry.
  # Leaving out any test module would silently under-cover it, which is
  # worse than an explicit, visible entry that does nothing most weeks.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 14
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
        # gobreaker excluded (SOL-152286): internal/tokenexchange leans on
        # three of its v2.4.0 callback behaviors that are not documented
        # contract, only one of which is test-covered. A minor/patch bump
        # here needs a human reading its changelog, not an auto-merge.
        #
        # go-sdk excluded (SOL-156383): the stateless transport migration
        # depends on SDK internals, and the SDK removes its MCPGODEBUG
        # compatibility settings on a published schedule (v1.9.0 for one).
        # Excluded from the group, not ignored, so each SDK bump still opens
        # its own named PR. SOL-154338 removes the exclusion.
        exclude-patterns:
          - "github.com/sony/gobreaker/*"
          - "github.com/modelcontextprotocol/go-sdk"
      go-major:
        update-types: ["major"]
    # Grouping caps this directory at 2 open PRs per run (minor/patch, major),
    # so the default cap of 5 was never actually at risk. Set explicitly anyway
    # so the choice reads as deliberate rather than an unnoticed default.
    open-pull-requests-limit: 10

  - package-ecosystem: "gomod"
    directory: "/test/e2e-common/broker-driver"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 14
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
      go-major:
        update-types: ["major"]
    open-pull-requests-limit: 10

  # semp-tap imports only the standard library today, so this entry has
  # nothing to update until it gains a dependency.
  - package-ecosystem: "gomod"
    directory: "/test/e2e-common/semp-tap"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 14
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
      go-major:
        update-types: ["major"]
    open-pull-requests-limit: 10

  - package-ecosystem: "gomod"
    directory: "/test/e2e-basic-mcp/agent"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 14
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
        # Same go-sdk exclusion as the root module (SOL-156383): this module
        # also requires the SDK, so a grouped bump here would carry it in.
        exclude-patterns: ["github.com/modelcontextprotocol/go-sdk"]
      go-major:
        update-types: ["major"]
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    # Actions ecosystem always resolves workflow files under .github/workflows
    # regardless of `directory`; "/" is the only sensible value and is not a
    # per-module path the way it is for the gomod entries above.
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 14
      exclude:
        - "Solace*"
    groups:
      internal-reusable-workflows:
        patterns:
          - "Solace*"
      third-party-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "Solace*"
    open-pull-requests-limit: 10
