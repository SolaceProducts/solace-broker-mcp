name: Build and Test

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # -race enables the Go race detector to catch data races on shared state (e.g. BrokerPool).
        # This adds ~2-3x overhead to test execution. Acceptable now given the small test suite,
        # but worth revisiting if test times become a problem as the suite grows.
        run: go test -race -v ./...

      - name: Check for test files
        run: |
          TEST_FILES=$(find . -name '*_test.go' -not -path './vendor/*' | head -1)
          if [ -z "$TEST_FILES" ]; then
            echo "::warning::⚠️ No test files (*_test.go) found in the project. Please add tests."
          else
            echo "✅ Test files found. You can now remove this step"
          fi

# --- FUTURE ENHANCEMENTS ---
#
# 1. Make test warning a hard failure
#    Once the team has tests in place, change the "Check for test files" step
#    to fail the build if no *_test.go files are found, ensuring no PR can
#    merge without tests.
