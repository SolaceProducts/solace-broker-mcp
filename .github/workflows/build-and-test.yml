      - name: Start Solace brokers
        run: SUITE_DIR=test/e2e-action bash test/e2e-common/setup-brokers.sh

      - name: Run E2E tests
        run: bash test/e2e-action/run-all.sh

      - name: Broker logs (on failure)
        if: failure()
        run: |
          echo "=== solace-e2e-act-a ==="
          docker logs solace-e2e-act-a 2>&1 | tail -100
          echo "=== solace-e2e-act-b ==="
          docker logs solace-e2e-act-b 2>&1 | tail -100

      - name: MCP server log (on failure)
        if: failure()
        run: cat test/e2e-action/bin/mcp-server.log 2>/dev/null || echo "No server log found"

      - name: Tear down brokers
