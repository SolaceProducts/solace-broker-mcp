name: Build and Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Check for test files
        run: |
          TEST_FILES=$(find . -name '*_test.go' -not -path './vendor/*' | head -1)
          if [ -z "$TEST_FILES" ]; then
            echo "::warning::⚠️ No test files (*_test.go) found in the project. Please add tests."
          else
            echo "✅ Test files found. You can now remove this step"
          fi

