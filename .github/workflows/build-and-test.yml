name: Build and Test

# WHY `push` IS SCOPED TO main AND `pull_request` CARRIES FEATURE BRANCHES
#
# These seven jobs are required status checks. A check that never reports on a
# pull request leaves the required context pending forever, which is how a fork
# contribution used to become unmergeable: `push` fires in the contributor's
# fork, never against this repository's commit.
#
# `pull_request` fixes that, but keeping `push: '**'` alongside it would run
# every check twice on same-repo pull requests, including five Dockerized e2e
# suites.
#
# The alternative worth naming is not gating on event name. It is keeping
# `push: '**'`, adding `pull_request`, and gating each job on fork-ness:
#
#   if: github.event_name == 'push'
#       || github.event.pull_request.head.repo.full_name != github.repository
#
# That option does preserve pre-pull-request branch CI, declaratively, with no
# API call: a push to any branch runs, a same-repo pull request all-skips
# cheaply, and a fork pull request runs the contexts for the first time.
#
# It is rejected for a sharper reason than cost. It puts two check runs with the
# same name on the same head SHA: a real `lint` from the push run and a skipped
# `lint` from the pull-request run. If branch protection resolves a required
# context against the most recent check run of that name, the gate becomes
# order-dependent, and a skipped run landing last is a green gate over a red job.
# This file exists because GitHub's skip-and-report behavior is asymmetric, so a
# design that makes the gate depend on arrival order is the wrong trade even
# though it is cheaper.
#
# The cost, stated plainly: pushing a feature branch no longer runs CI on its
# own. Two ways to get it, most convenient first:
#
#   1. `workflow_dispatch` runs the full suite on any ref, no pull request
#      needed: `gh workflow run build-and-test.yml --ref my-branch`. Dispatch
#      requires write access, so it adds no fork exposure. Same
#      `workflow_dispatch` pattern as `guardian-scan.yaml` and `llm-eval.yml`.
#   2. Open the pull request. A draft is enough; `opened` and `synchronize` both
#      fire for drafts.
#
# `workflow_call` stays because release.yml calls this workflow on a `v*` tag
# push. The `tags-ignore: ['v*']` that used to sit here was load-bearing, not
# dead config, and the mechanism is worth stating correctly: the old trigger
# defined both `branches` and `tags-ignore`, so the tag ref was not undefined and
# a non-`v*` tag push did run this workflow. What stops every tag push from
# triggering it now is narrowing `branches` to main and dropping `tags-ignore`
# together, because a filter list naming only `branches` leaves the tag ref
# undefined.
#
# `merge_group` is here because a merge queue tests each entry on a
# `gh-readonly-queue/...` branch: bound to `pull_request` alone, none of these
# required contexts would report there and every entry would hang until it was
# ejected (SOL-152974). No `branches:` filter — GitHub does not document what one
# matches for this event, and a filter matching nothing recreates that same hang.
# `push` is scoped to `main`, so a queue entry does not double-run; the
# post-merge push run on the SHA the queue just validated is the accepted
# duplication — it is what keeps per-commit trunk verdicts.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    # Scoped to main deliberately. Without this, a pull request against a
    # throwaway base would spin up five Dockerized e2e suites for a branch
    # nothing merges into. Add a branch here if the project starts taking pull
    # requests against release branches.
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:

# Cancel superseded pull-request runs, never superseded pushes to main: every
# commit on main must keep its own FOSSA verdict and e2e result.
#
# The non-pull-request fallback is `github.sha`, not `github.ref`, and the
# difference is not cosmetic. Keying every push to main as `refs/heads/main` puts
# them all in one group, and `cancel-in-progress: false` does not mean "let them
# all run". GitHub holds at most one pending run per group, and per the
# workflow-syntax reference, "any existing `pending` job or workflow in the same
# concurrency group will be canceled and the new queued job or workflow will take
# its place." So a burst of three merges runs the first, queues the second, then
# drops the second when the third arrives. The middle commit lands on main with
# no FOSSA verdict and no e2e result, the exact outcome the paragraph above
# exists to prevent. `queue: max` would also fix it, at the cost of serializing
# main behind the longest e2e run. Per-commit groups cost nothing and delay
# nothing.
#
# Known and bounded: tagging a commit already running as a main push collides,
# because both resolve to the same `github.sha`. That costs the release run a
# wait, not a verdict. Two runs in a group means one runs and one pends, and
# nothing is dropped until a third arrives.
#
# Inside a Release run this expression is Release-<sha>, because a called
# workflow's github.workflow is the caller name. guardian-scan.yaml computes
# the same string, so test and the Guardian scan already share one queue.
# A third workflow Release calls joins that queue and cancels whichever
# member is waiting. A new callee must use a literal group name.
# llm-eval.yml uses llm-eval-<sha>, and llm-eval-nightly for its schedule.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only for every job; scanning and its elevated scopes moved to
# guardian-scan.yaml.
#
# This used to be one workflow-level block granting `pull-requests: write`,
# `id-token: write`, `checks: write`, and `statuses: write` to every job. That
# mattered little while the only trigger was `push`; it matters now that
# `pull_request` is a trigger and the e2e jobs execute shell scripts taken from
# the pull request's own ref. `statuses: write` is the sharp one — a step holding
# it can POST a successful status under a context name that branch protection
# requires, which is a way around the gate rather than through it.
#
# Forks were never exposed to this: GitHub forces a read-only token on a
# fork-triggered `pull_request` run whatever a workflow asks for. The exposure
# was a same-repo branch, and narrowing the default closes it.
#
# `contents: read` is all the seven build and test jobs need.
# golangci-lint-action emits annotations as stdout workflow commands, not through
# the checks API, so it needs no `checks: write` — the previous comment here
# claimed otherwise and was wrong.
permissions:
  contents: read

# Supply-chain scanning moved to guardian-scan.yaml; this workflow is now
# lint/build/e2e only.
jobs:
  lint:
    runs-on: ubuntu-latest
    # 30-minute bounds on every job here (e2e-oauth carried one first; same
    # rationale): the whole workflow finishes in 9-12 minutes, and GitHub's
    # 360-minute default means a wedged dependency holds a runner for six hours.
    # A merge queue multiplies that — the entry ejects at the queue's own
    # timeout while the abandoned run keeps burning (SOL-152974).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          # The action's fallback restore key is prefixed on OS + workdir +
          # interval bucket, not the source tree or .golangci.yml. The go.mod
          # hash only narrows the primary key, so a go.mod change still restores
          # a cache saved under a different hash in the same bucket. The interval
          # bucket -- floor(epoch/86400), turning over at 00:00 UTC -- is what
          # actually bounds staleness, so set it to 1 day (default is 7) so any
          # stale analysis facts self-heal quickly. The flaky SA5011 that once
          # made this dangerous (PR #150) is fixed at the source, so caching is
          # safe again.
          cache-invalidation-interval: 1
          # --verbose surfaces per-linter timing, the active-linter list, and
          # package-load stats. With caching on a warm run legitimately analyzes
          # fewer packages, but the output still confirms which linters ran.
          args: --verbose

      # Needs no broker and no server: curl is stubbed. It holds mcp_initialize to
      # the mode's session-ID contract in both directions, so a stateful server
      # that stops issuing an ID cannot pass the e2e suites unnoticed.
      - name: E2E handshake helper self-test
        run: bash test/e2e-common/lib.test.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: |
          go vet ./...
          (cd test/e2e-common/broker-driver && go vet ./...)
          (cd test/e2e-common/semp-tap && go vet ./...)

      - name: Test
        # -race enables the Go race detector to catch data races on shared state (e.g. BrokerPool).
        # This adds ~2-3x overhead to test execution. Acceptable now given the small test suite,
        # but worth revisiting if test times become a problem as the suite grows.
        #
        # `make test-cover` also enforces the 85% aggregate coverage floor from the same run
        # (no separate test pass) — see docs/internal/unit-test-coverage.md for the policy
        # and what this floor can/can't catch (it's a backstop, not a regression detector —
        # per-package coverage deltas in review are what catch a small localized regression).
        run: make test-cover

      - name: Benchmark
        # Informational, not a pass/fail gate — wall-clock timing is too CI-noisy to
        # threshold reliably (runner contention, no dedicated hardware). The actual
        # regression gate for tool-payload size is TestToolListBudget (byte/token
        # thresholds in cmd/server), which runs as a normal test above and does fail
        # CI. This step just makes ns/op and B/op visible in the Actions log so a
        # marshalling regression (e.g. an accidental O(n^2) in a postprocess handler)
        # is easy to spot in review, per SOL-152125. continue-on-error backs that
        # "informational" claim with an actual guarantee — without it, any non-zero
        # exit here (even one unrelated to a real regression) would fail the whole
        # build job, contradicting this step's stated purpose.
        continue-on-error: true
        run: make bench

      - name: Check for test files
        run: |
          TEST_FILES=$(find . -name '*_test.go' -not -path './vendor/*' | head -1)
          if [ -z "$TEST_FILES" ]; then
            echo "::warning::⚠️ No test files (*_test.go) found in the project. Please add tests."
          else
            echo "✅ Test files found. You can now remove this step"
          fi

      - name: Validate OTel collector K8s manifests
        # go install pins to a specific module version and the Go checksum database
        # verifies the download — no separate SHA check needed. Consistent with
        # the Go toolchain already installed above.
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          kubeconform -summary deploy/otel-collector/kubernetes/

  # Helm chart (deploy/charts/solace-broker-mcp) Tiers 1-2: lint and schema,
  # then helm-unittest template tests. Seconds, no cluster. Runs on every event
  # this workflow does — like every job here it has no `paths:` filter, since a
  # filtered-out required check never reports and blocks the merge.
  # `make helm-check` runs the same steps locally with the same ct.yaml.
  #
  # Helm, helm-unittest and ct are release tarballs checked against pinned
  # SHA-256 digests; kubeconform is a `go install` at a pinned version (checked
  # by the Go checksum database); yamllint and yamale are pinned top-level
  # `pipx install`s whose own dependencies are not pinned. All six are listed in
  # THIRD_PARTY_BUILD_TEST.md § CI Tools. Helm and helm-unittest are pinned
  # together: helm-unittest 1.1+ uses a `platformHooks` plugin field that older
  # Helm rejects. HELM_VERSION/HELM_SHA256 are duplicated in helm-chart-e2e.yml
  # and ci-pr.yaml; bump all three together.
  helm-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HELM_VERSION: v3.22.1
      HELM_SHA256: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea
      HELM_UNITTEST_VERSION: 1.2.1
      HELM_UNITTEST_SHA256: 48e86ecc1467b009630e5954375e5d8494139f73b466df5fe8c04fa45b634939
      CT_VERSION: 3.15.0
      CT_SHA256: 467561730f25fe09d5e6cd09a3e1f6aa759871c657a57602947c716d9be2c583
      # ct lint shells out to both.
      YAMLLINT_VERSION: 1.38.0
      YAMALE_VERSION: 6.1.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ct's changed-chart detection diffs against the target branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install Helm, helm-unittest, chart-testing, kubeconform
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/helm-tools"
          bin="$HOME/.local/bin"
          mkdir -p "$tmp" "$bin" "$HOME/.ct"

          curl -fsSLo "$tmp/helm.tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  $tmp/helm.tgz" | sha256sum -c -
          tar -xzf "$tmp/helm.tgz" -C "$tmp" linux-amd64/helm
          install -m 0755 "$tmp/linux-amd64/helm" "$bin/helm"

          # The release tarball carries plugin.yaml and the binary, so it is
          # unpacked straight into the plugins directory: no install hook runs
          # and nothing is downloaded beyond the checksummed file.
          curl -fsSLo "$tmp/unittest.tgz" "https://github.com/helm-unittest/helm-unittest/releases/download/v${HELM_UNITTEST_VERSION}/helm-unittest-linux-amd64-${HELM_UNITTEST_VERSION}.tgz"
          echo "${HELM_UNITTEST_SHA256}  $tmp/unittest.tgz" | sha256sum -c -
          plugins="$("$bin/helm" env HELM_PLUGINS)"
          mkdir -p "$plugins/helm-unittest"
          tar -xzf "$tmp/unittest.tgz" -C "$plugins/helm-unittest"

          # ct reads its chart schema and yamllint config from ~/.ct.
          curl -fsSLo "$tmp/ct.tgz" "https://github.com/helm/chart-testing/releases/download/v${CT_VERSION}/chart-testing_${CT_VERSION}_linux_amd64.tar.gz"
          echo "${CT_SHA256}  $tmp/ct.tgz" | sha256sum -c -
          tar -xzf "$tmp/ct.tgz" -C "$tmp" ct etc/chart_schema.yaml etc/lintconf.yaml
          install -m 0755 "$tmp/ct" "$bin/ct"
          cp "$tmp/etc/chart_schema.yaml" "$tmp/etc/lintconf.yaml" "$HOME/.ct/"

          pipx install "yamllint==${YAMLLINT_VERSION}"
          pipx install "yamale==${YAMALE_VERSION}"

          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7

          echo "$bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          helm version
          helm plugin list
          ct version
          kubeconform -v

      - name: Lint chart with every ci/*-values.yaml (Tier 1)
        # --all: without it ct lints only charts changed against main, so a
        # push, a release, or a PR not touching the chart would lint nothing.
        run: ct lint --config deploy/charts/ct.yaml --all

      - name: Require a chart version bump (Tier 1)
        # --all disables ct's version-increment check, so a second pass with
        # changed-chart detection enforces it on pull requests only.
        if: github.event_name == 'pull_request'
        run: ct lint --config deploy/charts/ct.yaml --check-version-increment

      - name: Validate rendered manifests with kubeconform (Tier 1)
        # helm lint and helm-unittest do not validate against the Kubernetes
        # API. Rendered to a file and fed on stdin: a failed render piped into
        # kubeconform would be a vacuous pass. Built-in schemas only, so the
        # ServiceMonitor (a CRD kind) is skipped: it is validated against the
        # CRD catalog in ci-pr.yaml's "Kubernetes manifests valid" job, which
        # keeps that network dependency out of this required check.
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rendered.yaml"
          for f in deploy/charts/solace-broker-mcp/ci/*-values.yaml; do
            echo "kubeconform: $f"
            helm template ci deploy/charts/solace-broker-mcp -f "$f" >"$out"
            kubeconform -strict -summary -skip ServiceMonitor <"$out"
          done

      - name: Template unit tests (Tier 2)
        run: helm unittest deploy/charts/solace-broker-mcp

  e2e-basic-mcp:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Start Solace brokers
        run: SUITE_DIR=test/e2e-basic-mcp bash test/e2e-common/setup-brokers.sh

      - name: Run E2E tests
        run: bash test/e2e-basic-mcp/run-all.sh

      - name: Broker logs (on failure)
        if: failure()
        run: |
          echo "=== solace-e2e-a ==="
          docker logs solace-e2e-a 2>&1 | tail -100
          echo "=== solace-e2e-b ==="
          docker logs solace-e2e-b 2>&1 | tail -100

      # The throttling scenario's verdict is a claim about timing, so on failure
      # the raw evidence has to come back with it. The records are the arrival
      # and header-return timestamps the assertions were computed from, and the
      # per-phase configs say which limits were actually in force (they carry
      # only ${VAR} placeholders, never resolved credentials). The config glob
      # also covers the audit-drop scenario's config (SOL-154569), for the same
      # reason: it says which log_level and metrics address were in force.
      #
      # Deliberately not the MCP server log. This step fires on ANY failure in
      # the job, not just this scenario's, so tailing the server log here would
      # publish it to the Actions log for scenarios that never asked for it, and
      # the suite has not needed it until now.
      - name: Restart-scenario evidence (on failure)
        if: failure()
        run: |
          for f in test/e2e-basic-mcp/bin/throttle-record-*.csv; do
            [ -e "$f" ] || continue
            echo "=== $f ($(wc -l < "$f") requests) ==="
            cat "$f"
          done
          for f in test/e2e-basic-mcp/bin/mcp-config-*.yaml; do
            [ -e "$f" ] || continue
            echo "=== $f ==="
            cat "$f"
          done
          echo "=== semp-tap log ==="
          tail -100 test/e2e-basic-mcp/bin/semp-tap.log 2>/dev/null || echo "no tap log"

      - name: Tear down brokers
        if: always()
        run: docker compose -f test/e2e-basic-mcp/docker-compose.yml down -v

  # The same suite against a stateless server (MCP_TRANSPORT_STATELESS=true). It is
  # a separate job, not a matrix leg of e2e-basic-mcp, so the required check named
  # e2e-basic-mcp keeps its name and stays stateful, which is still the default. The
  # job-level variable reaches the server through start-server.sh, and an
  # environment variable wins over test/e2e-basic-mcp/.env.
  #
  # A pass shows the handshake and tool calls work with no Mcp-Session-Id, over the
  # 2025-11-25 wire the shell helpers pin. Scenario 2 also drives a go-sdk client
  # against the stateless server, so a red there is a real finding about that
  # client, not only about the shell helpers. A pass does not show compatibility
  # of other clients, behaviour across replicas, or 2026-07-28, so
  # docs/configuration.md still says to leave the flag off in production.
  e2e-basic-mcp-stateless:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    env:
      MCP_TRANSPORT_STATELESS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Start Solace brokers
        run: SUITE_DIR=test/e2e-basic-mcp bash test/e2e-common/setup-brokers.sh

      - name: Run E2E tests
        run: bash test/e2e-basic-mcp/run-all.sh

      - name: Broker logs (on failure)
        if: failure()
        run: |
          echo "=== solace-e2e-a ==="
          docker logs solace-e2e-a 2>&1 | tail -100
          echo "=== solace-e2e-b ==="
          docker logs solace-e2e-b 2>&1 | tail -100

      # The throttling scenario's verdict is a claim about timing, so on failure
      # the raw evidence has to come back with it. The records are the arrival
      # and header-return timestamps the assertions were computed from, and the
      # per-phase configs say which limits were actually in force (they carry
      # only ${VAR} placeholders, never resolved credentials). The config glob
      # also covers the audit-drop scenario's config (SOL-154569), for the same
      # reason: it says which log_level and metrics address were in force.
      #
      # Deliberately not the MCP server log. This step fires on ANY failure in
      # the job, not just this scenario's, so tailing the server log here would
      # publish it to the Actions log for scenarios that never asked for it, and
      # the suite has not needed it until now.
      - name: Restart-scenario evidence (on failure)
        if: failure()
        run: |
          for f in test/e2e-basic-mcp/bin/throttle-record-*.csv; do
            [ -e "$f" ] || continue
            echo "=== $f ($(wc -l < "$f") requests) ==="
            cat "$f"
          done
          for f in test/e2e-basic-mcp/bin/mcp-config-*.yaml; do
            [ -e "$f" ] || continue
            echo "=== $f ==="
            cat "$f"
          done
          echo "=== semp-tap log ==="
          tail -100 test/e2e-basic-mcp/bin/semp-tap.log 2>/dev/null || echo "no tap log"

      - name: Tear down brokers
        if: always()
        run: docker compose -f test/e2e-basic-mcp/docker-compose.yml down -v

  e2e-oauth:
    runs-on: ubuntu-latest
    needs: build
    # The suite's curls into Keycloak/broker/MCP are individually bounded, but
    # a dependency that accepts TCP and never answers would otherwise sit on
    # GitHub's 360-minute default. The full cycle runs in ~1 minute warm.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Generate dev TLS certs
        run: |
          source test/e2e-oauth/helpers.sh
          ensure_tls_certs

      - name: Start Keycloak + brokers
        run: docker compose -f test/e2e-oauth/docker-compose.yml up -d

      - name: Wait for brokers + Keycloak
        run: |
          source test/e2e-oauth/helpers.sh
          wait_for_all_brokers 120
          wait_for_keycloak 120

      - name: Configure OAuth profiles
        run: bash test/e2e-oauth/configure-oauth-profiles.sh

      - name: Run E2E tests
        run: bash test/e2e-oauth/run-all.sh

      - name: Broker logs (on failure)
        if: failure()
        run: |
          echo "=== solace-e2e-oauth-a ==="
          docker logs solace-e2e-oauth-a 2>&1 | tail -100
          echo "=== solace-e2e-oauth-b ==="
          docker logs solace-e2e-oauth-b 2>&1 | tail -100

      - name: Keycloak logs (on failure)
        if: failure()
        run: docker logs keycloak-e2e-oauth 2>&1 | tail -100

      - name: MCP server log (on failure)
        if: failure()
        # The suite restarts the server between phases and rotates the previous
        # phase's log to mcp-server.log.N, so collect every one — the failing
        # phase is often not the last. Rotated files first, since they are the
        # earlier phases and a later failure is often a cascade from them.
        run: |
          shopt -s nullglob
          logs=(test/e2e-oauth/bin/mcp-server.log.[0-9]* test/e2e-oauth/bin/mcp-server.log)
          if [ ${#logs[@]} -eq 0 ]; then echo "No server log found"; fi
          for f in "${logs[@]}"; do echo "=== $f ==="; cat "$f"; done

      - name: Generated MCP server configs (on failure)
        if: failure()
        # Each phase's meaning lives in its tool_authorization block; without
        # these, a CI-only failure gives no way to see what the server ran with.
        run: |
          shopt -s nullglob
          for f in test/e2e-oauth/bin/mcp-config-*.yaml; do echo "=== $f ==="; cat "$f"; done

      - name: Broker OAuth profile snapshot (on failure)
        if: failure()
        run: |
          source test/e2e-oauth/helpers.sh
          echo "=== prod-us oauthProfile ==="
          semp_curl -s "http://localhost:${BROKER_A_SEMP_PORT}/SEMP/v2/config/oauthProfiles/keycloak_profile" || true
          echo
          echo "=== test-us oauthProfile ==="
          semp_curl -s "http://localhost:${BROKER_B_SEMP_PORT}/SEMP/v2/config/oauthProfiles/keycloak_profile" || true

      - name: Tear down
        if: always()
        run: docker compose -f test/e2e-oauth/docker-compose.yml down -v

  e2e-monitoring:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Start Solace brokers
        run: SUITE_DIR=test/e2e-monitoring bash test/e2e-common/setup-brokers.sh

      - name: Run E2E tests
        run: bash test/e2e-monitoring/run-all.sh

      - name: Broker logs (on failure)
        if: failure()
        run: |
          echo "=== solace-e2e-mon-a ==="
          docker logs solace-e2e-mon-a 2>&1 | tail -100
          echo "=== solace-e2e-mon-b ==="
          docker logs solace-e2e-mon-b 2>&1 | tail -100

      - name: MCP server log (on failure)
        if: failure()
        run: cat test/e2e-monitoring/bin/mcp-server.log 2>/dev/null || echo "No server log found"

      - name: Tear down brokers
        if: always()
        run: docker compose -f test/e2e-monitoring/docker-compose.yml down -v


  e2e-management:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Start Solace brokers
        run: SUITE_DIR=test/e2e-management bash test/e2e-common/setup-brokers.sh

      # A step-level timeout, shorter than the job's: a Kafka or bridge hang then ends
      # this step as a failure, so the "(on failure)" steps below still run. If the
      # job-level timeout fired instead, the job would be cancelled and those steps,
      # including the Kafka log, would be skipped, on exactly the run that needs them.
      - name: Run E2E tests
        timeout-minutes: 24
        run: bash test/e2e-management/run-all.sh

      - name: Broker logs (on failure)
        if: failure()
        run: |
          echo "=== solace-e2e-mgmt-a ==="
          docker logs solace-e2e-mgmt-a 2>&1 | tail -100
          echo "=== solace-e2e-mgmt-b ==="
          docker logs solace-e2e-mgmt-b 2>&1 | tail -100
          echo "=== kafka-e2e-mgmt ==="
          docker logs kafka-e2e-mgmt 2>&1 | tail -100

      - name: MCP server log (on failure)
        if: failure()
        run: cat test/e2e-management/bin/mcp-server.log 2>/dev/null || echo "No server log found"

      - name: Tear down brokers
        if: always()
        run: docker compose -f test/e2e-management/docker-compose.yml down -v

