name: Build and Test

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  workflow_call:

# Minimal token permissions — read-only access to repo contents.
# golangci-lint-action uses checks: write to post inline annotations on PRs.
# FOSSA scan requires id-token, pull-requests, actions, packages, and statuses.
permissions:
  contents: read
  packages: read
  pull-requests: write
  id-token: write
  actions: read
  checks: write
  statuses: write

jobs:
  fossa_scan:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    name: FOSSA Scan
    uses: SolaceDev/solace-public-workflows/.github/workflows/sca-scan-and-guard.yaml@main
    with:
      use_vault: true
      config_file: '.github/workflow-config.json'

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          # Disable the analysis cache. Its key is
          # os + cwd + interval + go.mod hash, so it does not invalidate on
          # source or .golangci.yml changes and can restore stale staticcheck
          # facts that produce phantom diagnostics against current sources
          # (seen as flaky SA5011 on PR #150). Trading ~30s per run for
          # honest, reproducible lint results.
          skip-cache: true
          # --verbose surfaces per-linter timing, active-linter list, and
          # package-load stats so a "0 issues" result can be verified as
          # full analysis rather than a silent skip.
          args: --verbose

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: |
          go vet ./...
          (cd test/e2e-monitoring/broker-driver && go vet ./...)

      - name: Test
        # -race enables the Go race detector to catch data races on shared state (e.g. BrokerPool).
        # This adds ~2-3x overhead to test execution. Acceptable now given the small test suite,
        # but worth revisiting if test times become a problem as the suite grows.
        run: go test -race -v ./...

      - name: Check for test files
        run: |
          TEST_FILES=$(find . -name '*_test.go' -not -path './vendor/*' | head -1)
          if [ -z "$TEST_FILES" ]; then
            echo "::warning::⚠️ No test files (*_test.go) found in the project. Please add tests."
          else
            echo "✅ Test files found. You can now remove this step"
          fi

  e2e-basic-mcp:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Start Solace brokers
        run: docker compose -f test/e2e-basic-mcp/docker-compose.yml up -d

      - name: Wait for brokers
        run: |
          source test/e2e-basic-mcp/helpers.sh
          wait_for_all_brokers 120

      - name: Run E2E tests
        run: bash test/e2e-basic-mcp/run-all.sh

      - name: Broker logs (on failure)
        if: failure()
        run: |
          echo "=== solace-e2e-a ==="
          docker logs solace-e2e-a 2>&1 | tail -100
          echo "=== solace-e2e-b ==="
          docker logs solace-e2e-b 2>&1 | tail -100

      - name: Tear down brokers
        if: always()
        run: docker compose -f test/e2e-basic-mcp/docker-compose.yml down -v

  e2e-oauth:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Keycloak
        run: bash test/oauth/setup-keycloak.sh

      - name: Run OAuth integration test
        run: bash test/oauth/test-oauth.sh

      - name: Keycloak logs (on failure)
        if: failure()
        run: docker logs keycloak-dev 2>&1 | tail -100

      - name: MCP server logs (on failure)
        if: failure()
        run: cat /tmp/mcp-oauth-test.log 2>/dev/null || echo "No server log found"

      - name: Tear down Keycloak
        if: always()
        run: cd test/oauth && docker compose down -v

  e2e-monitoring:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Start Solace brokers
        run: bash test/e2e-monitoring/setup-brokers.sh

      - name: Run E2E tests
        run: bash test/e2e-monitoring/test-monitoring-tools.sh

      - name: Broker logs (on failure)
        if: failure()
        run: |
          echo "=== solace-e2e-mon-a ==="
          docker logs solace-e2e-mon-a 2>&1 | tail -100
          echo "=== solace-e2e-mon-b ==="
          docker logs solace-e2e-mon-b 2>&1 | tail -100

      - name: MCP server log (on failure)
        if: failure()
        run: cat test/e2e-monitoring/bin/mcp-server.log 2>/dev/null || echo "No server log found"

      - name: Tear down brokers
        if: always()
        run: docker compose -f test/e2e-monitoring/docker-compose.yml down -v
