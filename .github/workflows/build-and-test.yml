name: Build and Test

# WHY `push` IS SCOPED TO main AND `pull_request` CARRIES FEATURE BRANCHES
#
# These seven jobs are required status checks. A check that never reports on a
# pull request leaves the required context pending forever, which is how a fork
# contribution used to become unmergeable: `push` fires in the contributor's
# fork, never against this repository's commit.
#
# `pull_request` fixes that, but keeping `push: '**'` alongside it would run
# every check twice on same-repo pull requests, including five Dockerized e2e
# suites.
#
# The alternative worth naming is not gating on event name. It is keeping
# `push: '**'`, adding `pull_request`, and gating each job on fork-ness:
#
#   if: github.event_name == 'push'
#       || github.event.pull_request.head.repo.full_name != github.repository
#
# That option does preserve pre-pull-request branch CI, declaratively, with no
# API call: a push to any branch runs, a same-repo pull request all-skips
# cheaply, and a fork pull request runs the contexts for the first time.
#
# It is rejected for a sharper reason than cost. It puts two check runs with the
# same name on the same head SHA: a real `lint` from the push run and a skipped
# `lint` from the pull-request run. If branch protection resolves a required
# context against the most recent check run of that name, the gate becomes
# order-dependent, and a skipped run landing last is a green gate over a red job.
# This file exists because GitHub's skip-and-report behavior is asymmetric, so a
# design that makes the gate depend on arrival order is the wrong trade even
# though it is cheaper.
#
# The cost, stated plainly: pushing a feature branch no longer runs CI on its
# own. Two ways to get it, most convenient first:
#
#   1. `workflow_dispatch` runs the full suite on any ref, no pull request
#      needed: `gh workflow run build-and-test.yml --ref my-branch`. Dispatch
#      requires write access, so it adds no fork exposure. Same
#      `workflow_dispatch` pattern as `guardian-scan.yaml` and `llm-eval.yml`.
#   2. Open the pull request. A draft is enough; `opened` and `synchronize` both
#      fire for drafts.
#
# `workflow_call` stays because release.yml calls this workflow on a `v*` tag
# push. The `tags-ignore: ['v*']` that used to sit here was load-bearing, not
# dead config, and the mechanism is worth stating correctly: the old trigger
# defined both `branches` and `tags-ignore`, so the tag ref was not undefined and
# a non-`v*` tag push did run this workflow. What stops every tag push from
# triggering it now is narrowing `branches` to main and dropping `tags-ignore`
# together, because a filter list naming only `branches` leaves the tag ref
# undefined.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    # Scoped to main to match dco.yaml, which is scoped for a correctness reason
    # (see its header). Without this, a pull request against a throwaway base
    # would spin up five Dockerized e2e suites and still not get a DCO verdict.
    # Add a branch here if the project starts taking pull requests against
    # release branches, and add it to dco.yaml at the same time.
    branches: [main]
  workflow_dispatch:
  workflow_call:

# Cancel superseded pull-request runs, never superseded pushes to main: every
# commit on main must keep its own FOSSA verdict and e2e result.
#
# The non-pull-request fallback is `github.sha`, not `github.ref`, and the
# difference is not cosmetic. Keying every push to main as `refs/heads/main` puts
# them all in one group, and `cancel-in-progress: false` does not mean "let them
# all run". GitHub holds at most one pending run per group, and per the
# workflow-syntax reference, "any existing `pending` job or workflow in the same
# concurrency group will be canceled and the new queued job or workflow will take
# its place." So a burst of three merges runs the first, queues the second, then
# drops the second when the third arrives. The middle commit lands on main with
# no FOSSA verdict and no e2e result, the exact outcome the paragraph above
# exists to prevent. `queue: max` would also fix it, at the cost of serializing
# main behind the longest e2e run. Per-commit groups cost nothing and delay
# nothing.
#
# Known and bounded: tagging a commit already running as a main push collides,
# because both resolve to the same `github.sha`. That costs the release run a
# wait, not a verdict. Two runs in a group means one runs and one pends, and
# nothing is dropped until a third arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only for every job; scanning and its elevated scopes moved to
# guardian-scan.yaml.
#
# This used to be one workflow-level block granting `pull-requests: write`,
# `id-token: write`, `checks: write`, and `statuses: write` to every job. That
# mattered little while the only trigger was `push`; it matters now that
# `pull_request` is a trigger and the e2e jobs execute shell scripts taken from
# the pull request's own ref. `statuses: write` is the sharp one — a step holding
# it can POST a successful status under a context name that branch protection
# requires, which is a way around the gate rather than through it.
#
# Forks were never exposed to this: GitHub forces a read-only token on a
# fork-triggered `pull_request` run whatever a workflow asks for. The exposure
# was a same-repo branch, and narrowing the default closes it.
#
# `contents: read` is all the seven build and test jobs need.
# golangci-lint-action emits annotations as stdout workflow commands, not through
# the checks API, so it needs no `checks: write` — the previous comment here
# claimed otherwise and was wrong.
permissions:
  contents: read

# Supply-chain scanning moved to guardian-scan.yaml; this workflow is now
# lint/build/e2e only.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.11.4
          # The action's fallback restore key is prefixed on OS + workdir +
          # interval bucket, not the source tree or .golangci.yml. The go.mod
          # hash only narrows the primary key, so a go.mod change still restores
          # a cache saved under a different hash in the same bucket. The interval
          # bucket -- floor(epoch/86400), turning over at 00:00 UTC -- is what
          # actually bounds staleness, so set it to 1 day (default is 7) so any
          # stale analysis facts self-heal quickly. The flaky SA5011 that once
          # made this dangerous (PR #150) is fixed at the source, so caching is
          # safe again.
          cache-invalidation-interval: 1
          # --verbose surfaces per-linter timing, the active-linter list, and
          # package-load stats. With caching on a warm run legitimately analyzes
          # fewer packages, but the output still confirms which linters ran.
          args: --verbose

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: |
          go vet ./...
          (cd test/e2e-common/broker-driver && go vet ./...)

      - name: Test
        # -race enables the Go race detector to catch data races on shared state (e.g. BrokerPool).
        # This adds ~2-3x overhead to test execution. Acceptable now given the small test suite,
        # but worth revisiting if test times become a problem as the suite grows.
        #
        # `make test-cover` also enforces the 85% aggregate coverage floor from the same run
        # (no separate test pass) — see docs/internal/unit-test-coverage.md for the policy
        # and what this floor can/can't catch (it's a backstop, not a regression detector —
        # per-package coverage deltas in review are what catch a small localized regression).
        run: make test-cover

      - name: Benchmark
        # Informational, not a pass/fail gate — wall-clock timing is too CI-noisy to
        # threshold reliably (runner contention, no dedicated hardware). The actual
        # regression gate for tool-payload size is TestToolListBudget (byte/token
        # thresholds in cmd/server), which runs as a normal test above and does fail
        # CI. This step just makes ns/op and B/op visible in the Actions log so a
        # marshalling regression (e.g. an accidental O(n^2) in a postprocess handler)
        # is easy to spot in review, per SOL-152125. continue-on-error backs that
        # "informational" claim with an actual guarantee — without it, any non-zero
        # exit here (even one unrelated to a real regression) would fail the whole
        # build job, contradicting this step's stated purpose.
        continue-on-error: true
        run: make bench

      - name: Check for test files
        run: |
          TEST_FILES=$(find . -name '*_test.go' -not -path './vendor/*' | head -1)
          if [ -z "$TEST_FILES" ]; then
            echo "::warning::⚠️ No test files (*_test.go) found in the project. Please add tests."
          else
            echo "✅ Test files found. You can now remove this step"
          fi

  e2e-basic-mcp:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Start Solace brokers
        run: SUITE_DIR=test/e2e-basic-mcp bash test/e2e-common/setup-brokers.sh

      - name: Run E2E tests
        run: bash test/e2e-basic-mcp/run-all.sh

      - name: Broker logs (on failure)
        if: failure()
        run: |
          echo "=== solace-e2e-a ==="
          docker logs solace-e2e-a 2>&1 | tail -100
          echo "=== solace-e2e-b ==="
          docker logs solace-e2e-b 2>&1 | tail -100

      - name: Tear down brokers
        if: always()
        run: docker compose -f test/e2e-basic-mcp/docker-compose.yml down -v

  e2e-oauth:
    runs-on: ubuntu-latest
    needs: build
    # The suite's curls into Keycloak/broker/MCP are individually bounded, but
    # a dependency that accepts TCP and never answers would otherwise sit on
    # GitHub's 360-minute default. The full cycle runs in ~1 minute warm.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Generate dev TLS certs
        run: |
          source test/e2e-oauth/helpers.sh
          ensure_tls_certs

      - name: Start Keycloak + brokers
        run: docker compose -f test/e2e-oauth/docker-compose.yml up -d

      - name: Wait for brokers + Keycloak
        run: |
          source test/e2e-oauth/helpers.sh
          wait_for_all_brokers 120
          wait_for_keycloak 120

      - name: Configure OAuth profiles
        run: bash test/e2e-oauth/configure-oauth-profiles.sh

      - name: Run E2E tests
        run: bash test/e2e-oauth/run-all.sh

      - name: Broker logs (on failure)
        if: failure()
        run: |
          echo "=== solace-e2e-oauth-a ==="
          docker logs solace-e2e-oauth-a 2>&1 | tail -100
          echo "=== solace-e2e-oauth-b ==="
          docker logs solace-e2e-oauth-b 2>&1 | tail -100

      - name: Keycloak logs (on failure)
        if: failure()
        run: docker logs keycloak-e2e-oauth 2>&1 | tail -100

      - name: MCP server log (on failure)
        if: failure()
        # The suite restarts the server between phases and rotates the previous
        # phase's log to mcp-server.log.N, so collect every one — the failing
        # phase is often not the last. Rotated files first, since they are the
        # earlier phases and a later failure is often a cascade from them.
        run: |
          shopt -s nullglob
          logs=(test/e2e-oauth/bin/mcp-server.log.[0-9]* test/e2e-oauth/bin/mcp-server.log)
          if [ ${#logs[@]} -eq 0 ]; then echo "No server log found"; fi
          for f in "${logs[@]}"; do echo "=== $f ==="; cat "$f"; done

      - name: Generated MCP server configs (on failure)
        if: failure()
        # Each phase's meaning lives in its tool_authorization block; without
        # these, a CI-only failure gives no way to see what the server ran with.
        run: |
          shopt -s nullglob
          for f in test/e2e-oauth/bin/mcp-config-*.yaml; do echo "=== $f ==="; cat "$f"; done

      - name: Broker OAuth profile snapshot (on failure)
        if: failure()
        run: |
          source test/e2e-oauth/helpers.sh
          echo "=== prod-us oauthProfile ==="
          semp_curl -s "http://localhost:${BROKER_A_SEMP_PORT}/SEMP/v2/config/oauthProfiles/keycloak_profile" || true
          echo
          echo "=== test-us oauthProfile ==="
          semp_curl -s "http://localhost:${BROKER_B_SEMP_PORT}/SEMP/v2/config/oauthProfiles/keycloak_profile" || true

      - name: Tear down
        if: always()
        run: docker compose -f test/e2e-oauth/docker-compose.yml down -v

  e2e-monitoring:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Start Solace brokers
        run: SUITE_DIR=test/e2e-monitoring bash test/e2e-common/setup-brokers.sh

      - name: Run E2E tests
        run: bash test/e2e-monitoring/run-all.sh

      - name: Broker logs (on failure)
        if: failure()
        run: |
          echo "=== solace-e2e-mon-a ==="
          docker logs solace-e2e-mon-a 2>&1 | tail -100
          echo "=== solace-e2e-mon-b ==="
          docker logs solace-e2e-mon-b 2>&1 | tail -100

      - name: MCP server log (on failure)
        if: failure()
        run: cat test/e2e-monitoring/bin/mcp-server.log 2>/dev/null || echo "No server log found"

      - name: Tear down brokers
        if: always()
        run: docker compose -f test/e2e-monitoring/docker-compose.yml down -v

  e2e-management:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Start Solace brokers
        run: SUITE_DIR=test/e2e-management bash test/e2e-common/setup-brokers.sh

      - name: Run E2E tests
        run: bash test/e2e-management/run-all.sh

      - name: Broker logs (on failure)
        if: failure()
        run: |
          echo "=== solace-e2e-mgmt-a ==="
          docker logs solace-e2e-mgmt-a 2>&1 | tail -100
          echo "=== solace-e2e-mgmt-b ==="
          docker logs solace-e2e-mgmt-b 2>&1 | tail -100

      - name: MCP server log (on failure)
        if: failure()
        run: cat test/e2e-management/bin/mcp-server.log 2>/dev/null || echo "No server log found"

      - name: Tear down brokers
        if: always()
        run: docker compose -f test/e2e-management/docker-compose.yml down -v

  e2e-action:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Start Solace brokers
        run: SUITE_DIR=test/e2e-action bash test/e2e-common/setup-brokers.sh

      - name: Run E2E tests
        run: bash test/e2e-action/run-all.sh

      - name: Broker logs (on failure)
        if: failure()
        run: |
          echo "=== solace-e2e-act-a ==="
          docker logs solace-e2e-act-a 2>&1 | tail -100
          echo "=== solace-e2e-act-b ==="
          docker logs solace-e2e-act-b 2>&1 | tail -100

      - name: MCP server log (on failure)
        if: failure()
        run: cat test/e2e-action/bin/mcp-server.log 2>/dev/null || echo "No server log found"

      - name: Tear down brokers
        if: always()
        run: docker compose -f test/e2e-action/docker-compose.yml down -v
