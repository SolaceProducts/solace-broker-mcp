name: LLM eval call proof

# One push to amorade/SOL-152815 calls llm-eval.yml the way release.yml does.
# The next commit deletes this file, so a later push does not start a second run.
# summary.txt must show head equal to commit. That commit is this file's SHA.

on:
  push:
    branches:
      - amorade/SOL-152815

permissions:
  contents: read

jobs:
  llm-eval:
    permissions:
      contents: read
    uses: ./.github/workflows/llm-eval.yml
    secrets:
      LLM_SERVICE_API_KEY: ${{ secrets.LLM_SERVICE_API_KEY }}
