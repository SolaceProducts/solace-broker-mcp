name: FOSSA Scan (Manual)

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to scan (branch, tag, or SHA). Leave empty to scan current branch.'
        required: false
        type: string

permissions:
  contents: read
  packages: read
  pull-requests: write
  id-token: write
  actions: read
  checks: write
  statuses: write

jobs:
  fossa_scan:
    name: FOSSA Scan
    uses: SolaceDev/solace-public-workflows/.github/workflows/sca-scan-and-guard.yaml@4c3adb2cd19a3de38abe3b9ac4a7a066a97ed526 # pinned 2026-05-12
    with:
      git_ref: ${{ inputs.git_ref }}
      use_vault: true
      config_file: '.github/workflow-config.json'
    secrets:
      # Vault address is injected from an org/repo secret, not committed to the repo.
      VAULT_URL: ${{ secrets.VAULT_URL }}
