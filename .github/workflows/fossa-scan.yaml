name: FOSSA Scan (Manual)

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to scan (branch, tag, or SHA). Leave empty to scan current branch.'
        required: false
        type: string

permissions:
  contents: read
  packages: read
  pull-requests: write
  id-token: write
  actions: read
  checks: write
  statuses: write

jobs:
  fossa_scan:
    name: FOSSA Scan
    uses: SolaceDev/solace-public-workflows/.github/workflows/sca-scan-and-guard.yaml@fc521b087f780457f92d4cb46038184e92ad2fbc # pinned 2026-05-12
    with:
      git_ref: ${{ inputs.git_ref }}
      use_vault: false
      config_file: '.github/workflow-config.json'
    secrets:
      # Org-level Actions secret, not Vault. `id-token: write` above is still
      # required — see the note in build-and-test.yml.
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
