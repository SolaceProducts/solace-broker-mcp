name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege by default: every job declares what it needs.
permissions:
  contents: read

jobs:
  test:
    # build-and-test.yml is lint/build/e2e only (scanning moved to
    # guardian-scan.yaml) and scopes its own jobs to contents: read.
    permissions:
      contents: read
    uses: ./.github/workflows/build-and-test.yml

  # Fail fast, before anything is published: a release must have a matching
  # CHANGELOG block. build-binaries/build-docker depend on this, so a forgotten
  # promotion can't leave a half-published release (image pushed, no notes).
  release-notes:
    name: Verify & extract release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract release notes from CHANGELOG
        run: .github/scripts/extract-release-notes.sh "${GITHUB_REF_NAME}" release-notes.md
      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md

  # Same fail-fast reasoning as release-notes, for the other release artifact.
  licenses:
    name: Third-party licenses current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # Build from a cold module cache. A release runs once per tag, so the
          # cache buys little, and a cache entry restored from a less-trusted
          # ref is an input to an artifact we then attest.
          cache: false
      - name: Self-test the licence check
        run: .github/scripts/licenses-check.test.sh
      - name: Verify THIRD_PARTY_LICENSES.md and NOTICE match the binary
        run: .github/scripts/licenses-check.sh
      # Verified at the tag for the same reason as the check above it: a pull
      # request can merge with this red until it is a required status check.
      # `if: always()` is load-bearing. GitHub skips later steps once one fails,
      # so without it a red licenses-check.sh would stop these from running at
      # all — one gate masking the other, which is the exact coupling the
      # separate script exists to avoid. Same job, because both verdicts belong
      # under the one `Third-party licenses current` required check.
      - name: Self-test the build/test licence check
        if: always()
        run: .github/scripts/build-test-licenses-check.test.sh
      - name: Verify THIRD_PARTY_BUILD_TEST.md matches the build and test inputs
        if: always()
        run: .github/scripts/build-test-licenses-check.sh

      # SBOM — SOL-153188. cyclonedx-gomod reads go.mod/the module graph
      # directly, so it agrees with the build by construction, the same
      # reasoning SOL-153190 used to pick the Go module graph over FOSSA for
      # THIRD_PARTY_LICENSES.md — no reconciliation needed between generator
      # and any gate, because there is no second resolution to disagree with.
      # Pinned to v1.10.0 deliberately, not @latest: v1.10.0 is the newest
      # release whose own go.mod requires exactly `go 1.25`, matching this
      # repo's pin — v1.11.0 requires 1.26 and would force a toolchain
      # download on every release run for no benefit here.
      #
      # Absence must not gate, a proven divergence must — these are two
      # different failure modes and this story is explicit that only one of
      # them should block a release. SOL-148440 already recorded the SBOM as
      # not gating: "do not add a job that fails the release when it is
      # absent." That governs `Generate SBOM` specifically — `continue-on-
      # error: true` there means a cyclonedx-gomod outage or bug degrades to
      # "release ships with no SBOM," not "release ships with nothing." It
      # does NOT govern the drift check: once an SBOM exists, the AC treats a
      # divergence from THIRD_PARTY_LICENSES.md as "a bug in one of the two,"
      # which is a real defect worth blocking on, not a tooling availability
      # problem — a wrong SBOM published alongside the release would be worse
      # than none at all. Hence the check step below has no continue-on-error,
      # and is gated on generation's own step outcome (not just `always()`,
      # which would run it against a nonexistent file if generation failed).
      #
      # No self-test step here, deliberately — sbom-check.sh's self-test runs
      # non-blocking on every pull request instead (ci-pr.yaml's
      # `sbom-check-selftest` job), for two reasons: it catches a regression
      # in the script on the PR that introduced it rather than at the next
      # tag, and running it here too would duplicate, with no continue-on-
      # error, exactly what `Generate SBOM` and the check below already
      # exercise for real — a self-test failure from a transient module-proxy
      # hiccup would gate the release on a step providing no coverage the
      # next two don't already give it.
      - name: Generate SBOM
        id: sbom_generate
        if: always()
        continue-on-error: true
        run: |
          SBOM="solace-broker-mcp-${GITHUB_REF_NAME}.cdx.json"
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 \
            app -json -licenses -main cmd/server -output "${SBOM}" .
          echo "SBOM=${SBOM}" >> "${GITHUB_ENV}"
      - name: Verify the SBOM's dependency set matches THIRD_PARTY_LICENSES.md
        id: sbom_check
        if: always() && steps.sbom_generate.outcome == 'success'
        run: .github/scripts/sbom-check.sh "${SBOM}"
      # Gated on both prior steps' own outcomes, not `always()` or plain
      # success() — this must upload nothing if generation didn't produce a
      # real SBOM, and nothing if the SBOM it produced failed its drift check,
      # regardless of what else in this job passed or failed.
      - name: Upload SBOM
        if: steps.sbom_generate.outcome == 'success' && steps.sbom_check.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ env.SBOM }}

  # Self-tests for the inventory-refresh tooling itself (SOL-152956,
  # `make refresh-third-party-inventory`) — not the gate above, which stays
  # exactly as it was, and not named in any `needs:` below, so neither job
  # here can block build-binaries/build-docker/release. Same reasoning as
  # ci-pr.yaml's own copy of these two jobs: this tooling's tests shell out to
  # `go run github.com/google/go-licenses` and `gh api` for a handful of
  # cases, and letting a module-proxy or GitHub API outage block an actual
  # release over something with no bearing on the inventory's correctness
  # would be a worse trade here than on a PR.
  refresh-scripts-selftest-offline:
    name: Third-party inventory refresh scripts self-test (offline)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # Same reasoning as the `licenses` job above: a cache entry
          # restored from a less-trusted ref is an input this job's own
          # module-graph reads shouldn't trust on the release path, and a
          # release runs once per tag, so the cache buys little anyway.
          cache: false
      # A cold module cache makes `go list` print "go: downloading ..." to
      # stderr while it fetches — build-test-licenses-check.sh merges that
      # stream into what it parses as `{{.Path}} {{.Version}}` output (its
      # own `2>&1`, out of scope to change here), so an unwarmed cache reads
      # as a bogus dependency named literally `go:`. `cache: false` above
      # means this is never warm here, so this step runs every time, not
      # only on this job's first invocation.
      - name: Warm the Go module cache (root + both test submodules)
        run: |
          set -euo pipefail
          go mod download
          while IFS= read -r gomod; do
            (cd "$(dirname "$gomod")" && go mod download)
          done < <(find -L test -name go.mod)
      - name: Self-test the third-party licences refresh script (offline cases)
        env:
          SKIP_NETWORK_TESTS: "1"
        run: .github/scripts/refresh-licenses-inventory.test.sh
      - name: Self-test the build/test inventory refresh script (offline cases)
        if: always()
        env:
          SKIP_NETWORK_TESTS: "1"
        run: .github/scripts/refresh-build-test-inventory.test.sh

  refresh-scripts-selftest-network:
    name: Third-party inventory refresh scripts self-test (network)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Warm the Go module cache (root + both test submodules)
        run: |
          set -euo pipefail
          go mod download
          while IFS= read -r gomod; do
            (cd "$(dirname "$gomod")" && go mod download)
          done < <(find -L test -name go.mod)
      - name: Self-test the third-party licences refresh script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/refresh-licenses-inventory.test.sh
      - name: Self-test the build/test inventory refresh script
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/refresh-build-test-inventory.test.sh

  # Release gate: re-scans the tag, uploads to Guardian, and fails the release
  # if Guardian blocks (admin skip_security_checks is the escape hatch).
  # Replaces the Vault-backed FOSSA scan.
  release-readiness:
    name: Release Readiness Check
    permissions:
      contents: read
      packages: read     # ceiling for guardian-scan's FOSSA jobs (private scan container)
      pull-requests: write
      checks: write
      statuses: write
      # Same ceiling as release-readiness-check.yaml — the subset rule applies at
      # every workflow_call hop. Not a capability this path uses.
      id-token: write
    uses: ./.github/workflows/release-readiness-check.yaml # zizmor: ignore[secrets-inherit]
    # `secrets: inherit` is load-bearing on both hops of this chain. Do not
    # remove it, and do not replace it with explicitly named secrets.
    #
    # A workflow reached via `workflow_call` starts with an EMPTY `secrets`
    # context, and that emptiness extends to the called workflow's own
    # `environment:` layer. `inherit` is what opens that context; once open,
    # guardian-scan.yaml's `environment: guardian` jobs resolve their six
    # secrets themselves. Without it they read every one as an empty string and
    # all four scan jobs fail.
    #
    # Naming the secrets instead is not an option here, tempting as the zizmor
    # finding makes it look. Five of the six (GUARDIAN_URL, GUARDIAN_API_TOKEN,
    # PRISMACLOUD_*) live only in the `guardian` environment, and a job that
    # calls a reusable workflow with `uses:` may not declare `environment:` —
    # so this job cannot see them to pass them on. It would forward empty
    # strings and reproduce the outage. Explicit passing would first require
    # moving those secrets to repo or org scope, which .github/ADMIN_SETUP.md
    # keeps environment-scoped on purpose.
    #
    # Hence the suppression rather than a fix. What `inherit` over-shares is
    # LLM_SERVICE_API_KEY and VAULT_URL — neither referenced by the scan, and
    # VAULT_URL is dead since the move off Vault.
    #
    # Removed once already, by 5ca7de1 (SOL-152856), to let the new zizmor gate
    # start green. That blocked the v0.8.0 release exactly as it had blocked
    # v0.7.0 before #291 (DATAGO-148031) added it. Nothing on PR CI catches the
    # regression: guardian-scan.yaml's direct push/pull_request triggers have no
    # `workflow_call` hop, so only a tag push exercises this path. Verify a
    # change here with a workflow_dispatch of release-readiness-check.yaml
    # against the branch. SOL-153473.
    secrets: inherit
    with:
      version: ${{ github.ref_name }}

  build-binaries:
    needs: [test, release-notes, licenses]
    runs-on: ubuntu-latest
    # id-token/attestations for the provenance step below; nothing here writes
    # to the repository or the registry.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # Cold cache, same reasoning as the `licenses` job above — and it
          # matters more here, since these are the binaries we publish.
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          go build \
            -ldflags "-s -w -X github.com/SolaceProducts/solace-broker-mcp/internal/version.version=${VERSION}" \
            -o solace-broker-mcp \
            ./cmd/server

      - name: Package archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="solace-broker-mcp-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          # NOTICE and THIRD_PARTY_LICENSES.md ship alongside LICENSE (Apache-2.0
          # section 4(d)), per SOL-152414.
          tar czf "${ARCHIVE}" \
            solace-broker-mcp \
            broker-config.example.yaml \
            LICENSE \
            NOTICE \
            THIRD_PARTY_LICENSES.md
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"

      # Attested per matrix leg so the digest is bound before the archive
      # round-trips through upload-artifact, and a failure surfaces pre-publish.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}

  # Executes every archived binary before it can be released — SOL-153189. The
  # release gate used to be compile-plus-attest: nothing ran the thing, so a
  # binary that builds but fails at startup (a bad cross-compile, a packaging
  # mistake) would ship with a valid checksum and a valid provenance
  # attestation, neither of which attests that it runs.
  #
  # This is a separate job, not a step appended to build-binaries, because
  # build-binaries runs entirely on ubuntu-latest (all four legs are built
  # there, two of them cross-compiled) and the darwin archives cannot execute
  # on ubuntu-latest at all. Each leg below runs on the runner OS that can
  # actually execute its binary.
  smoke-test:
    needs: build-binaries
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      # Unlike build-binaries (default fail-fast), a mid-run cancellation here
      # would hide which of four platforms is actually broken — the opposite of
      # "the failure names the platform." Let every leg finish and report.
      fail-fast: false
      matrix:
        include:
          # Native: ubuntu-latest is amd64.
          - goos: linux
            goarch: amd64
            runs-on: ubuntu-latest
            qemu: false
          # No self-hosted or GitHub-hosted ARM Linux runner exists for this
          # repo, and macOS emulation of a Linux binary isn't a thing — QEMU
          # user-mode emulation (docker/setup-qemu-action, already used for
          # build-docker's linux/arm64 image) is the only real option, so this
          # leg is genuinely emulated, not skipped.
          - goos: linux
            goarch: arm64
            runs-on: ubuntu-latest
            qemu: true
          # macos-latest is Apple Silicon; GitHub has since retired the plain
          # Intel labels (macos-13, and macos-14 never had an Intel variant),
          # so darwin/amd64 needs the explicit Intel label on a still-offered
          # generation. actionlint's runner-label list is the reference for
          # which labels currently exist — recheck it if this ever goes red.
          - goos: darwin
            goarch: amd64
            runs-on: macos-15-intel
            qemu: false
          # Native Apple Silicon runner — no emulation needed or possible here.
          - goos: darwin
            goarch: arm64
            runs-on: macos-latest
            qemu: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}

      # Gated to one leg, not every leg — the every-PR run in ci-pr.yaml
      # (smoke_test_selftest job) is what actually protects against this
      # script silently stopping being exercised; it runs on every pull request,
      # before a tag ever exists, and doesn't depend on this release matrix's
      # leg names at all, so it can't go quiet just because a leg is renamed.
      # What that PR-time run can't cover is BSD userland — it runs on
      # ubuntu-latest — so this one macOS leg keeps that coverage without
      # paying 10x-billed macOS minutes on all four legs for a sub-second
      # fixture test that gives identical signal on every leg it runs on.
      - name: Self-test the smoke-test script
        if: matrix.goos == 'darwin' && matrix.goarch == 'arm64'
        run: .github/scripts/smoke-test-binary.test.sh

      # The archived artifact downloaded above, not a binary freshly built in
      # this job's workspace — packaging bugs are in scope.
      - name: Smoke-test the archived binary
        run: |
          ARCHIVE="solace-broker-mcp-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          .github/scripts/smoke-test-binary.sh "$ARCHIVE" "${GITHUB_REF_NAME}" "${{ matrix.goos }}" "${{ matrix.goarch }}"

  # Multi-arch build + push + provenance attestation, inline here because these
  # scopes (packages/id-token/attestations) belong to the release path only —
  # putting the build in a shared reusable workflow would force the scan path
  # and the release-readiness gate chain to grant them too. Gated on
  # release-readiness: a registry push is irreversible and moves `latest`, so it
  # must wait for the Guardian gate. Admin skip_security_checks can publish over
  # a block via release-readiness-check.
  build-docker:
    needs: [test, release-notes, licenses, release-readiness]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/solaceproducts/solace-broker-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # One attestation covers the whole multi-arch index (every tag pushed
      # above); push-to-registry stores a copy beside the image for cosign.
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/solaceproducts/solace-broker-mcp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: [build-binaries, build-docker, release-readiness, smoke-test]
    runs-on: ubuntu-latest
    # Creates the GitHub Release and uploads the archives and checksums to it.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/

      # A single artifact downloaded by name extracts flat into the working
      # dir (no name-subdirectory) — same behavior release-notes below already
      # relies on — so this lands directly at dist/, next to the archives.
      # `continue-on-error: true` because the `licenses` job's own SBOM
      # generation is deliberately allowed to fail without gating (SOL-148440:
      # "do not add a job that fails the release when it is absent") — the
      # "sbom" artifact may legitimately not exist, and downloading it must
      # degrade the same way, not turn absence into a release failure here
      # instead.
      - name: Download SBOM
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist/

      # `--` rather than `./*.tar.gz`, which is the other fix shellcheck offers
      # for SC2035: `./` would prefix every line of the published checksums file
      # with `./`, changing a release artifact people verify against. `--` stops
      # option parsing and leaves the filenames bare. Includes the SBOM
      # (*.cdx.json) alongside the archives — SOL-153188 — so it's verifiable
      # the same way every other release asset already is. `nullglob` matters
      # here specifically because the SBOM may be legitimately absent (see the
      # download step above): without it, an unmatched `*.cdx.json` glob stays
      # a literal, unexpanded string under `bash -e` (this step's default
      # shell), and sha256sum would fail trying to open a file named that,
      # turning an intentionally-tolerated absence into a hard failure here.
      - name: Generate checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          sha256sum -- *.tar.gz *.cdx.json > checksums-sha256.txt

      # A single artifact downloaded by name extracts flat into the working dir
      # (no name-subdirectory), so body_path: release-notes.md below resolves.
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      # `dist/*.cdx.json` is an intentionally-optional pattern — SOL-153188's
      # SBOM is allowed to be absent (see the `licenses` job). Confirmed
      # against this action's actual source at the pinned v3.0.2: `paths()` in
      # src/util.ts resolves each pattern with `glob.sync()` and concatenates
      # whatever matches, so a pattern matching nothing just contributes
      # nothing — no error, no warning. That's the default; a separate
      # `fail_on_unmatched_files` input would make it strict, and this step
      # doesn't set it.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/checksums-sha256.txt
