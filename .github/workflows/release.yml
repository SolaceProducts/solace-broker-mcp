name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege by default: every job declares what it needs.
permissions:
  contents: read

jobs:
  test:
    # build-and-test.yml is lint/build/e2e only (scanning moved to
    # guardian-scan.yaml) and scopes its own jobs to contents: read.
    permissions:
      contents: read
    uses: ./.github/workflows/build-and-test.yml

  # Fail fast, before anything is published: a release must have a matching
  # CHANGELOG block. build-binaries/build-docker depend on this, so a forgotten
  # promotion can't leave a half-published release (image pushed, no notes).
  release-notes:
    name: Verify & extract release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Extract release notes from CHANGELOG
        run: .github/scripts/extract-release-notes.sh "${GITHUB_REF_NAME}" release-notes.md
      - name: Upload release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md

  # Same fail-fast reasoning as release-notes, for the other release artifact.
  licenses:
    name: Third-party licenses current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
      - name: Self-test the licence check
        run: .github/scripts/licenses-check.test.sh
      - name: Verify THIRD_PARTY_LICENSES.md and NOTICE match the binary
        run: .github/scripts/licenses-check.sh

  # Release gate: re-scans the tag, uploads to Guardian, and fails the release
  # if Guardian blocks (admin skip_security_checks is the escape hatch).
  # Replaces the Vault-backed FOSSA scan.
  release-readiness:
    name: Release Readiness Check
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    uses: ./.github/workflows/release-readiness-check.yaml
    with:
      version: ${{ github.ref_name }}

  build-binaries:
    needs: [test, release-notes, licenses]
    runs-on: ubuntu-latest
    # id-token/attestations for the provenance step below; nothing here writes
    # to the repository or the registry.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          go build \
            -ldflags "-s -w -X github.com/SolaceProducts/solace-broker-mcp/internal/version.version=${VERSION}" \
            -o solace-broker-mcp \
            ./cmd/server

      - name: Package archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="solace-broker-mcp-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          # NOTICE and THIRD_PARTY_LICENSES.md ship alongside LICENSE (Apache-2.0
          # section 4(d)), per SOL-152414.
          tar czf "${ARCHIVE}" \
            solace-broker-mcp \
            broker-config.example.yaml \
            LICENSE \
            NOTICE \
            THIRD_PARTY_LICENSES.md
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"

      # Attested per matrix leg so the digest is bound before the archive
      # round-trips through upload-artifact, and a failure surfaces pre-publish.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}

  # Multi-arch build + push, delegated to the reusable build-image workflow
  # (which also emits the image build-provenance attestation). Gated on
  # release-readiness: a registry push is irreversible and moves `latest`, so
  # it must wait for the Guardian gate. Admin skip_security_checks can publish
  # over a block via release-readiness-check.
  build-docker:
    needs: [test, release-notes, licenses, release-readiness]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/build-image.yaml
    with:
      git_ref: ${{ github.ref_name }}
      version: ${{ github.ref_name }}
      push: true
      platforms: linux/amd64,linux/arm64

  release:
    needs: [build-binaries, build-docker, release-readiness]
    runs-on: ubuntu-latest
    # Creates the GitHub Release and uploads the archives and checksums to it.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums-sha256.txt

      # A single artifact downloaded by name extracts flat into the working dir
      # (no name-subdirectory), so body_path: release-notes.md below resolves.
      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums-sha256.txt
