name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege by default: every job below declares what it needs. This
# matters most for `fossa_scan`, which hands its job token to a reusable
# workflow in another repository — a broad top-level grant would travel with
# it. (`test` also calls a reusable workflow, but a local one, and it scopes
# its own jobs.)
permissions:
  contents: read

jobs:
  test:
    # build-and-test.yml scopes permissions per job and defaults to
    # `contents: read`; a caller can only downgrade what the called workflow
    # asks for, never raise it. This mirrors the widest grant that workflow
    # makes (its own `fossa_scan`) so nothing is silently stripped. That job is
    # skipped on a tag push, but the grant costs nothing and keeps the two
    # workflows from drifting into a hard-to-debug OIDC failure.
    permissions:
      contents: read
      packages: read
      pull-requests: write
      id-token: write
      actions: read
      checks: write
      statuses: write
    uses: ./.github/workflows/build-and-test.yml

  # Fail fast, before anything is published: a release must have a matching
  # CHANGELOG block. build-binaries/build-docker depend on this, so a forgotten
  # promotion can't leave a half-published release (image pushed, no notes).
  release-notes:
    name: Verify & extract release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG
        run: .github/scripts/extract-release-notes.sh "${GITHUB_REF_NAME}" release-notes.md
      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  # Same fail-fast reasoning as release-notes above, for the other artifact that
  # ships with the release. THIRD_PARTY_LICENSES.md satisfies a Legal release
  # condition, so a tag must not be publishable while it misstates the binary.
  #
  # The same check runs on every pull request, which is what normally keeps `main`
  # clean. This job is what makes that a guarantee rather than a dependency on the
  # branch-protection configuration being correct: until `Third-party licenses
  # current` is registered as a required status check, a pull request can merge
  # with it red. Verifying again at the tag closes that window, and costs seconds.
  licenses:
    name: Third-party licenses current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Self-test the licence check
        run: .github/scripts/licenses-check.test.sh
      - name: Verify THIRD_PARTY_LICENSES.md and NOTICE match the binary
        run: .github/scripts/licenses-check.sh
      # Verified at the tag for the same reason as the check above it: a pull
      # request can merge with this red until it is a required status check.
      # `if: always()` is load-bearing. GitHub skips later steps once one fails,
      # so without it a red licenses-check.sh would stop these from running at
      # all — one gate masking the other, which is the exact coupling the
      # separate script exists to avoid. Same job, because both verdicts belong
      # under the one `Third-party licenses current` required check.
      - name: Self-test the build/test licence check
        if: always()
        run: .github/scripts/build-test-licenses-check.test.sh
      - name: Verify THIRD_PARTY_BUILD_TEST.md matches the build and test inputs
        if: always()
        run: .github/scripts/build-test-licenses-check.sh

  fossa_scan:
    name: FOSSA Scan
    # Same grant, and the same reasoning, as the `fossa_scan` job in
    # build-and-test.yml: the scan authenticates to Vault by OIDC (`id-token`),
    # reads the dependency graph and workflow metadata (`packages`, `actions`),
    # and reports back on the commit (`pull-requests`, `statuses`, `checks`).
    # Scoped to this job so it inherits nothing the release jobs hold.
    permissions:
      contents: read
      packages: read
      pull-requests: write
      id-token: write
      actions: read
      checks: write
      statuses: write
    uses: SolaceDev/solace-public-workflows/.github/workflows/sca-scan-and-guard.yaml@fc521b087f780457f92d4cb46038184e92ad2fbc # pinned 2026-05-12
    with:
      git_ref: ${{ github.ref_name }}
      use_vault: true
      config_file: '.github/workflow-config.json'
    secrets:
      # Vault address is injected from an org/repo secret, not committed to the repo.
      VAULT_URL: ${{ secrets.VAULT_URL }}

  build-binaries:
    needs: [test, release-notes, licenses]
    runs-on: ubuntu-latest
    # `id-token`/`attestations` for the provenance step below; nothing here
    # writes to the repository or the registry.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          go build \
            -ldflags "-s -w -X github.com/SolaceProducts/solace-broker-mcp/internal/version.version=${VERSION}" \
            -o solace-broker-mcp \
            ./cmd/server

      - name: Package archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="solace-broker-mcp-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          # NOTICE and THIRD_PARTY_LICENSES.md ship alongside LICENSE, not just in
          # the repository. Apache-2.0 section 4(d) requires the attribution
          # notices to travel with the derivative work, and THIRD_PARTY_LICENSES.md
          # describes itself as accompanying the release — which was not true of
          # this archive until SOL-152414.
          tar czf "${ARCHIVE}" \
            solace-broker-mcp \
            broker-config.example.yaml \
            LICENSE \
            NOTICE \
            THIRD_PARTY_LICENSES.md
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"

      # Attested here, per matrix leg, rather than in the release job, for two
      # reasons. The digest is bound to the archive before it round-trips
      # through upload-artifact/download-artifact, so the attestation covers
      # the bytes as built rather than the bytes as restored. And a failure to
      # attest surfaces before anything is published, instead of after the
      # image is already live on ghcr.io.
      #
      # It is *not* about naming the builder: the SLSA predicate records
      # workflow_ref, job_workflow_ref, run_id and run_attempt — not the job
      # name — and all of these jobs are inline in this file, so attesting from
      # the release job would produce the same values.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}

  build-docker:
    # `fossa_scan` is a prerequisite here, not just of `release`: this job pushes
    # unconditionally, and a push cannot be undone. Without it a failing SCA gate
    # still publishes the image and moves `latest`, and only the GitHub Release
    # waits — leaving a live image the release never vouched for. The two jobs ran
    # in parallel before, so on a clean run this costs the longer of the two, not
    # the sum.
    needs: [test, release-notes, licenses, fossa_scan]
    runs-on: ubuntu-latest
    # `packages` to push to ghcr.io, `id-token`/`attestations` for the
    # provenance step. `artifact-metadata` is needed because
    # attest-build-provenance defaults `create-storage-record: true`, and with
    # `push-to-registry: true` under an organization account it creates a
    # storage record for the pushed attestation; without the permission the
    # action still succeeds but logs two warnings per run.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/solaceproducts/solace-broker-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest covers the whole multi-arch index, so one attestation covers
      # every tag pushed above. push-to-registry stores a second copy of the
      # bundle next to the image, which cosign can verify straight from
      # ghcr.io. `gh attestation verify oci://…` still queries the GitHub API
      # by default — it only reads the registry copy when passed
      # `--bundle-from-oci`.
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/solaceproducts/solace-broker-mcp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: [build-binaries, build-docker, fossa_scan]
    runs-on: ubuntu-latest
    # Creates the GitHub Release and uploads the archives and checksums to it.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums-sha256.txt

      # A single artifact downloaded by name extracts flat into the working dir
      # (no name-subdirectory), so body_path: release-notes.md below resolves.
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums-sha256.txt
