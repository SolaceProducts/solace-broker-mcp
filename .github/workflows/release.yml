name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write
  actions: read
  issues: write
  checks: write
  statuses: write

jobs:
  test:
    uses: ./.github/workflows/build-and-test.yml

  # Fail fast, before anything is published: a release must have a matching
  # CHANGELOG block. build-binaries/build-docker depend on this, so a forgotten
  # promotion can't leave a half-published release (image pushed, no notes).
  release-notes:
    name: Verify & extract release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Extract release notes from CHANGELOG
        run: .github/scripts/extract-release-notes.sh "${GITHUB_REF_NAME}" release-notes.md
      - name: Upload release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md

  # Same fail-fast reasoning as release-notes above, for the other artifact that
  # ships with the release. THIRD_PARTY_LICENSES.md satisfies a Legal release
  # condition, so a tag must not be publishable while it misstates the binary.
  #
  # The same check runs on every pull request, which is what normally keeps `main`
  # clean. This job is what makes that a guarantee rather than a dependency on the
  # branch-protection configuration being correct: until `Third-party licenses
  # current` is registered as a required status check, a pull request can merge
  # with it red. Verifying again at the tag closes that window, and costs seconds.
  licenses:
    name: Third-party licenses current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
      - name: Self-test the licence check
        run: .github/scripts/licenses-check.test.sh
      - name: Verify THIRD_PARTY_LICENSES.md and NOTICE match the binary
        run: .github/scripts/licenses-check.sh

  # Release gate: re-scans the tag, uploads to Guardian, and fails the release if
  # Guardian blocks. `release` depends on it. Replaces the Vault-backed FOSSA scan.
  release-readiness:
    name: Release Readiness Check
    uses: ./.github/workflows/release-readiness-check.yaml
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    with:
      version: ${{ github.ref_name }}

  build-binaries:
    needs: [test, release-notes, licenses]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          go build \
            -ldflags "-s -w -X github.com/SolaceProducts/solace-broker-mcp/internal/version.version=${VERSION}" \
            -o solace-broker-mcp \
            ./cmd/server

      - name: Package archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="solace-broker-mcp-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          # NOTICE and THIRD_PARTY_LICENSES.md ship alongside LICENSE, not just in
          # the repository. Apache-2.0 section 4(d) requires the attribution
          # notices to travel with the derivative work, and THIRD_PARTY_LICENSES.md
          # describes itself as accompanying the release — which was not true of
          # this archive until SOL-152414.
          tar czf "${ARCHIVE}" \
            solace-broker-mcp \
            broker-config.example.yaml \
            LICENSE \
            NOTICE \
            THIRD_PARTY_LICENSES.md
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}

  build-docker:
    needs: [test, release-notes, licenses]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      git_ref: ${{ github.ref_name }}
      version: ${{ github.ref_name }}
      push: true
      platforms: linux/amd64,linux/arm64

  release:
    needs: [build-binaries, build-docker, release-readiness]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums-sha256.txt

      # A single artifact downloaded by name extracts flat into the working dir
      # (no name-subdirectory), so body_path: release-notes.md below resolves.
      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums-sha256.txt
