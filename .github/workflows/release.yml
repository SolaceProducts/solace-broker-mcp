name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write
  actions: read
  issues: write
  checks: write
  statuses: write

jobs:
  test:
    uses: ./.github/workflows/build-and-test.yml

  # Fail fast, before anything is published: a release must have a matching
  # CHANGELOG block. build-binaries/build-docker depend on this, so a forgotten
  # promotion can't leave a half-published release (image pushed, no notes).
  release-notes:
    name: Verify & extract release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG
        run: .github/scripts/extract-release-notes.sh "${GITHUB_REF_NAME}" release-notes.md
      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  # Same fail-fast reasoning as release-notes above, for the other artifact that
  # ships with the release. THIRD_PARTY_LICENSES.md satisfies a Legal release
  # condition, so a tag must not be publishable while it misstates the binary.
  #
  # The same check runs on every pull request, which is what normally keeps `main`
  # clean. This job is what makes that a guarantee rather than a dependency on the
  # branch-protection configuration being correct: until `Third-party licenses
  # current` is registered as a required status check, a pull request can merge
  # with it red. Verifying again at the tag closes that window, and costs seconds.
  licenses:
    name: Third-party licenses current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Self-test the licence check
        run: .github/scripts/licenses-check.test.sh
      - name: Verify THIRD_PARTY_LICENSES.md and NOTICE match the binary
        run: .github/scripts/licenses-check.sh

  fossa_scan:
    name: FOSSA Scan
    uses: SolaceDev/solace-public-workflows/.github/workflows/sca-scan-and-guard.yaml@fc521b087f780457f92d4cb46038184e92ad2fbc # pinned 2026-05-12
    with:
      git_ref: ${{ github.ref_name }}
      use_vault: false
      config_file: '.github/workflow-config.json'
    secrets:
      # Org-level Actions secret, not Vault. The workflow-level `id-token: write` is
      # still required — see the note in build-and-test.yml.
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

  build-binaries:
    needs: [test, release-notes, licenses]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          go build \
            -ldflags "-s -w -X github.com/SolaceProducts/solace-broker-mcp/internal/version.version=${VERSION}" \
            -o solace-broker-mcp \
            ./cmd/server

      - name: Package archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="solace-broker-mcp-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          # NOTICE and THIRD_PARTY_LICENSES.md ship alongside LICENSE, not just in
          # the repository. Apache-2.0 section 4(d) requires the attribution
          # notices to travel with the derivative work, and THIRD_PARTY_LICENSES.md
          # describes itself as accompanying the release — which was not true of
          # this archive until SOL-152414.
          tar czf "${ARCHIVE}" \
            solace-broker-mcp \
            broker-config.example.yaml \
            LICENSE \
            NOTICE \
            THIRD_PARTY_LICENSES.md
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}

  build-docker:
    needs: [test, release-notes, licenses]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/solacedev/solace-broker-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [build-binaries, build-docker, fossa_scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums-sha256.txt

      # A single artifact downloaded by name extracts flat into the working dir
      # (no name-subdirectory), so body_path: release-notes.md below resolves.
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums-sha256.txt
