name: Guardian Scan

# FOSSA + Prisma scanning that reports to Guardian. PR = report only; merge queue
# entry = scans skipped, gate passes with an accounted reason; push to main /
# release = upload + block on Guardian's verdict. Secrets come from the
# `guardian` Environment (no Vault). `Guardian scan gate` is the required status
# check.
#
# DAG: build (image) and the two FOSSA jobs run in parallel; prisma runs after
# build; guardian-gate runs after fossa-vuln + prisma (trunk only); gate
# aggregates everything; update-manifest records the merge in the release
# manifest (trunk only).
#
# Convention: `setup` computes every derived value as a string output; each job
# maps the ones it needs into `env:` and references `${{ env.* }}` rather than
# re-interpolating expressions inline, and boolean conditions use fromJSON().

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  # `Guardian scan gate` is required, so it must report in a merge queue too; see
  # `setup` for why a queue entry is its own mode (SOL-152974).
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to scan (branch, tag, or SHA). Empty = current ref."
        required: false
        type: string
  workflow_call:
    inputs:
      git_ref:
        required: false
        type: string
        default: ""
      product_full_version:
        required: false
        type: string
        default: ""
      fail_on_blocked:
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_REPO: solaceproducts/solace-broker-mcp
  IMAGE_REGISTRY: ghcr.io
  PRODUCT_NAME: solace-broker-mcp
  FOSSA_PROJECT_ID: SolaceProducts_solace-broker-mcp

jobs:
  setup:
    name: Resolve context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.ctx.outputs.mode }}
      ref: ${{ steps.ctx.outputs.ref }}
      fossa_branch: ${{ steps.ctx.outputs.fossa_branch }}
      fossa_revision: ${{ steps.ctx.outputs.fossa_revision }}
      full_version: ${{ steps.ctx.outputs.full_version }}
      is_fork: ${{ steps.ctx.outputs.is_fork }}
      is_pr: ${{ steps.ctx.outputs.is_pr }}
      is_trunk: ${{ steps.ctx.outputs.is_trunk }}
      is_queue: ${{ steps.ctx.outputs.is_queue }}
      enforce: ${{ steps.ctx.outputs.enforce }}
      fossa_mode: ${{ steps.ctx.outputs.fossa_mode }}
      scan_tag: scan-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref || github.ref }}
          persist-credentials: false
      # The classification lives in a script with a self-test because it decides
      # whether a run uploads to Guardian, runs the DB sync + Jira report, and
      # blocks on Guardian's verdict — and its `queue` arm cannot be exercised
      # end-to-end until a merge queue exists (SOL-152974). The self-test runs
      # first, and is not decoration: the regression it pins is a queue entry
      # silently classified as trunk.
      - name: Self-test the scan context resolution
        run: .github/scripts/guardian-scan-context.test.sh
      - name: Resolve
        id: ctx
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_REF: ${{ github.ref }}
          GIT_REF_INPUT: ${{ inputs.git_ref }}
          FULL_VERSION_INPUT: ${{ inputs.product_full_version }}
          FAIL_ON_BLOCKED: ${{ inputs.fail_on_blocked }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: .github/scripts/guardian-scan-context.sh

  # Every scan job also skips on a merge queue entry (`is_queue`), not just on
  # fork PRs. Off trunk the guards are all REPORT-only, so a queue-mode scan
  # could fail only on scanner infrastructure — no verdict value — while running
  # it would hand the `guardian` Environment's FOSSA/Prisma secrets to merged
  # content (fork PRs' included) on a ref that may never land, and couple queue
  # throughput to FOSSA/Prisma/ghcr availability with no bypass. Coverage is the
  # PR run before the queue and the trunk run after it; `gate` passes the skip
  # with an accounted reason, same as fork PRs.
  build:
    name: Build image
    needs: setup
    if: ${{ !fromJSON(needs.setup.outputs.is_fork) && !fromJSON(needs.setup.outputs.is_queue) }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-image.yaml
    with:
      git_ref: ${{ needs.setup.outputs.ref }}
      version: ${{ needs.setup.outputs.full_version }}
      scan_tag: ${{ needs.setup.outputs.scan_tag }}
      artifact_name: guardian-scan-image

  fossa-license:
    name: FOSSA licensing
    needs: setup
    if: ${{ !fromJSON(needs.setup.outputs.is_fork) && !fromJSON(needs.setup.outputs.is_queue) }}
    runs-on: ubuntu-latest
    environment: guardian
    permissions:
      contents: read
      packages: read     # pull the private maas-build-actions scan container
      pull-requests: write
      checks: write
      statuses: write
    env:
      IS_PR: ${{ needs.setup.outputs.is_pr }}
      FOSSA_MODE: ${{ needs.setup.outputs.fossa_mode }}
      FOSSA_BRANCH: ${{ needs.setup.outputs.fossa_branch }}
      FOSSA_REVISION: ${{ needs.setup.outputs.fossa_revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.ref }}
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: FOSSA analyze
        uses: SolaceDev/solace-public-workflows/.github/actions/sca/sca-scan@6c01e113782e1a95333f79d557c6ff078c93c2f2
        with:
          scanners: "fossa"
          additional_scan_params: |
            fossa.branch=${{ env.FOSSA_BRANCH }}
            fossa.revision=${{ env.FOSSA_REVISION }}
          fossa_api_key: ${{ secrets.FOSSA_API_KEY }}
      - name: FOSSA licensing guard
        uses: SolaceDev/solace-public-workflows/.github/actions/fossa-guard@6c01e113782e1a95333f79d557c6ff078c93c2f2
        with:
          fossa_api_key: ${{ secrets.FOSSA_API_KEY }}
          fossa_project_id: ${{ env.FOSSA_PROJECT_ID }}
          fossa_branch: ${{ env.FOSSA_BRANCH }}
          fossa_revision: ${{ env.FOSSA_REVISION }}
          fossa_category: licensing
          fossa_mode: ${{ env.FOSSA_MODE }}
          block_on: policy_conflict
          enable_diff_mode: ${{ env.IS_PR }}
          enable_pr_comment: ${{ env.IS_PR }}
          enable_status_check: ${{ env.IS_PR }}
          enable_privacy_mode: ${{ env.IS_PR }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  fossa-vuln:
    name: FOSSA vulnerability
    needs: setup
    if: ${{ !fromJSON(needs.setup.outputs.is_fork) && !fromJSON(needs.setup.outputs.is_queue) }}
    runs-on: ubuntu-latest
    environment: guardian
    permissions:
      contents: read
      packages: read     # pull the private maas-build-actions scan container
      pull-requests: write
      checks: write
      statuses: write
    env:
      IS_PR: ${{ needs.setup.outputs.is_pr }}
      IS_TRUNK: ${{ needs.setup.outputs.is_trunk }}
      FOSSA_BRANCH: ${{ needs.setup.outputs.fossa_branch }}
      FOSSA_REVISION: ${{ needs.setup.outputs.fossa_revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.ref }}
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: FOSSA analyze and upload
        uses: SolaceDev/solace-public-workflows/.github/actions/sca/sca-scan@6c01e113782e1a95333f79d557c6ff078c93c2f2
        with:
          scanners: "fossa"
          additional_scan_params: |
            fossa.branch=${{ env.FOSSA_BRANCH }}
            fossa.revision=${{ env.FOSSA_REVISION }}
          fossa_api_key: ${{ secrets.FOSSA_API_KEY }}
          # Upload only on trunk (env flag), never on a PR.
          guardian_url: ${{ fromJSON(env.IS_TRUNK) && secrets.GUARDIAN_URL || '' }}
          guardian_token: ${{ fromJSON(env.IS_TRUNK) && secrets.GUARDIAN_API_TOKEN || '' }}
      - name: FOSSA vulnerability guard
        uses: SolaceDev/solace-public-workflows/.github/actions/fossa-guard@6c01e113782e1a95333f79d557c6ff078c93c2f2
        with:
          fossa_api_key: ${{ secrets.FOSSA_API_KEY }}
          fossa_project_id: ${{ env.FOSSA_PROJECT_ID }}
          fossa_branch: ${{ env.FOSSA_BRANCH }}
          fossa_revision: ${{ env.FOSSA_REVISION }}
          fossa_category: vulnerability
          fossa_mode: REPORT
          block_on: critical,high
          enable_diff_mode: ${{ env.IS_PR }}
          enable_pr_comment: ${{ env.IS_PR }}
          enable_status_check: ${{ env.IS_PR }}
          enable_privacy_mode: ${{ env.IS_PR }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  prisma:
    name: Prisma scan
    needs: [setup, build]
    if: ${{ !fromJSON(needs.setup.outputs.is_fork) && !fromJSON(needs.setup.outputs.is_queue) }}
    runs-on: ubuntu-latest
    environment: guardian
    permissions:
      contents: read
      pull-requests: write
      checks: write      # prisma-cloud-scan creates a check run
      statuses: write
    env:
      IS_TRUNK: ${{ needs.setup.outputs.is_trunk }}
      SCAN_TAG: ${{ needs.setup.outputs.scan_tag }}
      FULL_VERSION: ${{ needs.setup.outputs.full_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.ref }}
          persist-credentials: false
      - name: Download scan image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: guardian-scan-image
      - name: Load image
        run: docker load -i image.tar
      # No guardian-vulnerability-diff step: the CVE-diff PR comment it posts is
      # not wanted on a public repo. The Prisma verdict is enforced by the
      # Guardian gate on trunk, not on PRs.
      - name: Prisma Cloud scan
        uses: SolaceDev/solace-public-workflows/prisma-cloud-scan@6c01e113782e1a95333f79d557c6ff078c93c2f2
        with:
          image_registry: ${{ env.IMAGE_REGISTRY }}
          image_repo: ${{ env.IMAGE_REPO }}
          image_tag: ${{ env.SCAN_TAG }}
          skip_image_pull: "true"
          pcc_console_url: ${{ secrets.PRISMACLOUD_CONSOLE_URL }}
          pcc_user: ${{ secrets.PRISMACLOUD_ACCESS_KEY_ID }}
          pcc_pass: ${{ secrets.PRISMACLOUD_SECRET_KEY }}
          bypass_blocking: "true"
          guardian_url: ${{ fromJSON(env.IS_TRUNK) && secrets.GUARDIAN_URL || '' }}
          guardian_key: ${{ fromJSON(env.IS_TRUNK) && secrets.GUARDIAN_API_TOKEN || '' }}
          guardian_product_name: ${{ env.PRODUCT_NAME }}
          guardian_product_version: main
          guardian_product_full_version: ${{ env.FULL_VERSION }}

  guardian-gate:
    name: Guardian gate
    needs: [setup, fossa-vuln, prisma]
    if: ${{ !cancelled() && !fromJSON(needs.setup.outputs.is_fork) && fromJSON(needs.setup.outputs.is_trunk) }}
    runs-on: ubuntu-latest
    environment: guardian
    permissions:
      contents: read
    env:
      FULL_VERSION: ${{ needs.setup.outputs.full_version }}
      ENFORCE: ${{ needs.setup.outputs.enforce }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.ref }}
          persist-credentials: false
      - name: Guardian DB sync and Jira report
        uses: SolaceDev/solace-public-workflows/guardian-db-sync@6c01e113782e1a95333f79d557c6ff078c93c2f2
        with:
          guardian-url: ${{ secrets.GUARDIAN_URL }}
          guardian-key: ${{ secrets.GUARDIAN_API_TOKEN }}
          product-name: ${{ env.PRODUCT_NAME }}
          product-full-version: ${{ env.FULL_VERSION }}
          unifiers: "fossa,prisma"
          upload-logs: "true"
      - name: Guardian vulnerability gate
        uses: SolaceDev/solace-public-workflows/guardian-vulnerability-gate@6c01e113782e1a95333f79d557c6ff078c93c2f2
        with:
          guardian-url: ${{ secrets.GUARDIAN_URL }}
          guardian-key: ${{ secrets.GUARDIAN_API_TOKEN }}
          product-name: ${{ env.PRODUCT_NAME }}
          product-version: ${{ env.FULL_VERSION }}
          fail-on-blocked: ${{ env.ENFORCE }}
          upload-logs: "true"

  gate:
    name: Guardian scan gate
    needs: [setup, build, fossa-license, fossa-vuln, prisma, guardian-gate]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Aggregate verdict
        env:
          IS_FORK: ${{ needs.setup.outputs.is_fork }}
          IS_TRUNK: ${{ needs.setup.outputs.is_trunk }}
          IS_QUEUE: ${{ needs.setup.outputs.is_queue }}
          R_BUILD: ${{ needs.build.result }}
          R_LICENSE: ${{ needs.fossa-license.result }}
          R_VULN: ${{ needs.fossa-vuln.result }}
          R_PRISMA: ${{ needs.prisma.result }}
          R_GATE: ${{ needs.guardian-gate.result }}
        run: |
          set -euo pipefail
          if [ "$IS_FORK" = "true" ]; then
            echo "::notice::Fork PR — scans skipped (no Environment secrets)."
            exit 0
          fi
          if [ "$IS_QUEUE" = "true" ]; then
            echo "::notice::Merge queue entry — scans skipped (PR run already reported; trunk run enforces after merge)."
            exit 0
          fi
          fail=0
          for pair in "build:$R_BUILD" "fossa-license:$R_LICENSE" "fossa-vuln:$R_VULN" "prisma:$R_PRISMA"; do
            name="${pair%%:*}"; res="${pair#*:}"
            if [ "$res" != "success" ]; then echo "::error::$name = $res"; fail=1; fi
          done
          if [ "$IS_TRUNK" = "true" ] && [ "$R_GATE" != "success" ]; then
            echo "::error::guardian-gate = $R_GATE"; fail=1
          fi
          [ "$fail" -eq 0 ] && echo "Guardian scan passed." || exit 1

  # Records the merge in the release manifest Guardian's scheduled scan reads to
  # pick a revision and an image. A blocked gate leaves the row at the previous
  # commit.
  #
  # Default-branch pushes only. `github.event_name` in a called workflow is the
  # CALLER's event, so release.yml's tag push also arrives here as `push` — the
  # ref_name check, not the event check, is what excludes it.
  #
  # `id-token: write` below is why release-readiness-check.yaml and release.yml
  # carry that scope: a reusable workflow's permissions must be a subset of its
  # caller's, enforced at run creation even though this job never runs there.
  update-manifest:
    name: Update release manifest
    needs: [setup, gate]
    if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # OIDC assume-role for the manifest table
      packages: read     # cicd-helper pulls the private maas-build-actions image
    env:
      FULL_VERSION: ${{ needs.setup.outputs.full_version }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::868978040651:role/github-solace-cloud-manifest-rw
          aws-region: us-east-1

      # `version` is read back as a FOSSA revision, so it must be the string the
      # FOSSA jobs above stamp — a branch name resolves to nothing.
      #
      # `image_tag` is the moving `dev` tag from the daily unstable build, not a
      # per-commit one. That build runs on a schedule and skips when its immutable
      # per-commit tag already exists, so a tag derived from this merge's SHA would
      # usually name something never pushed. The cost is that this row's version
      # and its image can be up to a day apart.
      #
      # Both matter: without `prisma_cloud` the container scan is skipped, and
      # without `image_tag` there is no image to resolve. A pull that 404s is not
      # a partial result — the scan fetcher discards a product's FOSSA output too
      # unless every enabled scanner succeeded.
      #
      # This is a put, not a merge: the item is replaced wholesale on every
      # merge, so anything meant to survive has to be listed here.
      - name: Write solace-cloud-manifest entry
        uses: SolaceDev/solace-public-workflows/.github/actions/cicd-helper@3e95ae9f28bf20a10a16cbfabc01a12276378e7d
        with:
          rc_step: add_item_from_json_to_dynamodb_table
          ddb_table_name: solace-cloud-manifest
          ddb_partition_key: squad
          ddb_sort_key: repository
          ddb_item_to_be_added: |
            {
              "squad": "ebp-dax",
              "repository": "${{ github.event.repository.name }}",
              "prisma_cloud": {
                "enabled": ["dev"]
              },
              "dev": {
                "sha": "${{ github.sha }}",
                "version": "${{ env.FULL_VERSION }}",
                "image_tag": "dev"
              }
            }
