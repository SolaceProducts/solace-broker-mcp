name: Build Scan Image

# Reusable build for the SCAN pipeline only: builds the image single-arch and
# saves it as a tar artifact for a downstream job to load and scan. It never
# pushes and needs only `contents: read` — so guardian-scan's build job, and the
# release-readiness → guardian-scan gate chain that calls it, don't have to
# grant registry/attestation scopes they never use. A reusable-workflow caller
# must grant AT LEAST the permissions this workflow's jobs declare (under-
# granting fails at run creation, it is not silently capped), so keeping this at
# contents: read keeps every caller minimal.
#
# The released multi-arch image is built, pushed, and attested inline in
# release.yml, which legitimately holds packages/id-token/attestations scopes
# without forcing them onto the scan path.

on:
  workflow_call:
    inputs:
      git_ref:
        required: true
        type: string
      version:
        description: "VERSION build-arg."
        required: false
        type: string
        default: ""
      image_name:
        required: false
        type: string
        default: "ghcr.io/solaceproducts/solace-broker-mcp"
      scan_tag:
        required: false
        type: string
        default: "scan"
      artifact_name:
        required: false
        type: string
        default: "guardian-scan-image"
      platforms:
        required: false
        type: string
        default: "linux/amd64"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.git_ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and save for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          tags: ${{ inputs.image_name }}:${{ inputs.scan_tag }}
          outputs: type=docker,dest=/tmp/image.tar
          build-args: |
            VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload scan image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_name }}
          path: /tmp/image.tar
          retention-days: 1
