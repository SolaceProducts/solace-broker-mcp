name: CI - Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Read-only for every job; the scan that needed elevated scopes moved to
# guardian-scan.yaml.
permissions:
  contents: read

jobs:
  # Supply-chain + container scanning moved to guardian-scan.yaml; its
  # `Guardian scan gate` job is the required check (replaced `SCA gate`).
  # See .github/ADMIN_SETUP.md.

  # Machine-generated commit emails publish permanently with the git history of
  # a public repository, and cannot be recalled without rewriting history
  # everyone has fetched. Prevention is the only control that works
  # (SOL-152902). This check used to live inside dco-check.sh; DCO enforcement
  # moved to the CNCF dco2 App, which checks sign-off and nothing else, so this
  # half needed its own home rather than disappearing with that script.
  #
  # The self-test runs first and is not decoration: a denylist that matches
  # nothing looks exactly like a denylist that found nothing.
  identity:
    name: Commit identity routable
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the check walks the range this PR adds, which needs
          # both the base and the head reachable.
          fetch-depth: 0
          persist-credentials: false
      - name: Self-test the commit identity check
        run: .github/scripts/commit-identity-check.test.sh
      - name: Verify every commit uses a routable author and committer address
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/commit-identity-check.sh

  release_notes_selftest:
    name: Release-notes extraction self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the release-notes extraction self-test against this PR's version
        run: .github/scripts/extract-release-notes.test.sh

  # THIRD_PARTY_LICENSES.md is the OSS compliance artifact that ships with the
  # release. It carried the sentence "Regenerate before each release" and drifted
  # anyway, in both directions (SOL-152414). This is the gate that sentence was
  # not.
  #
  # It reads no secrets and needs no credential, so unlike the FOSSA scan it gives
  # a real verdict on a fork pull request — which is where an unreviewed
  # dependency is most likely to arrive.
  #
  # The self-test runs first, and it is not decoration: the failure mode that
  # matters here is a vacuous pass, where a reformatted table stops parsing and
  # the check goes green forever while the inventory rots.
  licenses:
    name: Third-party licenses current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Self-test the licence check
        run: .github/scripts/licenses-check.test.sh
      - name: Verify THIRD_PARTY_LICENSES.md matches the binary
        run: .github/scripts/licenses-check.sh
      # The second of the two lists the Solace public-repository Legal checklist
      # requires. Same job rather than a new one: they are one obligation split
      # by what ships, and a reviewer should see both verdicts in one place.
      # `if: always()` is load-bearing. GitHub skips later steps once one fails,
      # so without it a red licenses-check.sh would stop these from running at
      # all — one gate masking the other, which is the exact coupling the
      # separate script exists to avoid. Same job, because both verdicts belong
      # under the one `Third-party licenses current` required check.
      - name: Self-test the build/test licence check
        if: always()
        run: .github/scripts/build-test-licenses-check.test.sh
      - name: Verify THIRD_PARTY_BUILD_TEST.md matches the build and test inputs
        if: always()
        run: .github/scripts/build-test-licenses-check.sh

  # Apache 2.0 works best when the grant travels with the file. The headers were
  # applied once, by hand, and the codebase then grew past them: 53 of 260 Go
  # files had none by August 2026 (SOL-152896). This is the gate that stops the
  # same clock restarting, and the reason the 53-file fix was worth doing at all.
  #
  # Needs no secret and no Go toolchain, so it gives a real verdict on a fork
  # pull request — which is exactly where an unheadered new file arrives.
  #
  # The self-test runs first because a vacuous pass is this check's dangerous
  # failure mode, not a false alarm. It has five plausible ones: a header below
  # the package clause, a reworded header, a missing blank line before `package`,
  # a walk that silently stops descending into a subtree, and a walk that matches
  # nothing at all. The suite pins each, and is kept honest by mutation — every
  # one of those five, applied to a copy of the script, turns it red.
  #
  # What this self-test does and does not buy: the gate and its self-test both
  # run from the PR's own ref, so the self-test closes no base-ref gap; it only
  # narrows the shape of the tamper. A blunt `exit 0`
  # in the script is caught — ten negative cases then exit 0 where they expect 1
  # — but the suite asserts over fixed fixtures, so an edit outside their shape
  # survives it. Adding `-o -name gen` to the prune list keeps the suite at 24/24
  # (its only nesting fixture is `internal/deep/pkg`) while every `.go` file under
  # a `gen/` directory silently stops being checked.
  #
  # That tamper hole is real, and unlike the Guardian scan gate in
  # guardian-scan.yaml it is not self-limiting: that gate dismisses tampering on
  # the grounds that a fork PR passes anyway, whereas this check gives fork PRs a
  # real verdict, so there is something to gain. It is accepted rather than
  # closed, on the same terms as `licenses`: the
  # control is a human reading the `.github/` diff, not the trigger. Note that
  # today that is ordinary review — `.github/CODEOWNERS` maps `*` to
  # dax-developers, but "Require review from Code Owners" is not enabled on the
  # `main-protection` ruleset yet (SOL-152412), so no reviewer is *compelled* by
  # the ruleset. Moving this job to `pull_request_target` to close the hole would
  # run untrusted code with an elevated token, which is a worse trade for a
  # licence-header check.
  license_headers:
    name: Licence headers present
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test the licence-header check
        run: .github/scripts/license-header-check.test.sh
      - name: Verify every Go file carries the Apache-2.0 header
        run: .github/scripts/license-header-check.sh

  # A fork pull request gets no vulnerability verdict from guardian-scan.yaml.
  # Every scan job there is gated on `!is_fork` because GitHub withholds
  # Environment secrets from a fork-triggered run, so `Guardian scan gate` passes
  # the skip with a logged notice and the first enforcing scan runs *after* merge.
  # A maintainer approving on code review cannot see a CVE. This is the check that
  # can (SOL-153086).
  #
  # It needs no third-party secret: the Dependency Review API is served by
  # GITHUB_TOKEN against the dependency graph, which is always on for a public
  # repository. That is the property that makes it the right tool here, and the
  # reason FOSSA is not.
  #
  # The whole policy is one value. `fail-on-severity: high` fails a pull request
  # that *introduces* a dependency carrying a known high or critical advisory.
  # Two consequences are worth knowing before requiring it:
  #
  #   - It reads the diff, not the tree. A pull request that does not touch
  #     go.mod has no dependency changes and passes, so an advisory published
  #     tomorrow against a dependency already in the tree does not turn every
  #     open pull request red. That containment is what makes this safe as a
  #     required check.
  #   - It blocks same-repo pull requests too, Dependabot's included. That is
  #     new. `fossa-vuln` runs REPORT on a pull request and blocks only on push
  #     to main, so a bump to a version that is still vulnerable used to land and
  #     go red afterwards; now it fails before merge. When the advisory has no
  #     fixed version there is no in-repo escape by design — closing it with an
  #     `allow-ghsas` list would need the named owner that
  #     .github/ADMIN_SETUP.md records as missing, so the escape is an admin
  #     bypass someone has to justify.
  #
  # `license-check: false` is set rather than left to its default. With no
  # allow/deny list the licence half is inert either way, but the licence policy
  # lives in FOSSA and a second copy of it here would drift — the failure mode
  # this repository keeps hitting. Setting it makes "vulnerabilities only" a
  # reviewable decision instead of an accident of defaults. The licence half is
  # recorded as an accepted gap in .github/ADMIN_SETUP.md.
  #
  # `show-openssf-scorecard: false` for the same reason zizmor runs
  # `--no-online-audits` in workflow-lint.yaml: it calls deps.dev live, and a
  # gate whose verdict can move with no commit behind it is not a gate.
  #
  # Read a green check as covering Go modules, not workflow actions. Roughly half
  # the dependency changes here are the `actions` ecosystem, and every action is
  # SHA-pinned, so advisory matching by version range does not resolve for them.
  # zizmor's known-vulnerable-actions is the control for that half, and it is
  # currently off (see workflow-lint.yaml).
  dependency_review:
    name: Dependencies free of high advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No checkout step: the action compares base against head through the API
      # and reads nothing from the working tree. `comment-summary-in-pr` stays
      # off deliberately — it needs `pull-requests: write`, which a fork pull
      # request's token does not carry, so enabling it would fail on exactly the
      # case this job exists for. The verdict goes to the job summary instead.
      - name: Review dependency changes for known advisories
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: false
          show-openssf-scorecard: false

  changelog:
    name: CHANGELOG updated
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Advise on a missing [Unreleased] entry for behavior-changing PRs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # advisory = warn but don't block the PR; the release is the hard gate.
          # Flip to "blocking" to fail PRs that skip the changelog.
          CHANGELOG_GATE_MODE: advisory
        run: .github/scripts/changelog-check.sh
