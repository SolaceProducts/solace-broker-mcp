name: CI - Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: write
  id-token: write
  actions: read
  issues: write
  checks: write
  statuses: write

jobs:
  fossa_scan:
    name: FOSSA Scan
    uses: SolaceDev/solace-public-workflows/.github/workflows/sca-scan-and-guard.yaml@fc521b087f780457f92d4cb46038184e92ad2fbc # pinned 2026-05-12
    with:
      use_vault: true
      config_file: '.github/workflow-config.json'
    secrets:
      # Vault address is injected from an org/repo secret, not committed to the repo.
      VAULT_URL: ${{ secrets.VAULT_URL }}

  changelog:
    name: CHANGELOG updated
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advise on a missing [Unreleased] entry for behavior-changing PRs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # advisory = warn but don't block the PR; the release is the hard gate.
          # Flip to "blocking" to fail PRs that skip the changelog.
          CHANGELOG_GATE_MODE: advisory
        run: .github/scripts/changelog-check.sh
