name: CI - Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Read-only for every job; the scan that needed elevated scopes moved to
# guardian-scan.yaml.
permissions:
  contents: read

jobs:
  # Supply-chain + container scanning moved to guardian-scan.yaml; its
  # `Guardian scan gate` job is the required check (replaced `SCA gate`).
  # See .github/ADMIN_SETUP.md.

  # The DCO gate itself runs from .github/workflows/dco.yaml on
  # pull_request_target, which means it executes the *base ref's* script — so a
  # PR that edits dco-check.sh never exercises its own version there. This job
  # closes that gap: it is an ordinary `pull_request` test of the PR's copy.
  #
  # It has to be a REQUIRED status check to do its job. Otherwise a PR that
  # breaks dco-check.sh shows this job red and `DCO sign-off` green — the gate
  # having passed on the base ref's still-working copy — merges anyway, and the
  # gate is broken for every PR after it, with the only warning being a check
  # nobody had to look at. See .github/ADMIN_SETUP.md.
  dco_selftest:
    name: DCO check self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the DCO check's self-test against this PR's version
        run: .github/scripts/dco-check.test.sh
      # dco.yaml runs pull_request_target (base ref), so a PR that breaks the
      # authenticated-fetch scheme it depends on never exercises its own
      # change there — this job exists precisely to close that gap for
      # dco-check.sh, and the same reasoning applies to the fetch's auth.
      # A same-repo pull_request run gets a real (if read-only-on-forks)
      # GITHUB_TOKEN, so this ls-remote is a faithful probe of the exact
      # mechanism, without touching any ref.
      - name: Verify the authenticated-fetch scheme dco.yaml relies on still works
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git ls-remote origin HEAD

  release_notes_selftest:
    name: Release-notes extraction self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the release-notes extraction self-test against this PR's version
        run: .github/scripts/extract-release-notes.test.sh

  # THIRD_PARTY_LICENSES.md is the OSS compliance artifact that ships with the
  # release. It carried the sentence "Regenerate before each release" and drifted
  # anyway, in both directions (SOL-152414). This is the gate that sentence was
  # not.
  #
  # It reads no secrets and needs no credential, so unlike the FOSSA scan it gives
  # a real verdict on a fork pull request — which is where an unreviewed
  # dependency is most likely to arrive.
  #
  # The self-test runs first, and it is not decoration: the failure mode that
  # matters here is a vacuous pass, where a reformatted table stops parsing and
  # the check goes green forever while the inventory rots. Same reasoning as
  # dco_selftest above.
  licenses:
    name: Third-party licenses current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Self-test the licence check
        run: .github/scripts/licenses-check.test.sh
      - name: Verify THIRD_PARTY_LICENSES.md matches the binary
        run: .github/scripts/licenses-check.sh
      # The second of the two lists the Solace public-repository Legal checklist
      # requires. Same job rather than a new one: they are one obligation split
      # by what ships, and a reviewer should see both verdicts in one place.
      # `if: always()` is load-bearing. GitHub skips later steps once one fails,
      # so without it a red licenses-check.sh would stop these from running at
      # all — one gate masking the other, which is the exact coupling the
      # separate script exists to avoid. Same job, because both verdicts belong
      # under the one `Third-party licenses current` required check.
      - name: Self-test the build/test licence check
        if: always()
        run: .github/scripts/build-test-licenses-check.test.sh
      - name: Verify THIRD_PARTY_BUILD_TEST.md matches the build and test inputs
        if: always()
        run: .github/scripts/build-test-licenses-check.sh

  # Apache 2.0 works best when the grant travels with the file. The headers were
  # applied once, by hand, and the codebase then grew past them: 53 of 260 Go
  # files had none by August 2026 (SOL-152896). This is the gate that stops the
  # same clock restarting, and the reason the 53-file fix was worth doing at all.
  #
  # Needs no secret and no Go toolchain, so it gives a real verdict on a fork
  # pull request — which is exactly where an unheadered new file arrives.
  #
  # The self-test runs first because a vacuous pass is this check's dangerous
  # failure mode, not a false alarm. It has five plausible ones: a header below
  # the package clause, a reworded header, a missing blank line before `package`,
  # a walk that silently stops descending into a subtree, and a walk that matches
  # nothing at all. The suite pins each, and is kept honest by mutation — every
  # one of those five, applied to a copy of the script, turns it red.
  #
  # Do NOT read dco_selftest's rationale onto this job. That one exists because
  # the enforcing DCO gate runs on `pull_request_target` against the *base ref's*
  # script, so the self-test is the only place the PR's own copy is exercised.
  # Here the gate and its self-test both run from the PR's ref, so the self-test
  # closes no such gap — a pull request that adds `exit 0` to the script turns
  # this check green with its own suite validating the neutered copy.
  #
  # That tamper hole is real, and unlike `sca_gate` above it is not self-limiting:
  # sca_gate dismisses tampering on the grounds that a fork PR passes anyway,
  # whereas this check gives fork PRs a real verdict, so there is something to
  # gain. It is accepted rather than closed, on the same terms as `licenses`: the
  # control is a human reading the `.github/` diff, not the trigger. Note that
  # today that is ordinary review — `.github/CODEOWNERS` maps `*` to
  # dax-developers, but "Require review from Code Owners" is not enabled on the
  # `main-protection` ruleset yet (SOL-152412), so no reviewer is *compelled* by
  # the ruleset. Moving this job to `pull_request_target` to close the hole would
  # run untrusted code with an elevated token, which is a worse trade for a
  # licence-header check.
  license_headers:
    name: Licence headers present
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Self-test the licence-header check
        run: .github/scripts/license-header-check.test.sh
      - name: Verify every Go file carries the Apache-2.0 header
        run: .github/scripts/license-header-check.sh

  changelog:
    name: CHANGELOG updated
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Advise on a missing [Unreleased] entry for behavior-changing PRs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # advisory = warn but don't block the PR; the release is the hard gate.
          # Flip to "blocking" to fail PRs that skip the changelog.
          CHANGELOG_GATE_MODE: advisory
        run: .github/scripts/changelog-check.sh
