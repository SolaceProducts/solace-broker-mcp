name: Observability

# Runs the OTel collector tracing E2E suite once a day, after the dev nightly
# build publishes a fresh ghcr.io/solaceproducts/solace-broker-mcp-dev:dev
# image. Kept separate from build-and-test.yml because the test targets the
# nightly image, not the commit under test, so it cannot be a required PR check.

on:
  workflow_run:
    workflows: ["Dev build (unstable)"]
    types: [completed]
  workflow_dispatch:

# One run at a time — the nightly fires once a day and the suite takes ~5 min,
# so there is no meaningful queue to drain.
concurrency:
  group: e2e-tracing
  cancel-in-progress: false

permissions:
  contents: read
  # A failed nightly run opens or updates a tracking issue (see the last step).
  issues: write

jobs:
  e2e-tracing:
    # On workflow_run: only proceed if the dev build succeeded.
    # On workflow_dispatch: always run.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default checkout (main HEAD). The nightly build also runs from main,
          # so this matches the image's commit in practice. Pinning
          # workflow_run.head_sha would tighten that but trips CodeQL's
          # cache-poisoning check for a negligible gain.
          persist-credentials: false

      - name: Start stack
        run: docker compose -f test/e2e-tracing/docker-compose.yml up -d

      - name: Run tracing E2E tests
        run: bash test/e2e-tracing/run-all.sh

      - name: Collector logs (on failure)
        if: failure()
        run: docker logs otel-collector-e2e-tracing 2>&1 | tail -100

      - name: Tempo logs (on failure)
        if: failure()
        run: docker logs tempo-e2e-tracing 2>&1 | tail -100

      - name: MCP server logs (on failure)
        if: failure()
        run: docker logs mcp-server-e2e-tracing 2>&1 | tail -100

      - name: Broker logs (on failure)
        if: failure()
        run: docker logs solace-e2e-tracing 2>&1 | tail -100

      - name: Tear down
        if: always()
        run: docker compose -f test/e2e-tracing/docker-compose.yml down -v

      # Post-merge this suite runs unattended, so a red run must reach someone.
      # Opens a tracking issue, or comments on the existing open one to avoid a
      # new issue every night.
      - name: Open a tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly observability e2e-tracing failed"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again on $(date -u +%Y-%m-%d): $RUN_URL"
          else
            gh issue create --title "$title" \
              --body "The nightly observability tracing suite failed. Investigate the shipped collector/Tempo configs first, since this workflow contains no Go code. Run: $RUN_URL"
          fi
