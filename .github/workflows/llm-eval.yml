name: LLM E2E Eval

# LLM e2e suite under test/e2e-llm/. release.yml calls this on a v* tag and
# does not push the image or create the GitHub Release until it passes.
# workflow_dispatch still evaluates inputs.target_branch (default main).
# No per-PR trigger and no schedule. One attempt per run. A full matrix
# costs API credits (~$4.78 measured 2026-08-05). A red run is re-run with
# `gh run rerun`; there is no admin skip.
#
# Checkout is inputs.target_branch when that input is set (manual dispatch,
# default main). On workflow_call that input does not exist, so the ref is
# github.sha, the caller's commit. github.event_name stays the caller's
# event (push on a tag), so it cannot be used to tell the two paths apart.
# summary.txt records head (git rev-parse HEAD) beside commit (GITHUB_SHA).

on:
  workflow_call:
    inputs:
      broker_target:
        required: false
        type: string
        default: local-docker
      scenario_filter:
        required: false
        type: string
        default: ''
    secrets:
      LLM_SERVICE_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch / ref to check out and evaluate'
        required: false
        default: 'main'
        type: string
      broker_target:
        description: 'Broker target (matches a file in test/e2e-llm/targets/)'
        required: false
        default: 'local-docker'
        type: string
      scenario_filter:
        description: 'Optional substring filter passed to run-all.sh --filter (empty = run every scenario)'
        required: false
        default: ''
        type: string

# Do not cancel an in-progress run. Cancelling spends the API credits and
# leaves broker containers on a runner that is about to be reclaimed.
# On a called workflow github.workflow is the caller name (Release on a tag)
# and github.sha is that tag's commit. GitHub keeps one running and one
# pending run per group, so a group of only github.workflow would queue every
# release together and a third tag would cancel the waiting one. Adding the
# SHA puts each tag in its own group; two runs of the same commit still
# share one. Hosted runners do not share a Docker daemon, and the release
# call is local-docker, so it does not share a lab broker with a manual lab
# run.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  llm-eval:
    runs-on: ubuntu-latest
    # Headroom, not a guess: the full 35-row matrix took 7m50s of suite time in
    # a 10m26s job on a hosted runner (run 31039920539, 2026-08-05), measured
    # after the Mode-2 rows landed.
    timeout-minutes: 30
    env:
      # Steps read env.*, never inputs.*. Dispatch sets target_branch (default
      # main). workflow_call does not define that input, so it is empty and
      # the ref is github.sha, the caller's commit. Do not branch on
      # github.event_name: in a called workflow that is the caller's event.
      TARGET_BRANCH: ${{ inputs.target_branch || github.sha }}
      BROKER_TARGET: ${{ inputs.broker_target || 'local-docker' }}
      SCENARIO_FILTER: ${{ inputs.scenario_filter }}
    steps:
      - name: Resolve run-record directory
        # Defined once here and read as env.ART_DIR by the three steps that
        # write, summarize, and upload it. It cannot live in the job-level env
        # block above: the `runner` context is not in scope there. Outside the
        # workspace, so the run record never mixes with the checkout.
        run: echo "ART_DIR=$RUNNER_TEMP/llm-eval-run" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Setup Node (for Claude CLI install)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Tracks the pinned CLI's own floor, which rose from >=18.0.0 to
          # >=22.0.0 between 2.1.181 and 2.1.223. Node 20 satisfied the old
          # floor, so this pin was invisible until the bump. npm's default
          # engine-strict=false would have installed anyway and left the
          # violation to surface later, in the CLI rather than the install.
          # Re-check this against `npm view @anthropic-ai/claude-code engines`
          # when bumping the pin.
          node-version: '22'

      - name: Install pinned Claude Code CLI
        # npm ci installs exactly what package-lock.json pins (FOSSA
        # scans the same lockfile), then we prepend node_modules/.bin
        # so `claude` resolves on PATH. Single source of truth for the
        # version: package.json — config.env reads from there.
        working-directory: test/e2e-llm
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          ./node_modules/.bin/claude --version

      - name: Assertion self-test (offline)
        # Replays canned stream-json through run-scenario.sh's assertions with a
        # stub `claude`, so the failing direction of `expected_no_mutating_tools`
        # is exercised — every live scenario only ever exercises the passing one.
        # Costs no credits and needs no brokers, so it runs before fixtures: a
        # broken safety assertion should fail the run in seconds, not after a
        # full matrix has spent its budget passing vacuously.
        run: bash test/e2e-llm/test-assertions.sh

      - name: Start local brokers + fixtures
        # No-op for non-local-docker targets — setup-fixtures.sh guards
        # on BROKER_TARGET. Lab targets are assumed already running.
        id: fixtures
        run: bash test/e2e-llm/setup-fixtures.sh

      - name: Verify LLM service credentials present
        # Fail fast and loud rather than silently falling into the
        # ambient ~/.claude path on a hosted runner (which then errors
        # with a less-pointed CLI message). Only enforced when an
        # endpoint is configured — local-dev paths without an endpoint
        # still rely on the runner's ambient login.
        if: vars.LLM_SERVICE_ENDPOINT != ''
        env:
          LLM_SERVICE_API_KEY: ${{ secrets.LLM_SERVICE_API_KEY }}
        run: |
          if [ -z "${LLM_SERVICE_API_KEY}" ]; then
            echo "::error::LLM_SERVICE_API_KEY secret is not set but LLM_SERVICE_ENDPOINT is configured"
            exit 1
          fi

      - name: Run LLM eval suite
        # LLM_SERVICE_API_KEY is a GitHub Actions secret for now — once
        # the Solace secret-storage decision lands we'll swap this for a
        # Vault retrieval step (see SOL-150789 follow-up notes). When
        # LLM_SERVICE_ENDPOINT is unset the runner falls back to the
        # CLI's ambient ~/.claude login (local-dev convenience). When
        # the endpoint IS set, the preceding step has already enforced
        # that the secret is present.
        #
        # SCENARIO_FILTER reaches the run body through env (job-level), so it is
        # never interpolated into the script — avoids the GitHub
        # script-injection shape even though workflow_dispatch is
        # write-access-only.
        id: suite
        # Below the job's 30, deliberately. A stalled request is the only
        # realistic route to a wall-clock cap here — nothing bounds a scenario
        # in time (`--max-turns 5` bounds turns, and the claude invocation has
        # no timeout(1) wrapper). Capping the step instead of the job means a
        # stall surfaces as a step `failure`, which the classifier below reads
        # as an ordinary infrastructure failure, and Collect / Upload / Teardown
        # then run as normal steps rather than under cancellation.
        timeout-minutes: 22
        env:
          LLM_SERVICE_ENDPOINT: ${{ vars.LLM_SERVICE_ENDPOINT }}
          LLM_SERVICE_MODEL_NAME: ${{ vars.LLM_SERVICE_MODEL_NAME }}
          LLM_SERVICE_API_KEY: ${{ secrets.LLM_SERVICE_API_KEY }}
        run: |
          mkdir -p "$ART_DIR"
          ARGS=()
          if [ -n "$SCENARIO_FILTER" ]; then
            ARGS+=(--filter "$SCENARIO_FILTER")
          fi
          # pipefail so tee cannot mask the suite's exit code — without it every
          # run in the window would look green.
          set -o pipefail
          bash test/e2e-llm/run-all.sh "${ARGS[@]}" 2>&1 | tee "$ART_DIR/run-raw.log"

      - name: Broker logs (on failure)
        if: failure() && env.BROKER_TARGET == 'local-docker'
        run: |
          echo "=== solace-e2e-llm-a ==="
          docker logs solace-e2e-llm-a 2>&1 | tail -100 || true
          echo "=== solace-e2e-llm-b ==="
          docker logs solace-e2e-llm-b 2>&1 | tail -100 || true

      - name: MCP server log (on failure)
        if: failure() && env.BROKER_TARGET == 'local-docker'
        run: cat test/e2e-llm/bin/mcp-server.log 2>/dev/null || echo "(no server log)"

      - name: Collect run record
        # The console log is the only record of a run today, and reading 20 of
        # them by hand at write-up time is the reason this step exists. It
        # writes a fixed-shape summary.txt so the window's results can be
        # tallied mechanically, and classifies infrastructure failures (fixtures
        # or precheck) apart from scenario failures — that split is a deliberate
        # output of the experiment, not a nicety.
        if: always()
        env:
          FIXTURES_OUTCOME: ${{ steps.fixtures.outcome }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          mkdir -p "$ART_DIR"
          RAW="$ART_DIR/run-raw.log"
          LOG="$ART_DIR/run.log"

          # The suite colours its output unconditionally (helpers.sh does not
          # gate on a tty), so strip ANSI for a log that is still readable in a
          # text editor weeks from now.
          if [ -f "$RAW" ]; then
            sed 's/\x1b\[[0-9;]*m//g' "$RAW" > "$LOG"
            rm -f "$RAW"
          fi

          # Keep the MCP server log alongside the run log when something broke;
          # the runner's own log expires, and an infrastructure failure is
          # undiagnosable without it.
          if [ "$SUITE_OUTCOME" != "success" ] && [ -f test/e2e-llm/bin/mcp-server.log ]; then
            cp test/e2e-llm/bin/mcp-server.log "$ART_DIR/mcp-server.log"
          fi

          # Classification order matters: each branch rules out an earlier stage
          # of the run, so the first match is the earliest thing that broke.
          #
          # `cancelled` and `skipped` are checked before the generic
          # `!= "success"` tests, which would otherwise absorb both and file
          # them under a stage that never ran. A step is `skipped` when an
          # earlier step (Checkout, Setup Go, npm ci) failed first, and
          # `cancelled` when the job hit `timeout-minutes` or was stopped by
          # hand. The infra-vs-scenario split is read mechanically at window
          # end, so a misfiled row silently inflates the infra column.
          if [ "$SUITE_OUTCOME" = "cancelled" ] || [ "$FIXTURES_OUTCOME" = "cancelled" ]; then
            CLASS="infrastructure (run cancelled or timed out)"
          elif [ "$FIXTURES_OUTCOME" = "skipped" ]; then
            CLASS="infrastructure (run aborted before fixtures)"
          elif [ "$FIXTURES_OUTCOME" != "success" ]; then
            CLASS="infrastructure (fixture setup)"
          elif [ ! -f "$LOG" ]; then
            CLASS="infrastructure (suite produced no output)"
          elif grep -q 'PRECHECK FAIL' "$LOG"; then
            CLASS="infrastructure (precheck: MCP or broker unreachable)"
          elif grep -q '^Summary: ' "$LOG"; then
            CLASS="scenario (suite ran to completion)"
          else
            CLASS="infrastructure (suite aborted before its summary)"
          fi

          {
            echo "run_id:          ${GITHUB_RUN_ID}"
            echo "run_number:      ${GITHUB_RUN_NUMBER}"
            echo "run_attempt:     ${GITHUB_RUN_ATTEMPT}"
            echo "event:           ${GITHUB_EVENT_NAME}"
            echo "ref:             ${TARGET_BRANCH}"
            echo "commit:          ${GITHUB_SHA}"
            echo "head:            $(git rev-parse HEAD)"
            echo "finished_utc:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "broker_target:   ${BROKER_TARGET}"
            echo "scenario_filter: ${SCENARIO_FILTER:-(none)}"
            echo "fixtures:        ${FIXTURES_OUTCOME}"
            echo "suite:           ${SUITE_OUTCOME}"
            echo "failure_class:   ${CLASS}"
            echo
            if [ -f "$LOG" ]; then
              # Reprint the suite's own result table and its `total cost:` line.
              # Anchored on the table's header and closing rule rather than on a
              # PASS/FAIL pattern, so a mid-run "[PASS]" line cannot land here.
              awk '
                /^scenario +result$/ { intable = 1; next }
                intable && /^═+$/    { intable = 0; next }
                intable && /^─+$/    { next }
                intable              { print; next }
                /^Summary: /         { print }
                /^Failed: /          { print }
              ' "$LOG"
            else
              echo "(no suite output — see failure_class)"
            fi
          } > "$ART_DIR/summary.txt"

          # Same content on the run's summary page, so a day's result is
          # readable without downloading the artifact.
          {
            echo '```'
            cat "$ART_DIR/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run record
        # Retention outlasts the 20-day collection window plus write-up time, so
        # day 1 is still readable on the day the window closes.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-eval-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: ${{ env.ART_DIR }}
          retention-days: 60
          if-no-files-found: error

      - name: Tear down local brokers
        if: always() && env.BROKER_TARGET == 'local-docker'
        run: docker compose -f test/e2e-llm/docker-compose.yml down -v
