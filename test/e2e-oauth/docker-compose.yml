# Keycloak (TLS, realm import) + two Solace brokers (prod-us/test-us in the
# generated MCP config; container names below are suite-scoped so they never
# collide with a developer's other local Keycloak/broker containers).
#
# All 3 services share this project's default network, so
# configure-oauth-profiles.sh's SEMP calls (host-side, via the published ports
# below) and the Keycloak JWKS URL used by the brokers
# (http://keycloak:8080/..., container-side) both work without a manual
# network-join step.
#
# TLS certs must exist before `up` — generated by helpers.sh's
# ensure_tls_certs, called from the Makefile target before `docker compose up`.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: keycloak-e2e-oauth
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/certs/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/certs/keycloak.key
      # org.keycloak.events at DEBUG makes successful TOKEN_EXCHANGE events log
      # a grep-able line — at the default INFO level only failures are logged.
      # This is what count_token_exchanges() in helpers.sh greps.
      KC_LOG_LEVEL: "INFO,org.keycloak.events:DEBUG"
    ports:
      - "${KEYCLOAK_HTTPS_PORT:-18543}:8443"
      - "${KEYCLOAK_HTTP_PORT:-18280}:8080"
    volumes:
      - ./bin/certs/keycloak/keycloak.crt:/opt/keycloak/conf/certs/keycloak.crt:ro
      - ./bin/certs/keycloak/keycloak.key:/opt/keycloak/conf/certs/keycloak.key:ro
      - ./realm-export.json:/opt/keycloak/data/import/mcp-test-realm-realm.json:ro
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8443 && echo OK >&3"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  solace-a:
    image: solace/solace-pubsub-standard:latest
    container_name: solace-e2e-oauth-a
    hostname: solace-e2e-oauth-a
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=${BROKER_PASSWORD:-admin}
    ports:
      - "${BROKER_A_SEMP_PORT:-8102}:8080"
      - "${BROKER_A_SEMP_TLS_PORT:-2943}:1943"
    shm_size: 1g
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:${BROKER_PASSWORD:-admin} http://localhost:8080/SEMP/v2/config/about || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  solace-b:
    image: solace/solace-pubsub-standard:latest
    container_name: solace-e2e-oauth-b
    hostname: solace-e2e-oauth-b
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=${BROKER_PASSWORD:-admin}
    ports:
      - "${BROKER_B_SEMP_PORT:-8104}:8080"
      - "${BROKER_B_SEMP_TLS_PORT:-2945}:1943"
    shm_size: 1g
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:${BROKER_PASSWORD:-admin} http://localhost:8080/SEMP/v2/config/about || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
