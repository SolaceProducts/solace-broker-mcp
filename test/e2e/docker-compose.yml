services:
  solace-a:
    image: solace/solace-pubsub-standard:latest
    container_name: solace-e2e-a
    hostname: solace-e2e-a
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=${BROKER_PASSWORD:-admin}
    ports:
      - "${BROKER_A_SEMP_PORT:-8080}:8080"
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  solace-b:
    image: solace/solace-pubsub-standard:latest
    container_name: solace-e2e-b
    hostname: solace-e2e-b
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=${BROKER_PASSWORD:-admin}
    ports:
      - "${BROKER_B_SEMP_PORT:-8082}:8080"
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
