# OAuth Integration Test Configuration
# This config is used by test-oauth.sh to verify OAuth authentication.
#
# Prerequisites:
#   1. Run ./setup-keycloak.sh to start Keycloak and configure OAuth
#   2. Set environment variables for broker credentials:
#      - BROKER_USERNAME (default: admin)
#      - BROKER_PASSWORD (default: admin)
#
# To use a different broker, modify the URL below:

port: 9091
development_mode: false

# OAuth configuration - values are injected by setup-keycloak.sh into test/e2e/oauth/.env
client_auth:
  issuer: "http://localhost:8090/realms/solace"
  audience: "solace-mcp-server"
  resource_url: "http://localhost:9091/mcp"
  required_scopes:
    - solace:read
    - solace:write

# Broker configuration
# Note: This broker is only needed for config validation.
# The OAuth test doesn't actually connect to the broker.
brokers:
  test-broker:
    url: http://localhost:8080
    auth:
      mode: basic
      username: ${BROKER_USERNAME}
      password: ${BROKER_PASSWORD}
