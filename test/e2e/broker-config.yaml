# E2E test broker configuration — reference copy.
#
# The test harness generates this dynamically from .env values via write_config().
# This file exists for documentation and manual use (e.g. starting the server by hand):
#
#   ENV_FILE=test/e2e/.env CONFIG_FILE=test/e2e/broker-config.yaml go run ./cmd/server
#
# Ports must match BROKER_A_SEMP_PORT / BROKER_B_SEMP_PORT in .env.
# Credentials use ${VAR} substitution, resolved from .env via ENV_FILE.

# ── Auth settings ───────────────────────────────────────────────────────────
development_mode: true                # Skip OAuth validation (uses static dev token)
client_auth:
  dev_token: e2e-static-dev-token     # Required when development_mode is true.
# client_auth:                        # When development_mode is false, set these instead:
#   issuer: "https://idp.example.com" #   IdP issuer URL
#   audience: "solace-mcp"            #   Expected 'aud' claim
#   resource_url: "https://mcp.example.com/mcp"  # OAuth resource URL

# ── Server settings ─────────────────────────────────────────────────────────
port: 9090                            # HTTP port (default: 9090, env override: MCP_SERVER_PORT)
# log_level: info                     # Log level (default: info)
# tls_cert_file: ""                   # Path to TLS certificate (optional, enables HTTPS)
# tls_key_file: ""                    # Path to TLS private key (required if tls_cert_file is set)

# ── SEMP client settings ────────────────────────────────────────────────────
semp:
  max_concurrent_per_broker: 10       # Max concurrent SEMP requests per broker (default: 10)
  request_timeout_duration: 1m        # Per-request timeout for SEMP API calls (default: 1m)
  request_min_interval: 100ms         # Minimum interval between requests (default: 100ms)
  retries: 10                         # Number of retries on failure (default: 10)
  retry_min_interval: 3s              # Minimum retry backoff (default: 3s)
  retry_max_interval: 30s             # Maximum retry backoff (default: 30s)

# ── Brokers ─────────────────────────────────────────────────────────────────
brokers:
  broker-a:
    url: "http://localhost:8080"      # SEMP API base URL
    insecure_skip_verify: false       # Skip TLS cert verification (default: false, dev only)
    auth:
      mode: basic                     # Auth mode (basic)
      username: "${E2E_A_USERNAME}"   # Resolved from .env
      password: "${E2E_A_PASSWORD}"
  broker-b:
    url: "http://localhost:8082"
    insecure_skip_verify: false
    auth:
      mode: basic
      username: "${E2E_B_USERNAME}"
      password: "${E2E_B_PASSWORD}"
