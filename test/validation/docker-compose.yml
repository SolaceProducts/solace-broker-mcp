services:
  solace:
    image: docker.solacedev.ca/pubsubplus/solace-pubsub-enterprise:10.25.11.3479
    container_name: solace-validation
    hostname: solace-validation
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=${BROKER_PASSWORD:-admin}
    ports:
      - "${BROKER_SEMP_PORT:-8080}:8080"
      - "${BROKER_SMF_PORT:-55555}:55555"
      - "${BROKER_REST_PORT:-9000}:9000"
    shm_size: 2g
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
