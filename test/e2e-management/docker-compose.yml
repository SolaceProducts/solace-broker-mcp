services:
  solace-a:
    image: solace/solace-pubsub-standard:${SOLACE_TAG:-latest}
    container_name: solace-e2e-mgmt-a
    hostname: solace-e2e-mgmt-a
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=${BROKER_PASSWORD:-admin}
      # Kafka bridge capacity (SOL-156214). Both default to 0 on this image, and
      # with 0 every Kafka Receiver/Sender create fails "Kafka Bridge limit of 0
      # reached". They are fixed tiers, not free integers: bridges 0/10/50/200,
      # broker connections 0/300/2000/10000; any other value makes the container
      # exit at boot.
      - SYSTEM_SCALING_MAXKAFKABRIDGECOUNT=10
      - SYSTEM_SCALING_MAXKAFKABROKERCONNECTIONCOUNT=300
    ports:
      - "${BROKER_A_SEMP_PORT:-8094}:8080"
    shm_size: 1g
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:${BROKER_PASSWORD:-admin} http://localhost:8080/SEMP/v2/config/about || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  solace-b:
    image: solace/solace-pubsub-standard:${SOLACE_TAG:-latest}
    container_name: solace-e2e-mgmt-b
    hostname: solace-e2e-mgmt-b
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=${BROKER_PASSWORD:-admin}
      # Kafka bridge capacity (SOL-156214). Both default to 0 on this image, and
      # with 0 every Kafka Receiver/Sender create fails "Kafka Bridge limit of 0
      # reached". They are fixed tiers, not free integers: bridges 0/10/50/200,
      # broker connections 0/300/2000/10000; any other value makes the container
      # exit at boot.
      - SYSTEM_SCALING_MAXKAFKABRIDGECOUNT=10
      - SYSTEM_SCALING_MAXKAFKABROKERCONNECTIONCOUNT=300
    ports:
      - "${BROKER_B_SEMP_PORT:-8096}:8080"
    shm_size: 1g
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:${BROKER_PASSWORD:-admin} http://localhost:8080/SEMP/v2/config/about || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Real Kafka for the Kafka bridge write-tool tests (SOL-156214): single-node
  # KRaft, two listeners reachable from both Solace containers over the compose
  # network. 9092 is PLAINTEXT (authenticationScheme none); 9094 is SASL_PLAINTEXT
  # with the PLAIN mechanism (authenticationScheme basic), user kuser. The
  # password below is a throwaway test credential; the tests set it on the bridge
  # out of band, never through the MCP server. Topic auto-creation is off so the
  # "topic must exist" behaviour is real.
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-e2e-mgmt
    hostname: kafka-e2e-mgmt
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,SASL://:9094,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-e2e-mgmt:9092,SASL://kafka-e2e-mgmt:9094
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL:SASL_PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-e2e-mgmt:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_SASL_ENABLED_MECHANISMS=PLAIN
      - 'KAFKA_LISTENER_NAME_SASL_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required user_kuser="kpass";'
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - CLUSTER_ID=ci4PjZ5aQzq5TZ4S3o1AeB
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
