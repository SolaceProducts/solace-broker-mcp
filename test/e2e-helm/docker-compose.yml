services:
  solace-a:
    image: solace/solace-pubsub-standard:latest
    container_name: solace-e2e-helm-a
    hostname: solace-e2e-helm-a
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=${BROKER_PASSWORD:-admin}
      # The chart's credentials for this broker only (see .env).
      - username_${CHART_A_USERNAME}_globalaccesslevel=admin
      - username_${CHART_A_USERNAME}_password=${CHART_A_PASSWORD}
    ports:
      - "${BROKER_A_SEMP_PORT:-8106}:8080"
    shm_size: 1g
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:${BROKER_PASSWORD:-admin} http://localhost:8080/SEMP/v2/config/about || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  solace-b:
    image: solace/solace-pubsub-standard:latest
    container_name: solace-e2e-helm-b
    hostname: solace-e2e-helm-b
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=${BROKER_PASSWORD:-admin}
      # The chart's credentials for this broker only (see .env).
      - username_${CHART_B_USERNAME}_globalaccesslevel=admin
      - username_${CHART_B_USERNAME}_password=${CHART_B_PASSWORD}
    ports:
      - "${BROKER_B_SEMP_PORT:-8108}:8080"
    shm_size: 1g
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:${BROKER_PASSWORD:-admin} http://localhost:8080/SEMP/v2/config/about || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
