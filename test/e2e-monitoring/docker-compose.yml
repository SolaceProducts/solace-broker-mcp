services:
  solace-a:
    image: solace/solace-pubsub-standard:latest
    container_name: solace-e2e-mon-a
    hostname: solace-e2e-mon-a
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=${BROKER_PASSWORD:-admin}
      # F9/F10 Kafka Receivers/Senders (SOL-152370): both default to 0 on this
      # image — not a license restriction, a scaling default (confd env-backend
      # keys /system/scaling/maxkafkabridgecount and
      # .../maxkafkabrokerconnectioncount, enum-restricted: bridges to
      # 0/10/50/200, broker-connections to 0/300/2000/10000 — see
      # SYSTEM_SCALING_MAXKAFKABRIDGECOUNT in README.md's Kafka findings).
      - SYSTEM_SCALING_MAXKAFKABRIDGECOUNT=10
      - SYSTEM_SCALING_MAXKAFKABROKERCONNECTIONCOUNT=300
    ports:
      - "${BROKER_A_SEMP_PORT:-8090}:8080"
      - "${BROKER_A_SMF_PORT:-55655}:55555"
    shm_size: 1g
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:${BROKER_PASSWORD:-admin} http://localhost:8080/SEMP/v2/config/about || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  solace-b:
    image: solace/solace-pubsub-standard:latest
    container_name: solace-e2e-mon-b
    hostname: solace-e2e-mon-b
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=${BROKER_PASSWORD:-admin}
      - SYSTEM_SCALING_MAXKAFKABRIDGECOUNT=10
      - SYSTEM_SCALING_MAXKAFKABROKERCONNECTIONCOUNT=300
    ports:
      - "${BROKER_B_SEMP_PORT:-8092}:8080"
      - "${BROKER_B_SMF_PORT:-55656}:55555"
    shm_size: 1g
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:${BROKER_PASSWORD:-admin} http://localhost:8080/SEMP/v2/config/about || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # F9/F10 Kafka Receivers/Senders (SOL-152370): single-node KRaft-mode Kafka
  # broker (no ZooKeeper) that both solace-a and solace-b bridge to. Reachable
  # from either Solace container over the compose network's default bridge at
  # this service's hostname on 9092 — mirrors how F8 bridges reach the sibling
  # Solace broker at its container hostname, but here the "remote" side is a
  # genuinely different broker technology, not another Solace instance.
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-e2e-mon
    hostname: kafka-e2e-mon
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-e2e-mon:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-e2e-mon:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - CLUSTER_ID=ci4PjZ5aQzq5TZ4S3o1AeA
    ports:
      - "${KAFKA_PORT:-9094}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
