# OAuth Integration Test Configuration
# This config is used by test-oauth.sh to verify OAuth authentication.
#
# Prerequisites:
#   1. Run ./setup-keycloak.sh to start Keycloak and configure OAuth
#   2. Set environment variables for broker credentials:
#      - BROKER_USERNAME (set by test-oauth.sh, defaults to "admin")
#      - BROKER_PASSWORD (set by test-oauth.sh, defaults to "admin")
#
# To use a different broker, modify the URL below:

port: 9091
# The OAuth integration test drives the server on a plaintext listener; TLS is a
# separate concern here. Acknowledge upstream TLS termination so mode: oauth does
# not refuse to start with no cert/key.
tls_terminated_upstream: true
mcp_client_auth:
  mode: oauth
  issuer: "https://localhost:8443/realms/solace"
  audience: "solace-mcp-server"
  resource_url: "https://localhost:9091/mcp"

# Broker configuration
# Note: This broker is only needed for config validation — the OAuth test
# doesn't actually connect to it. The https:// scheme is required because
# mode: oauth enforces TLS on all URLs (see validateBrokerURL).
brokers:
  test-broker:
    url: https://localhost:8080
    auth:
      mode: basic
      username: ${BROKER_USERNAME}
      password: ${BROKER_PASSWORD}
