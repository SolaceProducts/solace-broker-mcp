services:
  solace:
    image: solace/solace-pubsub-standard:latest
    container_name: solace-e2e-tracing
    hostname: solace-e2e-tracing
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=${BROKER_PASSWORD:-admin}
    ports:
      - "${BROKER_SEMP_PORT:-8095}:8080"
    shm_size: 1g
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:${BROKER_PASSWORD:-admin} http://localhost:8080/SEMP/v2/config/about || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: otel-collector-e2e-tracing
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      - OTEL_BACKEND_ENDPOINT=tempo:4317
    volumes:
      - ../../deploy/otel-collector/docker/otelcol.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      tempo:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.6.0
    container_name: tempo-e2e-tracing
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../../deploy/otel-collector/docker/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "${TEMPO_PORT:-3201}:3200"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  mcp-server:
    image: ghcr.io/solaceproducts/solace-broker-mcp-dev:dev
    container_name: mcp-server-e2e-tracing
    environment:
      - CONFIG_FILE=/etc/mcp-server/config.yaml
      - MCP_DEV_TOKEN=${MCP_DEV_TOKEN:-e2e-dev-token}
      - BROKER_PASSWORD=${BROKER_PASSWORD:-admin}
      - OBS_TRACING_ENABLED=true
      - OBS_METRICS_OTLP_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
    volumes:
      - ./mcp-config.yaml:/etc/mcp-server/config.yaml:ro
    ports:
      - "${MCP_PORT:-9095}:9090"
    depends_on:
      solace:
        condition: service_healthy
      otel-collector:
        condition: service_started
