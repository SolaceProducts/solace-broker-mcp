version: "2"

# TEMPORARY (debug/lint-sa5011-cache): remove issue caps so CI reports every
# SA5011 hit instead of the default 3-per-text / 50-per-linter truncation.
# Revert before merging back to main.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - errcheck      # unchecked error return values
    - staticcheck   # dead code, nil deref, misuse patterns
    - gosec         # security issues (TLS, credentials, etc.)
    - govet         # vet checks including copylocks
    - revive        # style and correctness
    - bodyclose     # HTTP response bodies must be closed — critical for broker API calls
    - ineffassign   # ineffective assignments (e.g. assigning a value that is never used)
    - noctx         # http.NewRequest must use context variant (http.NewRequestWithContext)

  settings:
    gosec:
      excludes:
        - G706  # log injection via taint analysis — false positive with log/slog typed attrs (auto-escaped). Fix merged in gosec PR #1623, pending next release after v2.25.0. Re-enable when golangci-lint bundles the fix.
    revive:
      rules:
        - name: exported
          disabled: true  # don't require doc comments on all exported symbols yet

  exclusions:
    presets:
      - common-false-positives   # gosec taint-analysis FPs (G103, G204, G304)
      - std-error-handling       # unchecked Close(), Setenv(), etc.
    rules:
      # Test files: relax errcheck and gosec
      - path: ".*_test\\.go"
        linters:
          - errcheck
          - gosec
