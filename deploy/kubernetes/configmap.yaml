# Edit this ConfigMap with your broker URLs and settings.
# Credentials use ${VAR_NAME} references resolved from the Secret at runtime.
apiVersion: v1
kind: ConfigMap
metadata:
  name: solace-broker-mcp
  labels:
    app.kubernetes.io/name: solace-broker-mcp
data:
  config.yaml: |
    port: 9090
    log_level: info

    mcp_client_auth:
      mode: oauth
      issuer: "https://idp.example.com"
      audience: "mcp-server"
      resource_url: "https://mcp.example.com/mcp"

    # TLS for the server's own listener is terminated by the ingress/service in
    # front of this pod (the Service exposes plaintext :9090). Acknowledge that
    # so mode: oauth does not refuse to start; the server logs a startup WARN.
    # To terminate TLS in the pod instead, set tls_cert_file/tls_key_file and
    # remove this line.
    #
    # The pod binds all interfaces (required so the Service/ingress can reach it),
    # so the plaintext port MUST NOT be exposed beyond the cluster — keep the
    # Service ClusterIP and terminate TLS at an Ingress or gateway in front of it.
    tls_terminated_upstream: true

    semp:
      max_concurrent_per_broker: 10
      request_timeout_duration: 1m
      request_min_interval: 100ms
      retries: 10
      retry_min_interval: 3s
      retry_max_interval: 30s

    brokers:
      my-broker:
        url: "https://broker.example.com:943"
        insecure_skip_verify: false
        auth:
          mode: basic
          username: "${BROKER_USERNAME}"
          password: "${BROKER_PASSWORD}"
