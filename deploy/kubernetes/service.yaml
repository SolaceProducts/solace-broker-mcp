apiVersion: v1
kind: Service
metadata:
  name: solace-broker-mcp
  labels:
    app.kubernetes.io/name: solace-broker-mcp
spec:
  type: ClusterIP
  # MCP sessions live in one pod's memory, so a session ID sent to any other
  # pod gets a 404. ClientIP affinity pins each client to its own pod, and is
  # required above one replica. timeoutSeconds must stay above the 2h session
  # idle timeout (defaults.DefaultMCPSessionIdleTimeout).
  #
  # CAVEAT: kube-proxy applies this on the ClusterIP path only. An Ingress,
  # Gateway, or service mesh bypasses it — including the TLS-terminating
  # ingress docs/authentication.md recommends for OAuth. Behind any of those,
  # set stickiness there on the Mcp-Session-Id header instead. Detail:
  # docs/observability.md § Session affinity is required above one replica.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: solace-broker-mcp
