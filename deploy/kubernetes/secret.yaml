# ============================================================
# EXAMPLE ONLY — CHANGE CREDENTIALS BEFORE APPLYING
# ============================================================
# This file ships with placeholder credentials. Running
# `kubectl apply` without replacing them exposes your broker
# with a well-known password. Options:
#   - Edit BROKER_USERNAME / BROKER_PASSWORD / DEV_TOKEN
#     directly here (but do NOT commit the edited file)
#   - Use a secret manager: Vault, Sealed Secrets,
#     External Secrets Operator, or SOPS
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: solace-broker-mcp
  labels:
    app.kubernetes.io/name: solace-broker-mcp
stringData:
  BROKER_USERNAME: admin
  BROKER_PASSWORD: changeme  # CHANGE THIS before applying
  # Shared client token for the ConfigMap's default mcp_client_auth.mode:
  # static. Any caller that can reach the Service and presents this token gets
  # full broker-admin-backed access, so treat it like a password.
  #
  # Deliberately empty: the server refuses to start with a blank dev_token
  # ("mcp_client_auth.dev_token is required"). Shipping a real default here
  # would mean an unedited `kubectl apply` yields a running, cluster-routable
  # MCP server whose only credential is a string published in this repository.
  # Set a strong value. Not used once you switch to mode: oauth.
  DEV_TOKEN: ""  # SET THIS before applying
