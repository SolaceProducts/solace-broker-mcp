apiVersion: apps/v1
kind: Deployment
metadata:
  name: solace-broker-mcp
  labels:
    app.kubernetes.io/name: solace-broker-mcp
spec:
  # Two replicas keep one pod serving through updates and drains, via two
  # separate mechanisms: strategy below covers rollouts (a rollout never
  # consults a PDB), poddisruptionbudget.yaml covers drains.
  #
  # Requires service.yaml's sessionAffinity: ClientIP — read the caveat there
  # before fronting this with an ingress or service mesh.
  replicas: 2
  # Pinned, not inherited: the 25% defaults only happen to give 0/1 at exactly
  # two replicas. maxUnavailable: 0 brings the replacement to Ready before the
  # old pod retires, so a rollout that cannot place a third pod stalls rather
  # than dropping capacity.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: solace-broker-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solace-broker-mcp
    spec:
      # Without this both replicas can land on one node, where node failure —
      # involuntary, so the PDB does not help — is still a full outage.
      # ScheduleAnyway keeps single-node dev clusters schedulable; swap
      # topologyKey for topology.kubernetes.io/zone to spread across AZs.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: solace-broker-mcp
      # Graceful-shutdown budget (SOL-151288, SOL-152449). On SIGTERM the server
      # flips /readyz to 503, sleeps obs.shutdown_drain_delay_s (default 10s) so
      # K8s deregisters the pod, gracefully drains in-flight requests for up to
      # DefaultShutdownTimeoutSeconds (30s), then flushes any registered
      # shutdown hooks (OTel providers) for up to DefaultShutdownHookTimeoutSeconds
      # (3s). This drain runs IN-PROCESS: the distroless image has no shell, so
      # there is NO preStop hook. The grace period must cover all three phases
      # plus a small buffer, or K8s SIGKILLs mid-drain and causes the 502s this
      # design prevents:
      #   terminationGracePeriodSeconds = shutdown_drain_delay_s (10)
      #                                 + DefaultShutdownTimeoutSeconds (30)
      #                                 + DefaultShutdownHookTimeoutSeconds (3)
      #                                 + 2s buffer = 45
      # If you raise obs.shutdown_drain_delay_s, raise this value to match.
      #
      # The readinessProbe below targets /readyz, so on SIGTERM the server's
      # SetShuttingDown flip makes the pod report not-ready and kube-proxy
      # deregisters it from Service endpoints within one readiness period. The
      # drain window above is sized to cover exactly that: orchestrator
      # deregistration finishes before in-flight requests are drained.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532  # distroless nonroot UID (gcr.io/distroless/static-debian12:nonroot)
      containers:
        - name: solace-broker-mcp
          image: ghcr.io/solaceproducts/solace-broker-mcp:latest
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          env:
            - name: CONFIG_FILE
              value: /etc/mcp-server/config.yaml
          envFrom:
            - secretRef:
                name: solace-broker-mcp
          volumeMounts:
            - name: config
              mountPath: /etc/mcp-server/config.yaml
              subPath: config.yaml
              readOnly: true
          # startupProbe gates liveness/readiness until the MCP server has
          # finished cold-start init. /readyz reflects the server's OWN
          # readiness (it makes no broker calls), so it flips ready as soon as
          # init completes — there is no unbounded waiting on broker
          # reachability. failureThreshold 30 x periodSeconds 2s allows ~60s
          # for a normal cold start before Kubernetes treats startup as failed.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          # /livez is the canonical liveness endpoint and governs restarts.
          # No initialDelaySeconds: startupProbe above gates liveness until
          # cold-start init completes, so an initial delay here is never observed.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # /readyz reflects MCP-server readiness only (decoupled from broker
          # reachability); a not-ready pod is pulled from Service endpoints but
          # not restarted.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Memory is capped, CPU deliberately is not (SOL-152089).
          #
          # No limits.cpu: CFS throttling stalls the process at burst, which is
          # this workload's normal shape (a tool call fans out to SEMP), and
          # requests.cpu already guarantees the share under contention.
          #
          # limits.memory is set because memory is incompressible — a leak
          # takes the node down rather than just running slower. OOM eviction
          # is Kubernetes' job; /readyz reports init state, not memory
          # pressure, so nothing in-process watches the heap. 512Mi covers the
          # session map plus buffered SEMP responses under concurrent calls.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: solace-broker-mcp
