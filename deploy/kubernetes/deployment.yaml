apiVersion: apps/v1
kind: Deployment
metadata:
  name: solace-broker-mcp
  labels:
    app.kubernetes.io/name: solace-broker-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: solace-broker-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solace-broker-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: solace-broker-mcp
          image: ghcr.io/solacedev/solace-broker-mcp:latest
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          env:
            - name: CONFIG_FILE
              value: /etc/mcp-server/config.yaml
          envFrom:
            - secretRef:
                name: solace-broker-mcp
          volumeMounts:
            - name: config
              mountPath: /etc/mcp-server/config.yaml
              subPath: config.yaml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: solace-broker-mcp
