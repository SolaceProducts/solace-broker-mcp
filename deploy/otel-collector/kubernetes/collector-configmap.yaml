apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512

    exporters:
      # Default backend: Grafana Tempo.
      # For K8s: update this to your Tempo service address, e.g. tempo.monitoring:4317.
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true

      # Alternative: Jaeger (OTLP-native since Jaeger 1.35+).
      # otlp/jaeger:
      #   endpoint: jaeger:4317
      #   tls:
      #     insecure: true

      # Alternative: Datadog. Set DD_API_KEY in the Deployment env.
      # datadog:
      #   api:
      #     key: ${env:DD_API_KEY}
      #     site: datadoghq.com

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/tempo]
