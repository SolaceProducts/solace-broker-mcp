apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512

    exporters:
      # Default backend: Grafana Tempo.
      # For K8s: update this to your Tempo service address, e.g. tempo.monitoring:4317.
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true

      # Alternative: Jaeger (OTLP-native since Jaeger 1.35+).
      # otlp/jaeger:
      #   endpoint: jaeger:4317
      #   tls:
      #     insecure: true

      # Alternative: Datadog. Inject DD_API_KEY into the Deployment from a
      # Secret (see collector-deployment.yaml) — never a literal value here.
      # datadog:
      #   api:
      #     key: ${env:DD_API_KEY}
      #     site: datadoghq.com

      # Alternative: Prometheus with its native OTLP receiver
      # (--web.enable-otlp-receiver) — requires OTLP/HTTP, not gRPC, so this
      # is a separate exporter from otlp/tempo above, not a swap of it.
      # Update the endpoint to your Prometheus service, e.g.
      # http://prometheus.monitoring:9090/api/v1/otlp (the base path; this
      # exporter appends /v1/metrics itself).
      # otlphttp/prometheus:
      #   endpoint: http://prometheus.monitoring:9090/api/v1/otlp
      #   tls:
      #     insecure: true

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/tempo]
        # Metrics pipeline — Tempo and Jaeger are traces-only backends. Enable
        # this only when using a metrics-capable backend: swap in the datadog
        # exporter above for Datadog, or the otlphttp/prometheus exporter
        # above for Prometheus with --web.enable-otlp-receiver. otlp/tempo
        # (gRPC, pointed at Tempo/Jaeger) is NOT a valid metrics exporter for
        # either — do not just uncomment this pipeline as-is.
        # metrics:
        #   receivers: [otlp]
        #   processors: [batch]
        #   exporters: [otlphttp/prometheus]
