receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # OTEL_BACKEND_ENDPOINT is set by docker-compose.yaml; default is tempo:4317.
  # For Jaeger: COMPOSE_PROFILES=jaeger OTEL_BACKEND_ENDPOINT=jaeger:4317 docker compose up
  otlp/backend:
    endpoint: ${env:OTEL_BACKEND_ENDPOINT}
    tls:
      insecure: true

  # Datadog — uncomment and set DD_API_KEY in the environment.
  # datadog:
  #   api:
  #     key: ${env:DD_API_KEY}
  #     site: datadoghq.com

  # Prometheus with its native OTLP receiver (--web.enable-otlp-receiver) —
  # requires OTLP/HTTP, not gRPC, so this is a separate exporter from
  # otlp/backend above, not a swap of it. Uncomment alongside the metrics
  # pipeline below and set PROMETHEUS_OTLP_ENDPOINT, e.g.
  # http://prometheus:9090/api/v1/otlp (the base path; this exporter appends
  # /v1/metrics itself).
  # otlphttp/prometheus:
  #   endpoint: ${env:PROMETHEUS_OTLP_ENDPOINT}
  #   tls:
  #     insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/backend]
    # Metrics pipeline — Tempo and Jaeger are traces-only backends. Enable this
    # only when using a metrics-capable backend: swap in the datadog exporter
    # above for Datadog, or the otlphttp/prometheus exporter above for
    # Prometheus with --web.enable-otlp-receiver. otlp/backend (gRPC, pointed
    # at Tempo/Jaeger) is NOT a valid metrics exporter for either — do not
    # just uncomment this pipeline as-is.
    # metrics:
    #   receivers: [otlp]
    #   processors: [batch]
    #   exporters: [otlphttp/prometheus]
