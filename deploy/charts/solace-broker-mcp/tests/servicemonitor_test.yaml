suite: servicemonitor
templates:
  - servicemonitor.yaml
values:
  - ../ci/default-values.yaml
release:
  name: rel
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when explicitly disabled
    set:
      observability.serviceMonitor.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ServiceMonitor scraping the metrics port
    set:
      observability.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
      - isAPIVersion:
          of: monitoring.coreos.com/v1
      - equal:
          path: spec.endpoints
          value:
            - port: metrics
              path: /metrics
              interval: 15s
              scrapeTimeout: 10s

  - it: selects on name + instance only
    set:
      observability.serviceMonitor.enabled: true
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: solace-broker-mcp
            app.kubernetes.io/instance: rel

  - it: adds additionalLabels for the Prometheus selector
    set:
      observability.serviceMonitor.enabled: true
      observability.serviceMonitor.additionalLabels:
        release: kube-prometheus-stack
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            release: kube-prometheus-stack
            app.kubernetes.io/name: solace-broker-mcp
            app.kubernetes.io/instance: rel
