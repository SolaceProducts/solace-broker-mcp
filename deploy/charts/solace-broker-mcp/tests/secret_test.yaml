suite: secret
templates:
  - secret.yaml
values:
  - ../ci/default-values.yaml
release:
  name: rel
tests:
  - it: holds chart-managed credentials under their env var names
    asserts:
      - equal:
          path: metadata.name
          value: rel-solace-broker-mcp
      - equal:
          path: stringData
          value:
            MY_BROKER_USERNAME: admin
            MY_BROKER_PASSWORD: ci-only-placeholder
            DEV_TOKEN: ci-only-placeholder

  - it: renders distinct prefixed names for two brokers; envPrefix BROKER reproduces the raw manifest
    set:
      brokers:
        my-broker:
          envPrefix: BROKER
        other-broker:
          url: https://other:943
          auth: {mode: bearer, token: tok}
    asserts:
      - equal:
          path: stringData
          value:
            BROKER_USERNAME: admin
            BROKER_PASSWORD: ci-only-placeholder
            OTHER_BROKER_TOKEN: tok
            DEV_TOKEN: ci-only-placeholder

  - it: leaves an existing-Secret broker's credentials out
    set:
      brokers.my-broker.auth.existingSecret: semp-creds
    asserts:
      - equal:
          path: stringData
          value:
            DEV_TOKEN: ci-only-placeholder

  - it: renders no Secret when every credential is external
    set:
      brokers.my-broker.auth.existingSecret: semp-creds
      mcpClientAuth.existingSecret: dev-tok
    asserts:
      - hasDocuments:
          count: 0
