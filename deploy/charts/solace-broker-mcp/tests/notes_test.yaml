suite: NOTES.txt warnings
templates:
  - NOTES.txt
values:
  - ../ci/default-values.yaml
tests:
  # The server warns at startup only for OTLP metrics with no endpoint
  # (warnIfOTLPEndpointUnset); for tracing these notes are the only signal.
  - it: warns about tracing with no OTLP endpoint
    set:
      observability.tracing.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: observability.tracing.enabled is true but observability.otlpEndpoint is\\s+empty"

  - it: does not warn about tracing when the endpoint is set
    set:
      observability.tracing.enabled: true
      observability.otlpEndpoint: http://c:4317
    asserts:
      - notMatchRegexRaw:
          pattern: "tracing.enabled is true but"

  - it: does not warn about tracing when extraEnv supplies a traces endpoint
    set:
      observability.tracing.enabled: true
      extraEnv:
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://c:4317
    asserts:
      - notMatchRegexRaw:
          pattern: "tracing.enabled is true but"

  - it: does not warn by default
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING"

  - it: warns that an Ingress publishes the shared dev token
    set:
      ingress.enabled: true
      ingress.host: mcp.example.com
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: ingress.enabled publishes the server under mcp_client_auth.mode static"

  - it: points a static Ingress at the chart's oauth mode
    set:
      ingress.enabled: true
      ingress.host: mcp.example.com
    asserts:
      - matchRegexRaw:
          pattern: "Switch to mcpClientAuth.mode oauth"
      - notMatchRegexRaw:
          pattern: "not yet available"

  - it: does not warn about the dev token under oauth
    values:
      - ../ci/oauth-values.yaml
    asserts:
      - notMatchRegexRaw:
          pattern: "dev token|DEV_TOKEN|publishes the server under"
      - matchRegexRaw:
          pattern: "token from your identity provider"

  - it: warns about an Ingress with no TLS secret
    set:
      ingress.enabled: true
      ingress.host: mcp.example.com
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: ingress.tls.secretName is empty"

  - it: does not warn about TLS when a TLS secret is set
    set:
      ingress.enabled: true
      ingress.host: mcp.example.com
      ingress.tls.secretName: mcp-tls
    asserts:
      - notMatchRegexRaw:
          pattern: "ingress.tls.secretName is empty"

  - it: warns that a ServiceMonitor opens /metrics without a NetworkPolicy
    set:
      observability.serviceMonitor.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: /metrics is unauthenticated and networkPolicy.enabled is false"

  - it: warns that scraping opens /metrics without a NetworkPolicy
    set:
      observability.metrics.scrape.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: /metrics is unauthenticated and networkPolicy.enabled is false"

  - it: does not warn about /metrics with a NetworkPolicy
    set:
      observability.metrics.scrape.enabled: true
      networkPolicy.enabled: true
    asserts:
      - notMatchRegexRaw:
          pattern: "/metrics is unauthenticated"

  - it: probes over https with in-pod TLS
    set:
      tls.existingSecret: mcp-server-tls
    asserts:
      - matchRegexRaw:
          pattern: "curl -sk https://127\\.0\\.0\\.1:9090/readyz"
      - matchRegexRaw:
          pattern: "MCP clients connect to https://<service>:9090/mcp"
      - notMatchRegexRaw:
          pattern: "in cleartext"

  - it: probes over http without in-pod TLS
    asserts:
      - matchRegexRaw:
          pattern: "curl -s http://127\\.0\\.0\\.1:9090/readyz"

  - it: says the Service port serves TLS under oauth with in-pod TLS
    values:
      - ../ci/oauth-values.yaml
    set:
      tls.existingSecret: mcp-server-tls
      tlsTerminatedUpstream: null
      ingress.annotations: {nginx.ingress.kubernetes.io/backend-protocol: HTTPS}
    asserts:
      - matchRegexRaw:
          pattern: "The Service port serves TLS from tls.existingSecret"
      - notMatchRegexRaw:
          pattern: "serves plaintext"

  - it: warns that an Ingress must speak HTTPS to an in-pod TLS backend
    set:
      tls.existingSecret: mcp-server-tls
      ingress.enabled: true
      ingress.host: mcp.example.com
      ingress.tls.secretName: mcp-example-tls
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: tls.existingSecret serves HTTPS in the pod"

  - it: does not warn about the backend protocol once the annotation is set
    set:
      tls.existingSecret: mcp-server-tls
      ingress.enabled: true
      ingress.host: mcp.example.com
      ingress.tls.secretName: mcp-example-tls
      ingress.annotations: {nginx.ingress.kubernetes.io/backend-protocol: HTTPS}
    asserts:
      - notMatchRegexRaw:
          pattern: "tls.existingSecret serves HTTPS in the pod"

  # A base values file may carry backend-protocol: HTTP; the key alone says
  # nothing about whether the controller speaks HTTPS to the pod.
  - it: warns when the backend-protocol annotation is not HTTPS
    set:
      tls.existingSecret: mcp-server-tls
      ingress.enabled: true
      ingress.host: mcp.example.com
      ingress.tls.secretName: mcp-example-tls
      ingress.annotations: {nginx.ingress.kubernetes.io/backend-protocol: HTTP}
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: tls.existingSecret serves HTTPS in the pod"

  - it: accepts HTTPS in any letter case, with surrounding spaces
    set:
      tls.existingSecret: mcp-server-tls
      ingress.enabled: true
      ingress.host: mcp.example.com
      ingress.tls.secretName: mcp-example-tls
      ingress.annotations: {nginx.ingress.kubernetes.io/backend-protocol: " https "}
    asserts:
      - notMatchRegexRaw:
          pattern: "tls.existingSecret serves HTTPS in the pod"
