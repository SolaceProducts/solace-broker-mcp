suite: poddisruptionbudget
templates:
  - poddisruptionbudget.yaml
values:
  - ../ci/default-values.yaml
release:
  name: rel
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: evicts one pod at a time, selecting on name + instance only
    set:
      podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - isAPIVersion:
          of: policy/v1
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: solace-broker-mcp
            app.kubernetes.io/instance: rel
