{{- /*
Chart-managed credentials, keyed by the env var name the config references and
loaded whole with envFrom (the shape of deploy/kubernetes/secret.yaml).
Rendered only when at least one credential is chart-managed; credentials from
an existingSecret are injected with secretKeyRef instead (deployment.yaml).
*/}}
{{- if include "solace-broker-mcp.hasManagedSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "solace-broker-mcp.fullname" . | quote }}
  labels:
    {{- include "solace-broker-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range (include "solace-broker-mcp.credentials" . | fromJsonArray) }}
  {{- if not .existingSecret }}
  {{ .name }}: {{ .value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
