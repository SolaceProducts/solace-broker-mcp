# Tool Description Guidelines (for tool implementers — Stories 8-12)
#
# Tool descriptions are the primary mechanism by which LLMs select which tool
# to call. A poor description leads to wrong tool selection, unnecessary tool
# calls, or missed capabilities.
#
# - First sentence: State what the tool returns in plain language
#   (e.g., "Returns CPU, memory, disk, and spool utilization for the broker")
# - When to use: Briefly describe the use case or scenario
#   (e.g., "Use this tool to assess overall broker health during incident triage")
# - Key parameters: Mention required parameters and what they identify
#   (e.g., "Requires vpnName to identify the target Message VPN")
# - What it does NOT do: Clarify scope if confusion with another tool is likely
#   (e.g., "For per-queue metrics, use get-queue-metrics instead")
# - Keep it concise: Aim for 2-4 sentences
# - Avoid jargon where possible: Prefer "message backlog" over "spool utilization"
# - Pagination limits: For list tools with maxResults, state the default and cap
#   in the description (e.g., "Returns up to 100 by default (max 500 via maxResults)").
#   These values are defined as constants in executor.go (defaultMax, capMax) —
#   keep descriptions in sync if those constants change.

tools:
  - name: get-rdp-status
    description: >
      Get the operational status of a REST Delivery Point including its
      enabled state, up/down status, client name, client profile, last
      failure reason, queue bindings, and REST consumer status.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN containing the RDP"
      - name: restDeliveryPointName
        type: string
        required: true
        description: "The name of the REST Delivery Point"
    steps:
      - id: rdpStatus
        operation: monitor/getMsgVpnRestDeliveryPoint
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          restDeliveryPointName: "{{.Params.restDeliveryPointName}}"
          select: "clientName, clientProfileName, enabled, lastFailureReason, lastFailureTime, msgVpnName, restDeliveryPointName, timeConnectionsBlocked, up"
      - id: queueBindings
        operation: monitor/getMsgVpnRestDeliveryPointQueueBindings
        parallel: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          restDeliveryPointName: "{{.Params.restDeliveryPointName}}"
          select: "lastFailureReason, lastFailureTime, postRequestTarget, queueBindingName, restDeliveryPointName, up, uptime"
      - id: restConsumers
        operation: monitor/getMsgVpnRestDeliveryPointRestConsumers
        parallel: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          restDeliveryPointName: "{{.Params.restDeliveryPointName}}"
          select: "authenticationScheme, enabled, httpRequestOutstandingTxMsgCount, httpRequestTimedOutTxMsgCount, httpRequestTxMsgCount, httpResponseErrorRxMsgCount, httpResponseSuccessRxMsgCount, lastConnectionFailureReason, lastConnectionFailureTime, lastFailureReason, lastFailureTime, outgoingConnectionCount, remoteHost, remotePort, restConsumerName, restDeliveryPointName, up"
    result:
      strategy: collect

  - name: get-queue-metrics
    description: >
      Get detailed metrics for a queue: spooledMsgCount, txUnackedMsgCount,
      bindCount, rxMsgRate, txMsgRate, redelivery counts, congestion state, and
      spool usage. Use this to diagnose queue backlogs. Primary signal for
      detecting a slow guaranteed-message consumer: spooledMsgCount growing AND
      bindCount > 0 AND rxMsgRate > txMsgRate AND txUnackedMsgCount near the
      per-flow unacked limit. The per-client slowSubscriber field does not flip
      for slow ACKs, so this tool — not get-client-details — is the right
      starting point.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN containing the queue"
      - name: queueName
        type: string
        required: true
        description: "The name of the queue"
    steps:
      - id: queueMetrics
        operation: monitor/getMsgVpnQueue
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          queueName: "{{.Params.queueName}}"
          select: "accessType, averageRxMsgRate, averageTxMsgRate, bindCount, durable, egressEnabled, ingressEnabled, lowPriorityMsgCongestionState, maxBindCount, maxDeliveredUnackedMsgsPerFlow, maxMsgSize, maxMsgSpoolUsage, maxMsgSpoolUsageExceededDiscardedMsgCount, maxRedeliveryCount, maxRedeliveryExceededDiscardedMsgCount, maxTtl, maxTtlExceededDiscardedMsgCount, msgSpoolUsage, msgVpnName, noLocalDeliveryDiscardedMsgCount, owner, queueName, redeliveredMsgCount, rxByteRate, rxMsgRate, spooledMsgCount, txByteRate, txMsgRate, txUnackedMsgCount"
    result:
      strategy: collect

  - name: get-client-details
    description: >
      Get per-client performance metrics including the slowSubscriber field.
      slowSubscriber=true means the broker's TCP egress to the client has been
      blocked for several seconds in the last minute (TCP window closed);
      primarily catches slow direct-messaging clients. slowSubscriber=false does
      not rule out slow consumers — for slow guaranteed-message consumers (slow
      to ACK), use get-queue-metrics: a queue with growing spooledMsgCount, high
      txUnackedMsgCount, and rxMsgRate > txMsgRate while bindCount > 0 indicates
      consumer-side slowness.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN the client is connected to"
      - name: clientName
        type: string
        required: true
        description: "The name of the client connection"
    steps:
      - id: clientDetails
        operation: monitor/getMsgVpnClient
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          clientName: "{{.Params.clientName}}"
          select: "averageRxMsgRate, averageTxMsgRate, clientAddress, clientName, clientUsername, elidingTopicCount, keepalive, msgVpnName, platform, rxByteRate, rxDiscardedMsgCount, rxFlowCount, rxMsgCount, rxMsgRate, slowSubscriber, softwareVersion, subscriptionCount, txByteRate, txDiscardedMsgCount, txFlowCount, txMsgCount, txMsgRate, uptime"
    result:
      strategy: collect

  - name: list-client-subscriptions
    description: >
      List topic subscriptions for a specific client. Returns up to 100
      by default (max 500 via maxResults). Use this to understand what topics
      a client is subscribed to and diagnose subscription patterns.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN the client is connected to"
      - name: clientName
        type: string
        required: true
        description: "The name of the client connection"
      - name: maxResults
        type: integer
        required: false
        description: "Maximum number of subscriptions to return (default 100, max 500)"
    steps:
      - id: subscriptions
        operation: monitor/getMsgVpnClientSubscriptions
        followPages: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          clientName: "{{.Params.clientName}}"
          count: "100"
    result:
      strategy: collect

  - name: get-vpn-health
    description: >
      Get health and connection statistics for a Message VPN. Returns enabled
      state, active connection count, total subscription count, and service
      states for SMF, REST, and MQTT protocols. Use this to assess whether a
      VPN is operational and identify service-level problems.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The name of the Message VPN"
    steps:
      - id: vpnHealth
        operation: monitor/getMsgVpn
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          select: "discardedRxMsgCount, discardedTxMsgCount, enabled, maxConnectionCount, msgSpoolMsgCount, msgSpoolUsage, msgVpnConnections, msgVpnConnectionsServiceMqtt, msgVpnConnectionsServiceRestIncoming, msgVpnConnectionsServiceRestOutgoing, msgVpnConnectionsServiceSmf, msgVpnConnectionsServiceWeb, msgVpnName, msgVpnTotalUniqueSubscriptions, serviceAmqpPlainTextFailureReason, serviceAmqpPlainTextUp, serviceMqttPlainTextFailureReason, serviceMqttPlainTextUp, serviceMqttTlsFailureReason, serviceMqttTlsUp, serviceRestIncomingPlainTextFailureReason, serviceRestIncomingPlainTextUp, serviceRestIncomingTlsFailureReason, serviceRestIncomingTlsUp, serviceSmfPlainTextFailureReason, serviceSmfPlainTextUp, serviceSmfTlsFailureReason, serviceSmfTlsUp, state"
    result:
      strategy: collect

  - name: list-vpns
    description: >
      List Message VPNs on the broker with their enabled state, connection
      count, and basic health status. Returns up to 100 by default (max 500
      via maxResults). Use this to discover which VPNs exist and identify any
      that are down or have no active connections.
    annotations:
      readOnly: true
    parameters:
      - name: maxResults
        type: integer
        required: false
        description: "Maximum number of VPNs to return (default 100, max 500)"
    steps:
      - id: vpns
        operation: monitor/getMsgVpns
        followPages: true
        args:
          count: "100"
          select: "discardedRxMsgCount, discardedTxMsgCount, dmrEnabled, enabled, msgSpoolMsgCount, msgSpoolUsage, msgVpnConnections, msgVpnConnectionsServiceMqtt, msgVpnConnectionsServiceRestIncoming, msgVpnConnectionsServiceSmf, msgVpnConnectionsServiceWeb, msgVpnName, msgVpnTotalUniqueSubscriptions, replicationEnabled, serviceMqttPlainTextFailureReason, serviceMqttPlainTextUp, serviceRestIncomingPlainTextFailureReason, serviceRestIncomingPlainTextUp, serviceSmfPlainTextFailureReason, serviceSmfPlainTextUp, state"
    result:
      strategy: collect

  - name: list-queues
    description: >
      List queues in a VPN with depth (spooledMsgCount), unacked count
      (txUnackedMsgCount), bindCount, congestion state, and rates. Returns up to
      100 by default (max 500 via maxResults). Primary VPN-wide scan for slow
      guaranteed-message consumers: queues with spooledMsgCount growing,
      txUnackedMsgCount high, rxMsgRate > txMsgRate, and bindCount > 0 indicate
      consumer-side slowness even when slowSubscriber is false on the bound
      client.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN to list queues for"
      - name: maxResults
        type: integer
        required: false
        description: "Maximum number of queues to return (default 100, max 500)"
    steps:
      - id: queues
        operation: monitor/getMsgVpnQueues
        followPages: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          count: "100"
          select: "accessType, bindCount, egressEnabled, ingressEnabled, lowPriorityMsgCongestionState, maxMsgSpoolUsage, msgSpoolUsage, msgVpnName, queueName, rxMsgRate, spooledMsgCount, txMsgRate, txUnackedMsgCount"
    result:
      strategy: collect

  - name: list-clients
    description: >
      List active clients in a VPN with rates, uptime, and the slowSubscriber
      field. Returns up to 100 by default (max 500 via maxResults).
      slowSubscriber=true flags TCP-egress stalls (mainly relevant to direct
      messaging) — it does not flip for slow guaranteed-message consumers. To
      scan a VPN for slow guaranteed consumers, use list-queues and look for
      queues with growing spooledMsgCount, high txUnackedMsgCount, and rxMsgRate
      > txMsgRate while bindCount > 0.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN to list clients for"
      - name: maxResults
        type: integer
        required: false
        description: "Maximum number of clients to return (default 100, max 500)"
    steps:
      - id: clients
        operation: monitor/getMsgVpnClients
        followPages: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          count: "100"
          select: "clientAddress, clientName, clientUsername, msgVpnName, platform, rxMsgRate, slowSubscriber, txMsgRate, uptime"
    result:
      strategy: collect

  - name: get-message-rates
    description: >
      Get current and average message and byte throughput rates for a Message
      VPN. Use this to assess traffic volume and identify high-traffic VPNs.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The name of the Message VPN"
    steps:
      - id: rates
        operation: monitor/getMsgVpn
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          select: "averageRxByteRate, averageRxMsgRate, averageTxByteRate, averageTxMsgRate, msgVpnName, rxByteRate, rxMsgRate, txByteRate, txMsgRate"
    result:
      strategy: collect

  - name: list-rdps
    description: >
      List all REST Delivery Points in a Message VPN with their enabled state,
      up/down status, and last failure reason. Use this to discover which RDPs
      exist and identify any that are down. For detailed RDP status including
      consumers and queue bindings, use get-rdp-status.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN to list REST Delivery Points for"
      - name: maxResults
        type: integer
        required: false
        description: "Maximum number of RDPs to return (default 100, max 500)"
    steps:
      - id: rdps
        operation: monitor/getMsgVpnRestDeliveryPoints
        followPages: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          count: "100"
          select: "clientName, enabled, lastFailureReason, lastFailureTime, msgVpnName, restDeliveryPointName, up"
    result:
      strategy: collect

  - name: get-replication-status
    description: >
      Get replication state for a Message VPN including role, sync eligibility,
      bridge status, transaction mode, and queued message counts. Use this to
      diagnose replication sync issues. Note: SEMP does not expose current
      lagSeconds; replicationActiveTransitionToSyncIneligibleCount is the most
      useful "has replication been flaky recently?" signal.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The name of the Message VPN"
    steps:
      - id: replication
        operation: monitor/getMsgVpn
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          select: "msgVpnName, replicationAckPropagationIntervalMsgCount, replicationActiveAsyncQueuedMsgCount, replicationActiveSyncEligiblePeakTime, replicationActiveSyncIneligiblePeakTime, replicationActiveSyncQueuedAsAsyncMsgCount, replicationActiveSyncQueuedMsgCount, replicationActiveTransitionToSyncIneligibleCount, replicationBridgeBoundToQueue, replicationBridgeUp, replicationEnabled, replicationQueueBound, replicationQueueMaxMsgSpoolUsage, replicationRejectMsgWhenSyncIneligibleEnabled, replicationRemoteBridgeUp, replicationRole, replicationSyncEligible, replicationTransactionMode"
    result:
      strategy: collect

  - name: list-slow-subscribers
    description: >
      Lists clients in a Message VPN flagged with the broker's slowSubscriber
      flag. Narrow signal: fires when the broker has data to send but the
      client's TCP receive window has been closed for several seconds in the
      last minute — primarily catches direct-messaging or replication-bridge
      backpressure. Does NOT flip for slow guaranteed-message consumers (slow
      to ACK), because the broker self-throttles via the transmit window
      before TCP egress can stall. To find slow guaranteed consumers, use
      list-queues / get-queue-metrics. Server-side filtered via SEMP where
      clause — only matching clients are returned.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN to search for slow subscribers"
      - name: maxResults
        type: integer
        required: false
        description: "Maximum number of slow subscribers to return (default 100, max 500)"
    steps:
      - id: slowSubscribers
        operation: monitor/getMsgVpnClients
        followPages: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          count: "100"
          where: "slowSubscriber==true"
          select: "clientAddress, clientName, clientUsername, msgVpnName, platform, rxMsgRate, slowSubscriber, txDiscardedMsgCount, txMsgRate, uptime"
    result:
      strategy: collect

  - name: list-queue-discards
    description: >
      List per-queue message discard counts for a Message VPN. Returns each
      queue with its TTL-expired, max-redelivery-exceeded, spool-quota-exceeded,
      and other discard category counters. Use this to diagnose why messages
      are being dropped across queues. Aggregation across queues (sum totals)
      is left to the caller — broker does not provide pre-aggregated discards.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN to summarize discards for"
      - name: maxResults
        type: integer
        required: false
        description: "Maximum number of queues to return (default 100, max 500)"
    steps:
      - id: queueDiscards
        operation: monitor/getMsgVpnQueues
        followPages: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          count: "100"
          select: "clientProfileDeniedDiscardedMsgCount, destinationGroupErrorDiscardedMsgCount, disabledDiscardedMsgCount, lowPriorityMsgCongestionDiscardedMsgCount, maxMsgSizeExceededDiscardedMsgCount, maxMsgSpoolUsageExceededDiscardedMsgCount, maxRedeliveryExceededDiscardedMsgCount, maxRedeliveryExceededToDmqMsgCount, maxTtlExceededDiscardedMsgCount, maxTtlExpiredDiscardedMsgCount, maxTtlExpiredToDmqMsgCount, msgVpnName, noLocalDeliveryDiscardedMsgCount, queueName, xaTransactionNotSupportedDiscardedMsgCount"
    result:
      strategy: collect
