      strategy: collect

  - name: create-rdp
    description: >
      BEFORE INVOKING THIS TOOL, obtain explicit user confirmation, restating the
      target (broker, VPN, RDP name) and that a new RDP will be created. The
      confirmation MUST come as a separate user reply received AFTER you state the
      target and effect — do not treat the user's original request as a
      pre-confirmation, even if it implies intent.
      Create a REST Delivery Point (RDP) in a Message VPN. Requires msgVpnName to
      identify the VPN and restDeliveryPointName to name the new RDP; any attribute
      omitted from rdpConfig is set to its broker default. Creates only the RDP
      itself — REST consumers and queue bindings are separate resources not managed
      by this tool, so a new RDP is created disabled by default and delivers nothing
      until those are added. Fails if an RDP with the same name already exists.
    annotations:
      readOnly: false
      destructive: false
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN to create the RDP in"
      - name: restDeliveryPointName
        type: string
        required: true
        description: "The name of the REST Delivery Point to create"
      - name: rdpConfig
        type: object
        required: false
        description: "Optional RestDeliveryPoint attributes (enabled, clientProfileName, service, vendor). Omitted attributes use broker defaults. Do not include msgVpnName or restDeliveryPointName here."
    steps:
      - id: createRdp
        operation: config/createMsgVpnRestDeliveryPoint
        # Only msgVpnName is a path param of POST .../restDeliveryPoints.
        # restDeliveryPointName is deliberately omitted from args so
        # constructRequestBody spreads it into the request body, where SEMP
        # expects it for create.
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
    result:
      strategy: collect

  - name: update-rdp
    description: >
      BEFORE INVOKING THIS TOOL, obtain explicit user confirmation, restating the
      target (broker, VPN, RDP name) and the attributes that will change. The
      confirmation MUST come as a separate user reply received AFTER you state the
      target and effect — do not treat the user's original request as a
      pre-confirmation, even if it implies intent.
      Update an existing REST Delivery Point. Requires msgVpnName and
      restDeliveryPointName to identify the RDP; provide only the attributes you
      want to change in rdpConfig. Omitted attributes are left unchanged. Use this
      to update RDP settings such as enabled state or client profile — commonly to
      enable an RDP that was created disabled.
    annotations:
      readOnly: false
      destructive: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN containing the RDP"
      - name: restDeliveryPointName
        type: string
        required: true
        description: "The name of the REST Delivery Point to modify"
      - name: rdpConfig
        type: object
        required: true
        description: "RestDeliveryPoint attributes to update (enabled, clientProfileName, service, vendor). Only provided attributes are changed. Do not include msgVpnName or restDeliveryPointName here."
    steps:
      - id: updateRdp
        operation: config/updateMsgVpnRestDeliveryPoint
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          restDeliveryPointName: "{{.Params.restDeliveryPointName}}"
    result:
      strategy: collect

  - name: delete-rdp
    description: >
      BEFORE INVOKING THIS TOOL, obtain explicit user confirmation, restating the
      target (broker, VPN, RDP name) and that the RDP and its REST consumers and
      queue bindings will be permanently removed. The confirmation MUST come as a
      separate user reply received AFTER you state the target and effect — do not
      treat the user's original request as a pre-confirmation, even if it implies
      intent.
      Delete a REST Delivery Point from a Message VPN. Requires msgVpnName and
      restDeliveryPointName to identify the RDP to delete. This is a destructive
      operation that permanently removes the RDP along with its REST consumers and
      queue bindings.
    annotations:
      readOnly: false
      destructive: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN containing the RDP"
      - name: restDeliveryPointName
        type: string
        required: true
        description: "The name of the REST Delivery Point to delete"
    steps:
      - id: deleteRdp
        operation: config/deleteMsgVpnRestDeliveryPoint
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          restDeliveryPointName: "{{.Params.restDeliveryPointName}}"
    result:
      strategy: collect

  - name: disconnect-client
    description: >
      Forcibly disconnect a connected client. This is service-impacting and
      irreversible for the active session — it terminates the connection and
      the client must reconnect to resume. BEFORE INVOKING THIS TOOL, obtain
      explicit user confirmation, restating the target (broker, VPN, client
      name) and the service interruption. The confirmation MUST come as a
      separate user reply received AFTER you state the target and effect — do
      not treat the user's original request as a pre-confirmation, even if it
      implies intent. Common use: disconnect a slow subscriber identified via
      list-slow-subscribers or get-client-details.
    annotations:
      readOnly: false
      destructive: true
      idempotent: false
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN the client is connected to."
      - name: clientName
        type: string
        required: true
        description: "The name of the client connection to act on."
    steps:
      - id: disconnect
        operation: action/doMsgVpnClientDisconnect
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          clientName: "{{.Params.clientName}}"
    result:
      strategy: collect

  - name: clear-client-stats
    description: >
      Reset the per-connection statistics counters for a client.
      Non-destructive: this resets monitoring counters only and does not
      disconnect the client or affect message delivery.
    annotations:
      readOnly: false
      destructive: false
      idempotent: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN the client is connected to."
      - name: clientName
        type: string
        required: true
        description: "The name of the client connection to act on."
    steps:
      - id: clearStats
        operation: action/doMsgVpnClientClearStats
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          clientName: "{{.Params.clientName}}"
    result:
      strategy: collect
