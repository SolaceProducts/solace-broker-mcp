# Tool Description Guidelines (for tool implementers — Stories 8-12)
#
# Tool descriptions are the primary mechanism by which LLMs select which tool
# to call. A poor description leads to wrong tool selection, unnecessary tool
# calls, or missed capabilities.
#
# - First sentence: State what the tool returns in plain language
#   (e.g., "Returns CPU, memory, disk, and spool utilization for the broker")
# - When to use: Briefly describe the use case or scenario
#   (e.g., "Use this tool to check broker status and resource pressure during incident triage")
# - Key parameters: Mention required parameters and what they identify
#   (e.g., "Requires vpnName to identify the target Message VPN")
# - What it does NOT do: Clarify scope if confusion with another tool is likely
#   (e.g., "For per-queue metrics, use get-queue-metrics instead")
# - Keep it concise: Aim for 2-4 sentences
# - Avoid jargon where possible: Prefer "message backlog" over "spool utilization"
#   BUT never label a cumulative lifetime counter as "depth" or "backlog".
#   spooledMsgCount (MsgVpnQueue) is the total messages ever spooled since queue
#   creation / last stats clear — it only increases and is NOT the current number
#   of messages in the queue. SEMPv2 does not expose live queue depth as a
#   scalar; say so rather than implying spooledMsgCount is it. Also note
#   msgSpoolUsage is in bytes but maxMsgSpoolUsage is in megabytes.
# - Pagination limits: For list tools with maxResults, state the default and cap
#   in the description (e.g., "Returns up to 100 by default (max 500 via maxResults)").
#   These values are defined as constants in executor.go (defaultMax, capMax) —
#   keep descriptions in sync if those constants change.

tools:
  - name: get-rdp-status
    description: >
      Get the operational status of a REST Delivery Point including its
      enabled state, up/down status, client name, client profile, last
      failure reason, queue bindings, and REST consumer status.
      The response includes a summary block with bindingDownCount / consumerDownCount
      (bindings or REST consumers with up == false; these objects have no
      admin-disable axis, so this is simply the not-up count — unlike
      list-rdps.downCount, which is enabled && !up), and
      byBindingLastFailureReason / byConsumerLastFailureReason (active
      failures only; recovered entries with stale reasons are excluded).
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN containing the RDP"
      - name: restDeliveryPointName
        type: string
        required: true
        description: "The name of the REST Delivery Point"
    steps:
      - id: rdpStatus
        operation: monitor/getMsgVpnRestDeliveryPoint
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          restDeliveryPointName: "{{.Params.restDeliveryPointName}}"
        select:
          - clientName
          - clientProfileName
          - enabled
          - lastFailureReason
          - lastFailureTime
          - msgVpnName
          - restDeliveryPointName
          - timeConnectionsBlocked
          - up
      - id: queueBindings
        operation: monitor/getMsgVpnRestDeliveryPointQueueBindings
        parallel: true
        followPages: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          restDeliveryPointName: "{{.Params.restDeliveryPointName}}"
          count: "100"
        select:
          - lastFailureReason
          - lastFailureTime
          - postRequestTarget
          - queueBindingName
          - restDeliveryPointName
          - up
          - uptime
      - id: restConsumers
        operation: monitor/getMsgVpnRestDeliveryPointRestConsumers
        parallel: true
        followPages: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          restDeliveryPointName: "{{.Params.restDeliveryPointName}}"
          count: "100"
        select:
          - authenticationScheme
          - enabled
          - httpRequestOutstandingTxMsgCount
          - httpRequestTimedOutTxMsgCount
          - httpRequestTxMsgCount
          - httpResponseErrorRxMsgCount
          - httpResponseSuccessRxMsgCount
          - lastConnectionFailureReason
          - lastConnectionFailureTime
          - lastFailureReason
          - lastFailureTime
          - outgoingConnectionCount
          - remoteHost
          - remotePort
          - restConsumerName
          - restDeliveryPointName
          - up
    result:
      strategy: postProcess
      postProcess: getRdpStatus

  # get-queue-metrics is implemented as a native mixed-protocol Go handler
  # (internal/tools/queuemetrics) rather than a composite tool: it merges the
  # SEMPv2 monitor snapshot with an authoritative SEMPv1 "show queue detail"
  # live-depth block, which the SEMPv2-only composite engine cannot express.

  - name: get-client-details
    description: >
      Get per-client performance metrics including the slowSubscriber field.
      slowSubscriber=true means the broker's TCP egress to the client has been
      blocked for several seconds in the last minute (TCP window closed);
      primarily catches slow direct-messaging clients. slowSubscriber=false does
      not rule out slow consumers — for slow guaranteed-message consumers (slow
      to ACK), use get-queue-metrics: a queue with growing spooledMsgCount, high
      txUnackedMsgCount, and rxMsgRate > txMsgRate while bindCount > 0 indicates
      consumer-side slowness.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN the client is connected to"
      - name: clientName
        type: string
        required: true
        description: "The name of the client connection"
    steps:
      - id: clientDetails
        operation: monitor/getMsgVpnClient
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          clientName: "{{.Params.clientName}}"
          select: "averageRxMsgRate, averageTxMsgRate, clientAddress, clientName, clientUsername, elidingTopicCount, keepalive, msgVpnName, platform, rxByteRate, rxDiscardedMsgCount, rxFlowCount, rxMsgCount, rxMsgRate, slowSubscriber, softwareVersion, subscriptionCount, txByteRate, txDiscardedMsgCount, txFlowCount, txMsgCount, txMsgRate, uptime"
    result:
      strategy: collect

  - name: list-client-subscriptions
    description: >
      List topic subscriptions for a specific client. Returns up to 100
      by default (max 500 via maxResults). Use this to understand what topics
      a client is subscribed to and diagnose subscription patterns.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN the client is connected to"
      - name: clientName
        type: string
        required: true
        description: "The name of the client connection"
      - name: maxResults
        type: integer
        required: false
        description: "Maximum number of subscriptions to return (default 100, max 500)"
    steps:
      - id: subscriptions
        operation: monitor/getMsgVpnClientSubscriptions
        followPages: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          clientName: "{{.Params.clientName}}"
          count: "100"
    result:
      strategy: collect

  - name: get-vpn-status
    description: >
      Get operational status and connection statistics for a Message VPN.
      Returns enabled state, active connection count, total subscription
      count, and service states for AMQP, MQTT, REST, and SMF protocols
      (plaintext and TLS variants where applicable). Reports raw state, not
      a health verdict - whether a VPN is "healthy" depends on
      deployment intent this tool doesn't have (e.g. a VPN with zero active
      connections may be idle by design, not broken). Use this to check
      whether a VPN's services are up and identify service-level problems.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The name of the Message VPN"
    steps:
      - id: vpnStatus
        operation: monitor/getMsgVpn
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          select: "discardedRxMsgCount, discardedTxMsgCount, enabled, maxConnectionCount, msgSpoolMsgCount, msgSpoolUsage, msgVpnConnections, msgVpnConnectionsServiceMqtt, msgVpnConnectionsServiceRestIncoming, msgVpnConnectionsServiceRestOutgoing, msgVpnConnectionsServiceSmf, msgVpnConnectionsServiceWeb, msgVpnName, msgVpnTotalUniqueSubscriptions, serviceAmqpPlainTextFailureReason, serviceAmqpPlainTextUp, serviceMqttPlainTextFailureReason, serviceMqttPlainTextUp, serviceMqttTlsFailureReason, serviceMqttTlsUp, serviceRestIncomingPlainTextFailureReason, serviceRestIncomingPlainTextUp, serviceRestIncomingTlsFailureReason, serviceRestIncomingTlsUp, serviceSmfPlainTextFailureReason, serviceSmfPlainTextUp, serviceSmfTlsFailureReason, serviceSmfTlsUp, state"
    result:
      strategy: collect

  - name: list-vpns
    description: >
      List Message VPNs on the broker with their enabled state, connection
      count, and basic status. Returns up to 100 by default (max 500
      via maxResults). Use this to discover which VPNs exist and identify any
      that are down or have no active connections. The response summary counts
      enabled VPNs in state == "down" under downCount and enabled+up VPNs with
      no non-reserved client connected under zeroConnectionCount — derived by
      probing each enabled+up VPN for a client whose clientUsername does not
      match Solace's reserved `#*` prefix. Standby VPNs are excluded from both.
      Admin-disabled VPNs land in disabledCount only and are excluded from
      downCount and zeroConnectionCount.
    annotations:
      readOnly: true
    parameters:
      - name: maxResults
        type: integer
        required: false
        description: "Maximum number of VPNs to return (default 100, max 500)"
    steps:
      - id: vpns
        operation: monitor/getMsgVpns
        followPages: true
        args:
          count: "100"
        select:
          - discardedRxMsgCount
          - discardedTxMsgCount
          - dmrEnabled
          - enabled
          - msgSpoolMsgCount
          - msgSpoolUsage
          - msgVpnConnections
          - msgVpnConnectionsServiceMqtt
          - msgVpnConnectionsServiceRestIncoming
          - msgVpnConnectionsServiceSmf
          - msgVpnConnectionsServiceWeb
          - msgVpnName
          - msgVpnTotalUniqueSubscriptions
          - replicationEnabled
          - serviceMqttPlainTextFailureReason
          - serviceMqttPlainTextUp
          - serviceRestIncomingPlainTextFailureReason
          - serviceRestIncomingPlainTextUp
          - serviceSmfPlainTextFailureReason
          - serviceSmfPlainTextUp
          - state
      # Per-VPN "is any real (non-reserved) client connected?" probe. Feeds
      # zeroConnectionCount in the postProcess handler. The `#*` prefix on
      # clientUsername is Solace's documented reserved-name contract, so this
      # is version-independent — no reliance on the empirical `#client
      # counts as exactly one connection` invariant the old <=1 predicate
      # rode on. count=1 is a boolean check: any row returned means the VPN
      # has a real client. select=[clientName] keeps the payload minimal.
      # forEachIf restricts the probe to enabled+up VPNs, which are exactly the
      # rows the postProcess handler consults for zeroConnectionCount. Disabled
      # VPNs report state==down, and standby VPNs are excluded from the count;
      # calling getMsgVpnClients on either would be wasted work (and hits an
      # admin-disabled service on some brokers).
      - id: real-clients
        operation: monitor/getMsgVpnClients
        forEach: vpns
        forEachIf: '{{and .Item.enabled (eq .Item.state "up")}}'
        forEachKey: msgVpnName
        args:
          msgVpnName: "{{.Item.msgVpnName}}"
          count: "1"
          where: "clientUsername!=#*"
        select:
          - clientName
    result:
      strategy: postProcess
      postProcess: listVpns

  - name: list-queues
    description: >
      List queues in a VPN with spooledMsgCount, unacked count
      (txUnackedMsgCount), bindCount, congestion state, and rates. Returns up to
      100 by default (max 500 via maxResults). IMPORTANT: spooledMsgCount is the
      cumulative lifetime count of messages ever spooled to each queue (it only
      increases since queue creation / last stats clear) — it is NOT the current
      number of messages in the queue and does NOT decrease as messages are
      consumed. SEMPv2 does not expose live queue depth as a scalar; do not
      report spooledMsgCount as the current backlog. The response summary counts
      queues with no consumers, congestion, and near-full spool (>=80% of
      quota); it deliberately omits a live-backlog count because that is not
      derivable from these fields. Primary VPN-wide scan for slow
      guaranteed-message consumers: queues with spooledMsgCount rising across
      successive calls, txUnackedMsgCount high, rxMsgRate > txMsgRate, and
      bindCount > 0 indicate consumer-side slowness even when slowSubscriber is
      false on the bound client.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN to list queues for"
      - name: maxResults
        type: integer
        required: false
        description: "Maximum number of queues to return (default 100, max 500)"
    steps:
      - id: queues
        operation: monitor/getMsgVpnQueues
        followPages: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          count: "100"
        select:
          - accessType
          - bindCount
          - egressEnabled
          - ingressEnabled
          - lowPriorityMsgCongestionState
          - maxMsgSpoolUsage
          - msgSpoolUsage
          - msgVpnName
          - queueName
          - rxMsgRate
          - spooledMsgCount
          - txMsgRate
          - txUnackedMsgCount
    result:
      strategy: postProcess
      postProcess: listQueues

  - name: list-clients
    description: >
      List active clients in a VPN with rates, uptime, and the slowSubscriber
      field. Returns up to 100 by default (max 500 via maxResults).
      slowSubscriber=true flags TCP-egress stalls (mainly relevant to direct
      messaging) — it does not flip for slow guaranteed-message consumers. To
      scan a VPN for slow guaranteed consumers, use list-queues and look for
      queues with growing spooledMsgCount, high txUnackedMsgCount, and rxMsgRate
      > txMsgRate while bindCount > 0.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN to list clients for"
      - name: maxResults
        type: integer
        required: false
        description: "Maximum number of clients to return (default 100, max 500)"
    steps:
      - id: clients
        operation: monitor/getMsgVpnClients
        followPages: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          count: "100"
          select: "clientAddress, clientName, clientUsername, msgVpnName, platform, rxMsgRate, slowSubscriber, txMsgRate, uptime"
    result:
      strategy: collect

  - name: get-message-rates
    description: >
      Get current and average message and byte throughput rates for a Message
      VPN. Use this to assess traffic volume and identify high-traffic VPNs.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The name of the Message VPN"
    steps:
      - id: rates
        operation: monitor/getMsgVpn
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          select: "averageRxByteRate, averageRxMsgRate, averageTxByteRate, averageTxMsgRate, msgVpnName, rxByteRate, rxMsgRate, txByteRate, txMsgRate"
    result:
      strategy: collect

  - name: list-rdps
    description: >
      List all REST Delivery Points in a Message VPN with their enabled state,
      up/down status, and last failure reason. Use this to discover which RDPs
      exist and identify any that are down. The response includes a summary
      block with downCount (enabled RDPs that are not up — the unexpectedly-down set),
      disabledCount, and byLastFailureReason (counts of unexpectedly-down RDPs
      grouped by their failure reason; admin-disabled RDPs and recovered RDPs
      with stale reasons are excluded). For detailed RDP status including
      consumers and queue bindings, use get-rdp-status.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN to list REST Delivery Points for"
      - name: maxResults
        type: integer
        required: false
        description: "Maximum number of RDPs to return (default 100, max 500)"
    steps:
      - id: rdps
        operation: monitor/getMsgVpnRestDeliveryPoints
        followPages: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          count: "100"
        select:
          - clientName
          - enabled
          - lastFailureReason
          - lastFailureTime
          - msgVpnName
          - restDeliveryPointName
          - up
    result:
      strategy: postProcess
      postProcess: listRdps

  - name: list-bridges
    description: >
      List Bridges in a Message VPN with their enabled state, inbound/outbound
      connection state, and last inbound failure reason. Use this to discover
      which bridges exist and identify any that are down. Returns up to 100 by
      default (max 500 via maxResults). A bridge has two independent
      connection directions — inboundState (messages arriving from the remote
      broker) and outboundState (messages sent to it) — either can fail on its
      own. The response summary counts downCount (enabled bridges where the
      applicable direction(s) aren't in an up state; a direction reporting
      "not-applicable" doesn't apply to this bridge and is excluded),
      disabledCount, and byInboundFailureReason (active inbound failures only;
      recovered bridges with stale reasons are excluded — SEMP has no
      equivalent failure-reason field for outbound). For additional per-bridge
      diagnostic detail — connection establisher, failure category, and
      client name — use get-bridge-status.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN to list Bridges for"
      - name: maxResults
        type: integer
        required: false
        description: "Maximum number of bridges to return (default 100, max 500)"
    steps:
      - id: bridges
        operation: monitor/getMsgVpnBridges
        followPages: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          count: "100"
        select:
          - bridgeName
          - bridgeVirtualRouter
          - enabled
          - inboundFailureReason
          - inboundState
          - msgVpnName
          - outboundState
          - remoteMsgVpnName
          - remoteRouterName
          - uptime
    result:
      strategy: postProcess
      postProcess: listBridges

  - name: get-bridge-status
    description: >
      Get the operational status of a Bridge including its enabled state,
      inbound and outbound connection state, last inbound failure reason,
      uptime, and the remote Message VPN and broker it connects to. A bridge
      has two independent connection directions — inboundState (messages
      arriving from the remote broker) and outboundState (messages sent to
      it) — either can fail independently, so check both rather than assuming
      one implies the other; a bridge with outboundState=="ready" but a stuck
      inboundState is still broken for messages flowing in that direction.
      bridgeVirtualRouter is almost always "auto" unless the broker
      participates in an HA-redundant pair with distinct primary/backup
      bridges. Use list-bridges first to discover which bridges exist and
      identify down ones.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN containing the Bridge"
      - name: bridgeName
        type: string
        required: true
        description: "The name of the Bridge"
      - name: bridgeVirtualRouter
        type: string
        required: true
        description: "The virtual router of the Bridge: primary, backup, or auto (most brokers use auto)"
    steps:
      - id: bridgeStatus
        operation: monitor/getMsgVpnBridge
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          bridgeName: "{{.Params.bridgeName}}"
          bridgeVirtualRouter: "{{.Params.bridgeVirtualRouter}}"
          select: "bridgeName, bridgeVirtualRouter, clientName, enabled, establisher, inboundFailureReason, inboundState, msgVpnName, outboundState, remoteMsgVpnName, remoteRouterName, rxConnectionFailureCategory, uptime"
    result:
      strategy: collect

  - name: get-replication-status
    description: >
      Get replication state for a Message VPN including role, sync eligibility,
      bridge status, transaction mode, and queued message counts. Use this to
      diagnose replication sync issues. Note: SEMP does not expose current
      lagSeconds; replicationActiveTransitionToSyncIneligibleCount is the most
      useful "has replication been flaky recently?" signal.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The name of the Message VPN"
    steps:
      - id: replication
        operation: monitor/getMsgVpn
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          select: "msgVpnName, replicationAckPropagationIntervalMsgCount, replicationActiveAsyncQueuedMsgCount, replicationActiveSyncEligiblePeakTime, replicationActiveSyncIneligiblePeakTime, replicationActiveSyncQueuedAsAsyncMsgCount, replicationActiveSyncQueuedMsgCount, replicationActiveTransitionToSyncIneligibleCount, replicationBridgeBoundToQueue, replicationBridgeUp, replicationEnabled, replicationQueueBound, replicationQueueMaxMsgSpoolUsage, replicationRejectMsgWhenSyncIneligibleEnabled, replicationRemoteBridgeUp, replicationRole, replicationSyncEligible, replicationTransactionMode"
    result:
      strategy: collect

  - name: list-slow-subscribers
    description: >
      Lists clients in a Message VPN flagged with the broker's slowSubscriber
      flag. Narrow signal: fires when the broker has data to send but the
      client's TCP receive window has been closed for several seconds in the
      last minute — primarily catches direct-messaging or replication-bridge
      backpressure. Does NOT flip for slow guaranteed-message consumers (slow
      to ACK), because the broker self-throttles via the transmit window
      before TCP egress can stall. To find slow guaranteed consumers, use
      list-queues / get-queue-metrics. Server-side filtered via SEMP where
      clause — only matching clients are returned. The response includes a
      summary block with byClientProfile, byPlatform (grouped counts),
      and totalTxDiscardedMsgCount (cumulative lifetime discards across
      all slow subscribers, not a rate).
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN to search for slow subscribers"
      - name: maxResults
        type: integer
        required: false
        description: "Maximum number of slow subscribers to return (default 100, max 500)"
    steps:
      - id: slowSubscribers
        operation: monitor/getMsgVpnClients
        followPages: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          count: "100"
          where: "slowSubscriber==true"
        select:
          - clientAddress
          - clientName
          - clientProfileName
          - clientUsername
          - msgVpnName
          - platform
          - rxMsgRate
          - slowSubscriber
          - txDiscardedMsgCount
          - txMsgRate
          - uptime
    result:
      strategy: postProcess
      postProcess: listSlowSubscribers

  - name: list-queue-discards
    description: >
      List per-queue message discard counts for a Message VPN. Returns each
      queue with its TTL-expired, max-redelivery-exceeded, spool-quota-exceeded,
      and other discard category counters. Use this to diagnose why messages
      are being dropped across queues. The response summary counts queues with any
      cumulative discards (discardingQueueCount) and provides topOffenderQueues —
      the top 10 by total cumulative count of truly-lost discards (messages
      successfully moved to a DMQ are excluded), each annotated with its
      dominantCategory; topOffenderQueues is omitted from summary entirely when
      no discards are present, so its absence is a meaningful zero signal.
      For broker-wide or per-VPN aggregate totals, use get-discard-stats.
    annotations:
      readOnly: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN to summarize discards for"
      - name: maxResults
        type: integer
        required: false
        description: "Maximum number of queues to return (default 100, max 500)"
    steps:
      - id: queueDiscards
        operation: monitor/getMsgVpnQueues
        followPages: true
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          count: "100"
        select:
          - clientProfileDeniedDiscardedMsgCount
          - destinationGroupErrorDiscardedMsgCount
          - disabledDiscardedMsgCount
          - lowPriorityMsgCongestionDiscardedMsgCount
          - maxMsgSizeExceededDiscardedMsgCount
          - maxMsgSpoolUsageExceededDiscardedMsgCount
          - maxRedeliveryExceededDiscardedMsgCount
          - maxRedeliveryExceededToDmqFailedMsgCount
          - maxRedeliveryExceededToDmqMsgCount
          - maxTtlExceededDiscardedMsgCount
          - maxTtlExpiredDiscardedMsgCount
          - maxTtlExpiredToDmqFailedMsgCount
          - maxTtlExpiredToDmqMsgCount
          - msgVpnName
          - noLocalDeliveryDiscardedMsgCount
          - queueName
          - xaTransactionNotSupportedDiscardedMsgCount
    result:
      strategy: postProcess
      postProcess: listQueueDiscards

  - name: create-message-vpn
    description: >
      Create a Message VPN. Requires msgVpnName to name the new VPN; any
      attribute omitted from msgVpnConfig is set to its broker default. Use this
      to provision a new VPN. Fails if a VPN with the same name already exists.
      BEFORE INVOKING THIS TOOL, obtain explicit user confirmation, restating
      the target (broker, VPN name) and that a new VPN will be created on the
      broker. The confirmation MUST come as a separate user reply received AFTER
      you state the target and effect — do not treat the user's original request
      as a pre-confirmation, even if it implies intent.
    annotations:
      readOnly: false
      destructive: false
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The name of the Message VPN to create"
      - name: msgVpnConfig
        type: object
        required: false
        description: "Optional MsgVpn attributes (enabled, maxConnectionCount, maxMsgSpoolUsage, etc.). Omitted attributes use broker defaults. Do not include msgVpnName here."
    steps:
      - id: createVpn
        operation: config/createMsgVpn
    result:
      strategy: collect

  - name: update-message-vpn
    description: >
      Update an existing Message VPN. Requires msgVpnName to identify the VPN;
      provide only the attributes you want to change in msgVpnConfig. Omitted
      attributes are left unchanged. Use this to update VPN settings such as
      enabled state, connection limits, or spool quotas.
      BEFORE INVOKING THIS TOOL, obtain explicit user confirmation, restating
      the target (broker, VPN name) and the attributes that will change. The
      confirmation MUST come as a separate user reply received AFTER you state
      the target and effect — do not treat the user's original request as a
      pre-confirmation, even if it implies intent.
    annotations:
      readOnly: false
      destructive: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The name of the Message VPN to modify"
      - name: msgVpnConfig
        type: object
        required: true
        description: "MsgVpn attributes to update (enabled, maxConnectionCount, maxMsgSpoolUsage, etc.). Only provided attributes are changed. Do not include msgVpnName here."
    steps:
      - id: updateVpn
        operation: config/updateMsgVpn
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
    result:
      strategy: collect

  - name: delete-message-vpn
    description: >
      Delete a Message VPN. Requires msgVpnName to identify the VPN to delete.
      This is a destructive operation that removes the VPN and all its
      configuration. The VPN must have no active client connections before
      deletion.
      BEFORE INVOKING THIS TOOL, obtain explicit user confirmation, restating
      the target (broker, VPN name) and that the VPN and all its configuration
      will be permanently removed. The confirmation MUST come as a separate user
      reply received AFTER you state the target and effect — do not treat the
      user's original request as a pre-confirmation, even if it implies intent.
    annotations:
      readOnly: false
      destructive: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The name of the Message VPN to delete"
    steps:
      - id: deleteVpn
        operation: config/deleteMsgVpn
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
    result:
      strategy: collect

  - name: create-queue
    description: >
      Create a queue in a Message VPN. Requires msgVpnName to identify the VPN
      and queueName to name the new queue; any attribute omitted from queueConfig
      is set to its broker default. Use this to provision a new queue. Fails if a
      queue with the same name already exists in the VPN.
      BEFORE INVOKING THIS TOOL, obtain explicit user confirmation, restating
      the target (broker, VPN, queue name) and that a new queue will be created.
      The confirmation MUST come as a separate user reply received AFTER you
      state the target and effect — do not treat the user's original request as
      a pre-confirmation, even if it implies intent.
    annotations:
      readOnly: false
      destructive: false
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN to create the queue in"
      - name: queueName
        type: string
        required: true
        description: "The name of the queue to create"
      - name: queueConfig
        type: object
        required: false
        description: "Optional Queue attributes (accessType, egressEnabled, ingressEnabled, maxMsgSpoolUsage, permission, etc.). Omitted attributes use broker defaults. Do not include msgVpnName or queueName here."
    steps:
      - id: createQueue
        operation: config/createMsgVpnQueue
        # Only msgVpnName is a path param of POST .../queues. queueName is
        # deliberately omitted from args so constructRequestBody spreads it into
        # the request body, where SEMP expects it for create.
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
    result:
      strategy: collect

  - name: update-queue
    description: >
      Update an existing queue. Requires msgVpnName and queueName to identify the
      queue; provide only the attributes you want to change in queueConfig.
      Omitted attributes are left unchanged. Use this to update queue settings
      such as enabled state, access type, spool quota, or redelivery limits.
      BEFORE INVOKING THIS TOOL, obtain explicit user confirmation, restating
      the target (broker, VPN, queue name) and the attributes that will change.
      The confirmation MUST come as a separate user reply received AFTER you
      state the target and effect — do not treat the user's original request as
      a pre-confirmation, even if it implies intent.
    annotations:
      readOnly: false
      destructive: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN containing the queue"
      - name: queueName
        type: string
        required: true
        description: "The name of the queue to modify"
      - name: queueConfig
        type: object
        required: true
        description: "Queue attributes to update (egressEnabled, ingressEnabled, maxMsgSpoolUsage, maxRedeliveryCount, permission, etc.). Only provided attributes are changed. Do not include msgVpnName or queueName here."
    steps:
      - id: updateQueue
        operation: config/updateMsgVpnQueue
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          queueName: "{{.Params.queueName}}"
    result:
      strategy: collect

  - name: delete-queue
    description: >
      Delete a queue from a Message VPN. Requires msgVpnName and queueName to
      identify the queue to delete. This is a destructive operation that removes
      the queue and discards any messages still spooled on it.
      BEFORE INVOKING THIS TOOL, obtain explicit user confirmation, restating
      the target (broker, VPN, queue name) and that the queue and any spooled
      messages will be permanently lost. The confirmation MUST come as a separate
      user reply received AFTER you state the target and effect — do not treat
      the user's original request as a pre-confirmation, even if it implies
      intent.
    annotations:
      readOnly: false
      destructive: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN containing the queue"
      - name: queueName
        type: string
        required: true
        description: "The name of the queue to delete"
    steps:
      - id: deleteQueue
        operation: config/deleteMsgVpnQueue
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          queueName: "{{.Params.queueName}}"
    result:
      strategy: collect

  - name: delete-queue-messages
    description: >
      Permanently delete ALL spooled messages from a queue. This is irreversible
      — the deleted messages cannot be recovered. BEFORE INVOKING THIS TOOL,
      obtain explicit user confirmation, restating the target (broker, VPN,
      queue) and that all spooled messages will be permanently lost. The
      confirmation MUST come as a separate user reply received AFTER you state
      the target and effect — do not treat the user's original request as a
      pre-confirmation, even if it implies intent. Use after confirmed intent
      to drain a queue (e.g. clearing a dead-letter backlog).
    annotations:
      readOnly: false
      destructive: true
      idempotent: false
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN containing the queue."
      - name: queueName
        type: string
        required: true
        description: "The name of the queue to act on."
    steps:
      - id: deleteMsgs
        operation: action/doMsgVpnQueueDeleteMsgs
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          queueName: "{{.Params.queueName}}"
    result:
      strategy: collect

  - name: clear-queue-stats
    description: >
      Reset the statistics counters for a queue. Non-destructive: this resets
      monitoring counters only and does not affect spooled messages or message
      delivery. Useful for establishing a fresh metrics baseline during testing.
      To purge/drain messages from a queue, use delete-queue-messages instead.
    annotations:
      readOnly: false
      destructive: false
      idempotent: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN containing the queue."
      - name: queueName
        type: string
        required: true
        description: "The name of the queue to act on."
    steps:
      - id: clearStats
        operation: action/doMsgVpnQueueClearStats
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          queueName: "{{.Params.queueName}}"
    result:
      strategy: collect

  - name: create-topic-endpoint
    description: >
      Create a topic endpoint in a Message VPN. Requires msgVpnName to identify
      the VPN and topicEndpointName to name the new topic endpoint; any attribute
      omitted from topicEndpointConfig is set to its broker default. Use this to
      provision a new topic endpoint. Fails if a topic endpoint with the same
      name already exists in the VPN.
      BEFORE INVOKING THIS TOOL, obtain explicit user confirmation, restating
      the target (broker, VPN, topic endpoint name) and that a new topic endpoint
      will be created. The confirmation MUST come as a separate user reply
      received AFTER you state the target and effect — do not treat the user's
      original request as a pre-confirmation, even if it implies intent.
    annotations:
      readOnly: false
      destructive: false
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN to create the topic endpoint in"
      - name: topicEndpointName
        type: string
        required: true
        description: "The name of the topic endpoint to create"
      - name: topicEndpointConfig
        type: object
        required: false
        description: "Optional TopicEndpoint attributes (accessType, egressEnabled, ingressEnabled, maxMsgSpoolUsage, permission, etc.). Omitted attributes use broker defaults. Do not include msgVpnName or topicEndpointName here."
    steps:
      - id: createTopicEndpoint
        operation: config/createMsgVpnTopicEndpoint
        # Only msgVpnName is a path param of POST .../topicEndpoints.
        # topicEndpointName is deliberately omitted from args so
        # constructRequestBody spreads it into the request body, where SEMP
        # expects it for create.
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
    result:
      strategy: collect

  - name: update-topic-endpoint
    description: >
      Update an existing topic endpoint. Requires msgVpnName and
      topicEndpointName to identify the topic endpoint; provide only the
      attributes you want to change in topicEndpointConfig. Omitted attributes are
      left unchanged. Use this to update topic endpoint settings such as enabled
      state, access type, or spool quota.
      BEFORE INVOKING THIS TOOL, obtain explicit user confirmation, restating
      the target (broker, VPN, topic endpoint name) and the attributes that will
      change. The confirmation MUST come as a separate user reply received AFTER
      you state the target and effect — do not treat the user's original request
      as a pre-confirmation, even if it implies intent.
    annotations:
      readOnly: false
      destructive: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN containing the topic endpoint"
      - name: topicEndpointName
        type: string
        required: true
        description: "The name of the topic endpoint to modify"
      - name: topicEndpointConfig
        type: object
        required: true
        description: "TopicEndpoint attributes to update (egressEnabled, ingressEnabled, maxMsgSpoolUsage, maxRedeliveryCount, permission, etc.). Only provided attributes are changed. Do not include msgVpnName or topicEndpointName here."
    steps:
      - id: updateTopicEndpoint
        operation: config/updateMsgVpnTopicEndpoint
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          topicEndpointName: "{{.Params.topicEndpointName}}"
    result:
      strategy: collect

  - name: delete-topic-endpoint
    description: >
      Delete a topic endpoint from a Message VPN. Requires msgVpnName and
      topicEndpointName to identify the topic endpoint to delete. This is a
      destructive operation that removes the topic endpoint and discards any
      messages still spooled on it.
      BEFORE INVOKING THIS TOOL, obtain explicit user confirmation, restating
      the target (broker, VPN, topic endpoint name) and that the topic endpoint
      and any spooled messages will be permanently lost. The confirmation MUST
      come as a separate user reply received AFTER you state the target and
      effect — do not treat the user's original request as a pre-confirmation,
      even if it implies intent.
    annotations:
      readOnly: false
      destructive: true
    parameters:
      - name: msgVpnName
        type: string
        required: true
        description: "The Message VPN containing the topic endpoint"
      - name: topicEndpointName
        type: string
        required: true
        description: "The name of the topic endpoint to delete"
    steps:
      - id: deleteTopicEndpoint
        operation: config/deleteMsgVpnTopicEndpoint
        args:
          msgVpnName: "{{.Params.msgVpnName}}"
          topicEndpointName: "{{.Params.topicEndpointName}}"
