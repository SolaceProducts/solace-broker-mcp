# Solace Broker MCP Server — Example Configuration
#
# Copy this file and edit for your environment:
#   cp broker-config.example.yaml config.yaml
#
# Credentials use ${VAR_NAME} substitution. Set the referenced variables
# via environment variables or a .env file alongside this config.
#
# Config file resolution order:
#   1. CONFIG_FILE env var (explicit path)
#   2. /etc/mcp-server/config.yaml (system install)
#   3. ./broker-config.yaml (local development)

port: 9090
log_level: info   # debug, info, warn, error

# Host the server binds to. Leave unset for the secure default:
#   - mcp_client_auth.mode: oauth      -> all interfaces (production listener)
#   - mcp_client_auth.mode: disabled/static -> 127.0.0.1 only (dev modes stay
#     off the network unless you opt in)
# Set explicitly (e.g. "0.0.0.0") to override. Binding a non-loopback address
# under mode: disabled additionally requires allow_remote_unauthenticated: true.
#
# IN A CONTAINER, the loopback default binds the CONTAINER's loopback, so a
# published port (docker run -p 9090:9090) reaches nothing and the connection
# is refused. This file is written for running the binary directly. To run it
# in a container, use the static-token recipe below, which pairs a routable
# bind with a token so the port is not left unauthenticated:
#   listen_address: "0.0.0.0"
#   mcp_client_auth:
#     mode: static
#     dev_token: "${DEV_TOKEN}"
# deploy/kubernetes/ ships exactly that combination.
# listen_address: "127.0.0.1"

# TLS — set both to enable HTTPS, or terminate TLS at a load balancer.
tls_cert_file: ""
tls_key_file: ""

# Under mcp_client_auth.mode: oauth (production), the server refuses to start
# with a plaintext listener unless TLS is configured above OR you acknowledge
# that TLS is terminated by an upstream proxy/ingress. Not needed by the
# dev-mode default below, so it is left off; uncomment it when you turn on
# oauth behind a TLS-terminating proxy/ingress, and the server serves plaintext
# with a startup WARN. Set tls_cert_file/tls_key_file above instead to
# terminate TLS at the server.
#
# Bind scope: this flag does not restrict where the server binds. Under
# mode: oauth, listen_address defaults to all interfaces, so the plaintext port
# is reachable by anything that can route to it — not just the terminating
# proxy. Set listen_address above to the proxy-facing interface only.
# tls_terminated_upstream: true

# Under mcp_client_auth.mode: oauth (production), a broker with
# insecure_skip_verify: true is refused at startup. Uncomment to accept the risk
# that disabling broker cert verification exposes the broker admin credential to MITM.
# allow_insecure_broker_tls: true

# Client authentication for the MCP server (Hop 1: MCP client → MCP server).
# mode is required. Choose one of:
#   - oauth    — JWT validation via OIDC (production)
#   - static   — shared static dev token (development only)
#   - disabled — no client auth, every request passes through (development only)
#
# Note: the previous `development_mode` flag is deprecated and ignored.
# Operational profile (https:// requirement, etc.) is now derived from
# mcp_client_auth.mode: oauth = production, disabled/static = development.
mcp_client_auth:
  # Default: no client authentication, so this example runs as-is with no
  # identity provider to set up. This is safe only because the dev modes bind
  # 127.0.0.1 only (see listen_address above) — the server is not reachable
  # from off this host. Do not expose this mode on a routable interface.
  #
  # FOR PRODUCTION, TURN ON OAUTH: delete `mode: disabled` below and uncomment
  # the oauth block that follows it. OAuth is the only mode intended to be
  # reachable over a network; it validates a JWT on every request. Two further
  # settings are mandatory under oauth and the server refuses to start without
  # them: `tool_authorization.enabled` (below) and, unless you set
  # tls_cert_file/tls_key_file, `tls_terminated_upstream: true` (above).
  mode: disabled

  # Or, for basic protection without an identity provider, use a shared static
  # token instead — replace `mode: disabled` above with these two lines. Set
  # DEV_TOKEN in your environment or .env file; the token does not expire and
  # every caller shares it, so treat it like a password.
  #
  # mode: static
  # dev_token: "${DEV_TOKEN}"

  # Production (Hop 1: MCP client -> MCP server). Supply your IdP's values:
  #
  # mode: oauth
  # issuer: "https://idp.example.com"
  # audience: "mcp-server"
  # resource_url: "https://mcp.example.com/mcp"
  #
  # scopes_supported — RFC 9728 PRM list MCP clients request at the IdP.
  # Omit, null, or [] → advertised ["openid"], whatever the IdP. The process
  # still starts either way; there is no way to advertise an empty list.
  # Entra: keep openid AND add this API's delegated scope — openid alone with
  # resource = the MCP URL was refused with AADSTS9010010 in our testing.
  # Blank or whitespace-in-entry is a load error. Not brokers.*.auth.target.
  #
  # scopes_supported:
  #   - "openid"
  #   - "https://mcp.example.com/mcp/access_as_user"
  #
  # Switching to oauth also requires, above: tls_terminated_upstream: true (or
  # tls_cert_file/tls_key_file), since oauth refuses a plaintext listener.

  # Tool authorization (RBAC). REQUIRED under mode: oauth — you must opt in or
  # out explicitly with the `enabled` field. A tool_authorization block under
  # mode: static or mode: disabled is rejected at startup, which is why it is
  # left commented out under the dev-mode default above.
  #
  # Turn it OFF (all authenticated callers can invoke any tool):
  #
  # tool_authorization:
  #   enabled: false
  #
  # Turn it ON — gates which MCP tools a caller may invoke based on the groups
  # carried by their access token:
  #
  # tool_authorization:
  #   enabled: true
  #   groups_claim_name: "groups"      # optional; defaults to "groups". Must
  #                                    # match the claim your IdP emits.
  #   access_level_groups:             # required when enabled: true
  #     Ops:
  #       - list-vpns
  #       - list-queues
  #       - get-queue-metrics
  #     Admin:                          # examples only — to grant every tool
  #       - list-vpns                   # to a group, list every tool name
  #       - list-queues                 # explicitly (no wildcard).
  #       - get-queue-metrics
  #       - delete-queue-messages
  #
  # access_level_groups is a map from group name (as it appears in the token)
  # to the list of MCP tool names that group grants. A caller is allowed to
  # invoke a tool when at least one of their groups grants it (union
  # semantics). Every gated tool that no group grants is unreachable.
  #
  # list-brokers is structurally exempt — every authenticated caller can call
  # it regardless of their groups, since a caller needs it to discover which
  # broker aliases exist before invoking any other tool.

# Enable the write/action tools (delete-queue-messages, clear-queue-stats,
# disconnect-client, clear-client-stats). Default false — these write tools do
# not appear in tools/list unless this is explicitly true. Leave off for trial /
# dev deployments; flip on only when an operator deliberately wants the action
# tools available.
# When enabled, an AI assistant can delete queued messages, disconnect clients,
# reset statistics, and create, update, or delete broker configuration (message
# VPNs, queues, topic endpoints, REST delivery points) on the configured brokers.
# enable_write_tools: false

# Broker OAuth (Hop 2) — required only if one or more brokers below use
# auth.mode: oauth instead of basic/bearer. The MCP server obtains each such
# broker's token from the identity provider using the calling agent's Hop 1
# token, so this requires mcp_client_auth.mode: oauth above. See
# docs/authentication.md's "Step 2b" and docs/configuration.md's "Broker OAuth
# (Hop 2)" section for full details, including the optional circuit_breaker and
# retry_after sub-blocks.
#
# grant_type selects the protocol and is required — there is no default. Pick
# ONE of the two blocks below; one broker_oauth block per process, one IdP.
# The grant type also decides how each broker's auth.target travels on the
# wire, which is why there is no separate parameter-name setting.

# Option 1 — RFC 8693 token exchange (e.g. Keycloak):
#
# broker_oauth:
#   idp_token_endpoint: "https://idp.example.com/realms/your-realm/protocol/openid-connect/token"
#   mcp_server_client_id: "mcp-server"     # separate client registration from Hop 1's issuer/audience above
#   mcp_server_client_auth:
#     client_secret_basic:                 # or client_secret_post — exactly one
#       secret: "${MCP_SERVER_CLIENT_SECRET}"
#   grant_type: "urn:ietf:params:oauth:grant-type:token-exchange"
#   # token_expiry_fallback: 1h            # optional; omit = fail-closed when the IdP is silent

# Option 2 — RFC 7523 jwt-bearer (Microsoft Entra ID On-Behalf-Of). Same block,
# different grant_type and endpoint. Entra requires a confidential client, so
# a client secret is still needed; certificate credentials are not supported
# in this version.
#
# broker_oauth:
#   idp_token_endpoint: "https://login.microsoftonline.com/<tenant-id>/oauth2/v2.0/token"
#   mcp_server_client_id: "${MCP_SERVER_APP_ID}"   # this server's Entra app registration
#   mcp_server_client_auth:
#     client_secret_post:                  # or client_secret_basic — exactly one
#       secret: "${MCP_SERVER_CLIENT_SECRET}"
#   grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer"
#   # token_expiry_fallback: 1h            # optional; omit = fail-closed when the IdP is silent

# SEMP client settings — controls how the server talks to brokers.
semp:
  max_concurrent_per_broker: 10
  request_timeout_duration: 1m
  request_min_interval: 100ms
  # Max wait for admission (pacing + in-flight slot) before a request is
  # rejected instead of queued. 0 waits indefinitely.
  max_queue_wait: 30s
  # Share each broker's pace round-robin across callers instead of
  # first-come-first-served, so one caller's burst cannot starve another.
  # A kill switch, not a capacity control: it reslices the budget set by
  # request_min_interval and max_concurrent_per_broker rather than adding to
  # it, and a single active caller still gets all of it. Leave it on.
  fair_scheduling: true
  retries: 10
  retry_min_interval: 3s
  retry_max_interval: 30s

# Observability tunables. The on/off switches are OBS_* environment variables,
# not YAML — see docs/observability.md § "Feature switches". Every key has a
# default, so the block can be omitted; docs/configuration.md § "Observability
# Settings" lists them all.
# observability:
#   metrics_bind_address: ":9091"   # /metrics listener when OBS_METRICS_SCRAPE_ENABLED is set.
#                                   # Must not share `port`. The Kubernetes NetworkPolicy,
#                                   # Service, and Deployment spell this port too.
#   shutdown_drain_delay_s: 10      # raise terminationGracePeriodSeconds with it
#   deployment_environment: ""      # OTel deployment.environment.name; omitted when empty
#   cloud_region: ""                # OTel cloud.region; omitted when empty

# Broker connections. Add one entry per broker.
# Credentials should use ${VAR_NAME} references, not hardcoded values.
# Broker aliases: 1-63 chars, [A-Za-z0-9-], must start and end alphanumeric.
# Aliases are case-insensitive — "Prod" and "prod" collide.
brokers:
  my-broker:
    url: "https://broker.example.com:943"
    # Disables TLS certificate verification for this broker. Under
    # mcp_client_auth.mode: oauth (production) this is refused at startup unless
    # you also set allow_insecure_broker_tls: true (top level) to accept the risk.
    insecure_skip_verify: false
    auth:
      mode: basic           # basic, bearer, or oauth
      username: "${BROKER_USERNAME}"
      password: "${BROKER_PASSWORD}"
      # token: "${BROKER_TOKEN}"  # for bearer mode
      # target — for oauth mode. One string naming this broker's API at the
      # IdP; never a list. Requires broker_oauth: above. How it travels
      # depends on broker_oauth.grant_type:
      #
      #   token-exchange — sent as the RFC 8693 "audience". Optional: omit it
      #     if the broker's OAuth profile does not validate audience.
      #   jwt-bearer     — sent as the OAuth "scope", and this server requires
      #     it: an omitted or empty target still LOADS, then fails every request
      #     against this broker with "jwt-bearer request missing scope", before
      #     the IdP is called. (A whitespace-only value fails at load instead.)
      #     Treat it as mandatory.
      #
      # This is not mcp_client_auth.scopes_supported (Hop 1), and for Entra it
      # is not the broker's required audience either — the broker validates the
      # bare application ID, while this is the scope form.
      #
      # target: "solace-broker-prod"                 # token exchange
      # target: "api://<broker-app-id>/.default"     # Entra jwt-bearer
